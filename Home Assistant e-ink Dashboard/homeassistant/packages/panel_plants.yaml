# ═══════════════════════════════════════════════════════════════════════════
#  reTerminal panels – PLANTS
#
#  Up to 15 plants: name, icon, room, glass size, days per glass. Thirst
#  follows the room temperature. Edit them with plants-card.yaml.
#
#  Needs:  panel_core.yaml (rooms), custom_templates/panel_plants.jinja
#  To turn this feature off: delete this file, or rename it so it no
#  longer ends in .yaml (e.g. panel_x.yaml.off), and restart Home Assistant.
# ═══════════════════════════════════════════════════════════════════════════

