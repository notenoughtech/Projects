template:

  # ───── PLANTS: which room each plant is in ─────
  # Pick a room for each plant with the "Plant N Room" selects (any dashboard,
  # e.g. the card in plants-card.yaml), or long-press a plant on the reTerminal.
  # Their options are always your current Home Assistant areas. Until you pick
  # one, a plant gets a fixed pseudo-random room that has a temperature sensor.
  # The plant's thirst follows its room's temperature (floor average if the
  # room has no sensor, else the house average). Plant N = plantN_name on
  # the reTerminal.
  - triggers:
      - trigger: event                  # from the "Plant N Room" selects
        event_type: panel_plant_room
      - trigger: event                  # from the reTerminal (long-press a plant)
        event_type: esphome.panel_plant_room
    sensor:
      - name: "Panel Plant Rooms"
        unique_id: panel_plant_rooms
        icon: mdi:sprout
        state: >
          {% set r = this.attributes.get('rooms', {}) %}
          {{ (dict(r, **{trigger.event.data.plant | string: trigger.event.data.area}) if trigger.event.data.area else r) | count }}
        attributes:
          rooms: >
            {% set r = this.attributes.get('rooms', {}) %}
            {% set d = trigger.event.data %}
            {{ dict(r, **{d.plant | string: d.area}) if d.area else r }}

  - sensor:
      # Room, floor and temperature per plant – read by the reTerminal.
      # plants = "area_id|room|floor|temp|source;…" for plants 1…15
      - name: "Panel Plants"
        unique_id: panel_plants
        icon: mdi:sprout
        state: >
          {% from 'panel_plants.jinja' import plant_table %}
          {{ plant_table(state_attr('sensor.panel_rooms', 'rooms'), state_attr('sensor.panel_plant_rooms', 'rooms'))
             .split(';') | select('search', '^[^|]+\\|') | list | count }}
        attributes:
          plants: >
            {% from 'panel_plants.jinja' import plant_table %}
            {{ plant_table(state_attr('sensor.panel_rooms', 'rooms'), state_attr('sensor.panel_plant_rooms', 'rooms')) }}
          # name and icon per plant: "name|icon;…" (input_text / input_select helpers)
          names: >
            {% set ns = namespace(o=[]) %}
            {% for n in range(1, 16) %}
              {% set nm = states('input_text.plant_' ~ n ~ '_name') %}
              {% set ic = states('input_select.plant_' ~ n ~ '_icon') %}
              {% set nm = '' if nm in ['unknown', 'unavailable'] else nm | replace('|', '/') | replace(';', ',') | trim %}
              {% set ic = '' if ic in ['unknown', 'unavailable'] else ic | lower %}
              {% set ns.o = ns.o + [nm ~ '|' ~ ic] %}
            {% endfor %}
            {{ ns.o | join(';') }}
          # every area A–Z for the reTerminal's room picker: "area_id|name|floor;…"
          areas: >
            {% set ns = namespace(o=[]) %}
            {% for a in areas() %}
              {% set f = floor_id(a) %}
              {% set ns.o = ns.o + [{'k': area_name(a) | lower,
                  'v': a ~ '|' ~ (area_name(a) | replace('|', '/') | replace(';', ',')) ~ '|' ~ ((floor_name(f) or '') if f else '')}] %}
            {% endfor %}
            {{ ns.o | sort(attribute='k') | map(attribute='v') | join(';') }}
          rooms: >
            {% from 'panel_plants.jinja' import plant_table %}
            {% set t = plant_table(state_attr('sensor.panel_rooms', 'rooms'), state_attr('sensor.panel_plant_rooms', 'rooms')) %}
            {{ t.split(';') | map('regex_replace', '^[^|]*\\|([^|]*)\\|.*$', '\\1') | list }}

      # Average temperature per floor (and of the whole house as the state)
      - name: "Panel Floor Temperatures"
        unique_id: panel_floor_temperatures
        icon: mdi:home-floor-0
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ state_attr('sensor.panel_rooms', 'average') }}"
        availability: "{{ state_attr('sensor.panel_rooms', 'average') is number }}"
        attributes:
          floors: >
            {% from 'panel_plants.jinja' import floor_temps %}
            {% set ns = namespace(d={}) %}
            {% for x in floor_temps(state_attr('sensor.panel_rooms', 'rooms')).split(';') if x %}
              {% set p = x.split('|') %}{% set ns.d = dict(ns.d, **{p[0]: p[1] | float}) %}
            {% endfor %}
            {{ ns.d }}

  # The "Plant N Room" selects
  - select:
      - name: "Plant 1 Room"
        unique_id: panel_plant_1_room
        icon: mdi:sprout
        options: &room_options "{{ areas() | map('area_name') | sort | list }}"
        state: "{{ (state_attr('sensor.panel_plants', 'rooms') or [''] * 15)[0] }}"
        select_option:
          - event: panel_plant_room
            event_data:
              plant: 1
              area: "{{ area_id(option) }}"
      - name: "Plant 2 Room"
        unique_id: panel_plant_2_room
        icon: mdi:sprout
        options: *room_options
        state: "{{ (state_attr('sensor.panel_plants', 'rooms') or [''] * 15)[1] }}"
        select_option:
          - event: panel_plant_room
            event_data:
              plant: 2
              area: "{{ area_id(option) }}"
      - name: "Plant 3 Room"
