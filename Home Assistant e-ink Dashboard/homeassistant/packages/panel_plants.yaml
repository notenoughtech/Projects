# ── Automation: sample plants ───────────────────────────────────────────────

automation:

  # Sample names, icons, glass size and days per glass for 15 plants. At
  # start-up it only fills helpers that were never set (empty name, glass
  # still at the 10 ml minimum); the "Plants – load sample settings" button
  # overwrites all of them.
  - id: plants_load_sample_settings
    alias: "Plants – load sample settings"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
        id: start
      - trigger: state
        entity_id: input_button.plants_load_samples
        id: button
    actions:
      - repeat:
          for_each:
            - { n: 1, glass: 300, days: 7, name: "Monstera", icon: Foliage }
            - { n: 2, glass: 200, days: 21, name: "Snake plant", icon: Grass }
            - { n: 3, glass: 250, days: 4, name: "Peace lily", icon: Flowering }
            - { n: 4, glass: 100, days: 7, name: "Orchid", icon: Orchid }
            - { n: 5, glass: 100, days: 30, name: "Cactus", icon: Cactus }
            - { n: 6, glass: 150, days: 2, name: "Basil", icon: Herb }
            - { n: 7, glass: 400, days: 7, name: "Fiddle fig", icon: Tree }
            - { n: 8, glass: 200, days: 6, name: "Pothos", icon: Foliage }
            - { n: 9, glass: 100, days: 21, name: "Aloe vera", icon: Succulent }
            - { n: 10, glass: 200, days: 5, name: "Spider plant", icon: Grass }
            - { n: 11, glass: 400, days: 7, name: "Kentia palm", icon: Palm }
            - { n: 12, glass: 150, days: 14, name: "Jade plant", icon: Succulent }
            - { n: 13, glass: 250, days: 2, name: "Chili pepper", icon: Chili }
            - { n: 14, glass: 150, days: 3, name: "Tulips", icon: Tulip }
            - { n: 15, glass: 200, days: 4, name: "Calathea", icon: Foliage }
          sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ trigger.id == 'button' or
                       states('input_text.plant_' ~ repeat.item.n ~ '_name') in ['', 'unknown', 'unavailable'] }}
              then:
                - action: input_text.set_value
                  target:
                    entity_id: "input_text.plant_{{ repeat.item.n }}_name"
                  data:
                    value: "{{ repeat.item.name }}"
                - action: input_select.select_option
                  target:
                    entity_id: "input_select.plant_{{ repeat.item.n }}_icon"
                  data:
                    option: "{{ repeat.item.icon }}"
            - if:
                - condition: template
                  value_template: >
                    {{ trigger.id == 'button' or
                       states('input_number.plant_' ~ repeat.item.n ~ '_glass_ml') | float(10) <= 10 }}
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.plant_{{ repeat.item.n }}_glass_ml"
                  data:
                    value: "{{ repeat.item.glass }}"
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.plant_{{ repeat.item.n }}_days"
                  data:
                    value: "{{ repeat.item.days }}"
