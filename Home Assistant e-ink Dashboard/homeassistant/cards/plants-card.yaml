# Plants card for a Home Assistant dashboard
# Dashboard → ⋮ Edit → + Add card → Manual → paste all of this.
# Per plant: name ("-" hides it), icon, room, glass size and days per glass.
# Changes reach the reTerminal within a few seconds; the room also changes
# when you long-press a plant on the reTerminal.
type: vertical-stack
cards:
  - type: markdown
    content: >-
      **Plants** · name `-` hides a plant on the panels ·
      {{ states('sensor.panel_plants') }} plants placed in rooms
  - type: grid
    columns: 3
    square: false
    cards:
      - type: entities
        title: Plant 1
        state_color: false
        entities:
          - entity: input_text.plant_1_name
            name: Name
          - entity: input_select.plant_1_icon
            name: Icon
          - entity: select.plant_1_room
            name: Room
          - entity: input_number.plant_1_glass_ml
            name: Glass
          - entity: input_number.plant_1_days
            name: Days per glass
