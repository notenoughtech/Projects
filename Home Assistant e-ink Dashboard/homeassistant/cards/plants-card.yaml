# Plants card for a Home Assistant dashboard
# Dashboard → ⋮ Edit → + Add card → Manual → paste all of this.
# Home Assistant keeps every plant's water (packages/panel_plants.yaml), so all
# panels – with or without the E1003 – show the same levels. Per plant: name
# ("-" hides it), icon, room, glass size, days per glass, water left and a
# "Water" button (one glass). The room also changes when you long-press a plant
# on the reTerminal E1003, and watering there counts here too.
type: vertical-stack
cards:
  - type: markdown
    content: >-
      **Plants** · name `-` hides a plant on the panels ·
      {{ states('sensor.panel_plants') }} plants placed in rooms ·
      {% set n = states('sensor.panel_plants_needing_water') | int(0) %}
      {{ '**' ~ n ~ ' need water**' if n else 'all watered' }}

      {% for p in (state_attr('sensor.panel_plants_needing_water', 'plants') or [] | list) | sort(attribute='left') %}
      {{- '\n' }}{{ '💧' if p.left < states('input_number.plant_warning_days') | float(1) else '🌱' }} {{ p.name }} – {{ p.left }} d · {{ p.pct | int }} %
      {%- endfor %}
  - type: grid
    columns: 3
    square: false
    cards:
      - type: entities
        title: Plant 1
        state_color: false
        entities:
          - entity: input_text.plant_1_name
            name: Name
          - entity: input_select.plant_1_icon
            name: Icon
          - entity: select.plant_1_room
            name: Room
          - entity: input_number.plant_1_glass_ml
            name: Glass
          - entity: input_number.plant_1_days
            name: Days per glass
          - entity: input_number.plant_1_level
            name: Water left
          - type: button
            name: Water
            icon: mdi:watering-can
            action_name: 1 glass
            tap_action:
              action: perform-action
              perform_action: script.panel_water_plant
              data:
                plant: 1
