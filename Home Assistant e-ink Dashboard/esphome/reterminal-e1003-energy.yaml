# ─────────────────────────────────────────────────────────────
# Data from Home Assistant
# ─────────────────────────────────────────────────────────────
text_sensor:
  # Published to HA for the DIY display: the 5 thirstiest plants as
  # "Name|days left|percent;…" (also sets "Plants needing water")
  - platform: template
    id: plant_summary_pub
    name: "Plant summary"
    icon: mdi:sprout
    update_interval: 1min
    lambda: |-
      const char *names[15];
      for (int q_ = 0; q_ < 15; q_++) names[q_] = id(plant_nm)[q_].c_str();
      number::Number *lv[15] = {id(p1_level), id(p2_level), id(p3_level), id(p4_level), id(p5_level), id(p6_level), id(p7_level), id(p8_level), id(p9_level), id(p10_level), id(p11_level), id(p12_level), id(p13_level), id(p14_level), id(p15_level)};
      sensor::Sensor *gl[15] = {id(p1_glass), id(p2_glass), id(p3_glass), id(p4_glass), id(p5_glass), id(p6_glass), id(p7_glass), id(p8_glass), id(p9_glass), id(p10_glass), id(p11_glass), id(p12_glass), id(p13_glass), id(p14_glass), id(p15_glass)};
      sensor::Sensor *dy[15] = {id(p1_days), id(p2_days), id(p3_days), id(p4_days), id(p5_days), id(p6_days), id(p7_days), id(p8_days), id(p9_days), id(p10_days), id(p11_days), id(p12_days), id(p13_days), id(p14_days), id(p15_days)};
      if (!id(show_plants)) {                     // plants hidden in Settings
        id(plants_dry_pub).publish_state(0);
        return std::string("off");
      }
      float t = id(house_temp).state;
      if (std::isnan(t)) t = id(room_temp).state;
      if (std::isnan(t)) t = 20.0f;
      float m = std::isnan(id(plant_mult).state) ? 1.0f : id(plant_mult).state;
      float left[15], pct[15];
      int idx[15], n = 0, dry = 0;
      for (int i = 0; i < 15; i++) {
        if (names[i][0] == 0) continue;
        float glass = std::isnan(gl[i]->state) ? 250.0f : gl[i]->state;
        float days  = std::isnan(dy[i]->state) || dy[i]->state <= 0 ? 7.0f : dy[i]->state;
        float level = std::isnan(lv[i]->state) ? 0.0f : lv[i]->state;
        float cap = glass * id(max_glasses);
        // each plant drinks faster in a warmer room (its room / floor / house temperature)
        const float ti = std::min(35.0f, std::max(5.0f, std::isnan(id(plant_t)[i]) ? t : id(plant_t)[i]));
        float per_day = glass / days * powf(2.0f, (ti - 20.0f) / 10.0f) * m;
        left[i] = per_day > 0 ? level / per_day : 0.0f;
        pct[i] = cap > 0 ? std::min(100.0f, level / cap * 100.0f) : 0.0f;
        if (left[i] < id(dry_days)) dry++;
        int j = n++;
        while (j > 0 && left[idx[j - 1]] > left[i]) { idx[j] = idx[j - 1]; j--; }
        idx[j] = i;
      }
      id(plants_dry_pub).publish_state(dry);
      std::string out;
      for (int k = 0; k < std::min(5, n); k++) {
        char b[80];
        snprintf(b, sizeof(b), "%s%s|%.1f|%.0f|%s", k ? ";" : "", names[idx[k]], std::min(left[idx[k]], 999.0f), pct[idx[k]],
                 id(plant_room)[idx[k]].c_str());
        out += b;
      }
      return out;
  # Plants: room, floor and temperature per plant (sensor "Panel Plants" in HA)
  # "area_id|room|floor|temp|source;…" for plants 1…15
  - platform: homeassistant
    entity_id: sensor.panel_plants
    attribute: plants
    id: plant_loc
    internal: true
    on_value:
      - lambda: |-
          size_t pos = 0;
          for (int i = 0; i < 15; i++) {
            std::string rec;
            if (pos <= x.size()) {
              size_t end = x.find(';', pos);
              if (end == std::string::npos) end = x.size();
              rec = x.substr(pos, end - pos);
              pos = end + 1;
            }
            std::string f[5];
            int k = 0;
            size_t q = 0;
            while (k < 5) {
              size_t e = rec.find('|', q);
              if (e == std::string::npos) { f[k++] = rec.substr(q); break; }
              f[k++] = rec.substr(q, e - q);
              q = e + 1;
            }
            id(plant_room)[i] = f[1];
            id(plant_floor)[i] = f[2];
            char *e2;
            const float t = strtof(f[3].c_str(), &e2);
            id(plant_t)[i] = (f[3].empty() || e2 == f[3].c_str()) ? NAN : t;
            id(plant_src)[i] = f[4];
          }
      - component.update: plant_summary_pub

  # Plant names / icons from HA: "name|icon;…" for plants 1…15
  - platform: homeassistant
    entity_id: sensor.panel_plants
    attribute: names
    id: plant_names
    internal: true
    on_value:
      - lambda: |-
          static const char *def_nm[15] = {"${plant1_name}", "${plant2_name}", "${plant3_name}", "${plant4_name}", "${plant5_name}", "${plant6_name}", "${plant7_name}", "${plant8_name}", "${plant9_name}", "${plant10_name}", "${plant11_name}", "${plant12_name}", "${plant13_name}", "${plant14_name}", "${plant15_name}"};
          static const char *def_ty[15] = {"${plant1_type}", "${plant2_type}", "${plant3_type}", "${plant4_type}", "${plant5_type}", "${plant6_type}", "${plant7_type}", "${plant8_type}", "${plant9_type}", "${plant10_type}", "${plant11_type}", "${plant12_type}", "${plant13_type}", "${plant14_type}", "${plant15_type}"};
          size_t pos = 0;
          bool changed = false;
          for (int i = 0; i < 15; i++) {
            std::string rec;
            if (pos <= x.size()) {
              size_t end = x.find(';', pos);
              if (end == std::string::npos) end = x.size();
              rec = x.substr(pos, end - pos);
              pos = end + 1;
            }
            const size_t bar = rec.find('|');
            std::string n = rec.substr(0, bar);
            std::string t = bar == std::string::npos ? "" : rec.substr(bar + 1);
            if (!n.empty() && n[0] == '[') n = n.substr(1);
            if (n.empty()) n = def_nm[i];                // helper empty → name from this YAML
            else if (n == "-") n = "";                   // "-" → plant not used
            if (n.size() > 24) n = n.substr(0, 24);
            if (t.empty()) t = def_ty[i];
            if (n != id(plant_nm)[i] || t != id(plant_ty)[i]) changed = true;
            id(plant_nm)[i] = n;
            id(plant_ty)[i] = t;
          }
          if (!changed) return;
          ESP_LOGI("plants", "Names / icons updated from Home Assistant");
          id(order_ready) = false;
          if (id(page) == 0 || id(page) == 3 || id(page) == 6) id(force_full) = true;
      - component.update: plant_summary_pub

  # Every HA area for the plant room picker: "area_id|name|floor;…" A–Z
  - platform: homeassistant
    entity_id: sensor.panel_plants
    attribute: areas
    id: plant_areas
    internal: true

  # Heating limit by Time / Budget (HA helper input_select.heating_limit_by)
  - platform: homeassistant
    entity_id: input_select.heating_limit_by
    id: ha_lim_by
    internal: true
    on_value:
      - lambda: |-
          if (x != "Time" && x != "Budget") return;
          if (!id(lim_synced) || millis() - id(heat_lim_ms) < 5000) return;
          const bool b = x == "Budget";
          if (b == id(lim_budget)) return;
          id(lim_budget) = b;
          if (id(page) == 4) id(dirty_mask) |= (1u << 13) | (1u << 14) | (1u << 15);
          id(heat_limits_changed).execute();

  # Published to HA (and read by the DIY display): heating over its daily /
  # weekly limit, e.g. "Heating 4h 30m today · limit 4h"; empty = all fine.
  # Limits and cost per hour are set on the Settings page.
  - platform: template
    id: heat_alert_pub
    name: "Heating alert"
    icon: mdi:radiator
    update_interval: 1min
    lambda: |-
      auto hm = [](float h, char *o, size_t n) {
        int m = (int) roundf(h * 60.0f);
        if (m < 60)           snprintf(o, n, "%dm", m);
        else if (m % 60 == 0) snprintf(o, n, "%dh", m / 60);
        else                  snprintf(o, n, "%dh %02dm", m / 60, m % 60);
      };
      if (!id(show_heating)) return std::string();      // heating switched off in Settings
      const float d = id(ht_0).state, w = id(ht_week).state, c = id(heat_cost_h);
      char a[16], b[16], out[64];
      if (!id(lim_budget)) {
        if (!std::isnan(d) && id(lim_day_h) > 0 && d > id(lim_day_h)) {
          hm(d, a, sizeof(a)); hm(id(lim_day_h), b, sizeof(b));
          snprintf(out, sizeof(out), "Heating %s today · limit %s", a, b);
          return std::string(out);
        }
        if (!std::isnan(w) && id(lim_week_h) > 0 && w > id(lim_week_h)) {
          hm(w, a, sizeof(a)); hm(id(lim_week_h), b, sizeof(b));
          snprintf(out, sizeof(out), "Heating %s this week · limit %s", a, b);
          return std::string(out);
        }
      } else {
        if (!std::isnan(d) && id(lim_day_gbp) > 0 && d * c > id(lim_day_gbp)) {
          snprintf(out, sizeof(out), "Heating £%.2f today · budget £%.2f", d * c, id(lim_day_gbp));
          return std::string(out);
        }
        if (!std::isnan(w) && id(lim_week_gbp) > 0 && w * c > id(lim_week_gbp)) {
          snprintf(out, sizeof(out), "Heating £%.2f this week · budget £%.2f", w * c, id(lim_week_gbp));
          return std::string(out);
        }
      }
      // this month: Home Assistant's monthly history (sensor.panel_heating_history)
      float mh = NAN;
      {
        const std::string &src = id(ht_m).state;
        const char *q = src.c_str();
        if (*q == '[' || *q == '(') q++;
        while (*q) {
          char *e;
          const float v = strtof(q, &e);
          if (e == q) break;
          mh = v;
          q = e;
          while (*q == ',' || *q == ' ') q++;
        }
      }
      if (!std::isnan(mh)) {
        if (!id(lim_budget) && id(lim_month_h) > 0 && mh > id(lim_month_h)) {
          hm(mh, a, sizeof(a)); hm(id(lim_month_h), b, sizeof(b));
          snprintf(out, sizeof(out), "Heating %s this month · limit %s", a, b);
          return std::string(out);
        }
        if (id(lim_budget) && id(lim_month_gbp) > 0 && mh * c > id(lim_month_gbp)) {
          snprintf(out, sizeof(out), "Heating £%.0f this month · budget £%.0f", mh * c, id(lim_month_gbp));
          return std::string(out);
        }
      }
      return std::string();

  # Published to HA too: electricity (grid import) or water over a limit set in
  # Settings → Alerts, e.g. "Water 540 L this week · limit 500 L"; empty = fine.
  - platform: template
    id: usage_alert_pub
    name: "Usage alert"
    icon: mdi:alert-circle-outline
    update_interval: 1min
    on_value:
      - if:
          condition:
            lambda: 'return id(page) != 4;'
          then:
            - lambda: 'id(dirty_mask) |= 1u << 24;'
            - script.execute: refresh_now
    lambda: |-
      auto parse = [](const std::string &src, float *out, int maxn) -> int {
        const char *q = src.c_str();
        if (*q == '[' || *q == '(') q++;
        int n = 0;
        while (*q && n < maxn) {
          char *e;
          const float v = strtof(q, &e);
          if (e == q) break;
          out[n++] = v;
          q = e;
          while (*q == ',' || *q == ' ') q++;
        }
        return n;
      };
      const auto t = id(ha_time).now();
      const int dow = t.is_valid() ? (t.day_of_week + 5) % 7 : 0;      // 0 = Monday
      char out[80];
      // today, this week (from Monday), this month for one utility
      auto check = [&](const char *name, const std::array<float, 3> &lim, float today,
                       const std::string &last7, const std::string &months, const char *fmt, const char *unit) -> bool {
        float v7[7] = {}, mo[12] = {};
        parse(last7, v7, 7);
        const int nm = parse(months, mo, 12);
        float week = today;
        for (int i = 6 - dow; i < 6; i++) week += v7[i];
        const float month = nm ? std::max(mo[nm - 1], today) : NAN;
        const float val[3] = {today, week, month};
        static const char *WHEN[3] = {"today", "this week", "this month"};
        for (int r = 0; r < 3; r++) {
          if (lim[r] <= 0 || std::isnan(val[r]) || val[r] <= lim[r]) continue;
          char a[24], b[24];
          snprintf(a, sizeof(a), fmt, val[r]);
          snprintf(b, sizeof(b), fmt, lim[r]);
          snprintf(out, sizeof(out), "%s %s%s %s · limit %s%s", name, a, unit, WHEN[r], b, unit);
          return true;
        }
        return false;
      };
      if (id(show_energy)) {
        const float imp = id(myGridImport).state;
        const float today = std::isnan(imp) ? NAN : std::max(0.0f, imp - id(base_import));
        if (!std::isnan(today) && check("Power", id(pw_lim), today, id(en_last7_imp).state, id(en_m_imp).state, "%.1f", " kWh"))
          return std::string(out);
      }
      if (id(show_water)) {
        const float today = id(myWaterToday).state;
        if (!std::isnan(today) && check("Water", id(wt_lim), today, id(wh_last7).state, id(wh_m).state, "%.0f", " L"))
          return std::string(out);
      }
      return std::string();
