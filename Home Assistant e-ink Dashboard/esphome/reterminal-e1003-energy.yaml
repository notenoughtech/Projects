  # Buzzer: `count` beeps of `ms` each, 70 ms apart.
  # Only switching on happens in ESPHome's main loop. Switching off runs on an
  # esp_timer (its own task), so a slow e-paper refresh that blocks the main
  # loop can no longer leave the buzzer sounding for seconds.
  - id: buzz
    mode: restart
    parameters:
      ms: int
      count: int
    then:
      - lambda: |-
          static esp_timer_handle_t timer = nullptr;
          static uint32_t duty = 0;
          static int steps = 0;        // timer stopped before these change, so no race
          static int on_us = 20000;
          struct Buzz {
            static void off() { ledc_stop(LEDC_LOW_SPEED_MODE, LEDC_CHANNEL_0, 0); }
            static void tick(void *) {
              if (--steps <= 0) { off(); return; }
              if (steps % 2) {                       // beep done → gap
                const uint32_t d = ledc_get_duty(LEDC_LOW_SPEED_MODE, LEDC_CHANNEL_0);
                if (d) duty = d;                     // the duty ESPHome set, for the next beep
                off();
                esp_timer_start_once(timer, 70000);
              } else {                               // gap done → next beep
                ledc_set_duty(LEDC_LOW_SPEED_MODE, LEDC_CHANNEL_0, duty);
                ledc_update_duty(LEDC_LOW_SPEED_MODE, LEDC_CHANNEL_0);
                esp_timer_start_once(timer, on_us);
              }
            }
          };
          if (timer == nullptr) {
            esp_timer_create_args_t args = {};
            args.callback = &Buzz::tick;
            args.name = "buzz";
            if (esp_timer_create(&args, &timer) != ESP_OK) return;
          }
          esp_timer_stop(timer);
          steps = std::max(1, std::min(count, 5)) * 2;
          on_us = std::max(5, std::min(ms, 400)) * 1000;
          // ESPHome skips a level it thinks is already set, but the timer switched the
          // channel off behind its back – so set 0 first, then the tone
          id(buzzer_pwm).set_level(0.0f);
          id(buzzer_pwm).set_level(0.5f);
          esp_timer_start_once(timer, on_us);

  # Voice: redraw just the top bar (where the voice chip lives)
  - id: va_show
