# ─────────────────────────────────────────────────────────────
# State
# ─────────────────────────────────────────────────────────────
globals:
  - id: base_import
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: base_export
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: base_solar
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: water_week                 # litres per weekday, 0 = Monday
    type: std::array<float, 7>
    restore_value: true
    initial_value: "std::array<float, 7>{}"
  - id: en_view                    # Energy page taps: bits 0-2 7 days / 30 days / this month show use vs
    type: uint32_t                 # standing; bits 3-5 7 / 30 day / 12 month charts in kWh, L, time (else £)
    restore_value: false
    initial_value: "0"
  - id: en_tabs                    # Energy page tabs (for the touch handler): x, y, w, step
    type: std::array<int, 4>
    restore_value: false
    initial_value: "std::array<int, 4>{48, 214, 300, 316}"
  - id: home_util                  # Home 24 h card + Energy page: 0 = power, 1 = water, 2 = heating
    type: int
    restore_value: true
    initial_value: "0"
  - id: grid_avg                   # 1-minute rolling averages (W) for the solar + grid card
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: solar_avg
    type: float
    restore_value: false
    initial_value: "NAN"
  # Screen refresh (Settings → Display): 0 = every minute, always on; 1…5 = every
  # 10 / 15 / 30 / 60 / 120 min with deep sleep in between (green button wakes it)
  - id: refresh_idx
    type: int
    restore_value: true
    initial_value: "0"
  - id: wake_mode                  # 1 = woken by the timer: draw once, sleep again; 0 = in use
    type: int
    restore_value: false
    initial_value: "0"
  - id: act_ms                     # last touch or button press (for the 2 min stay-awake)
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: going_sleep                # the frame being drawn is the last one before sleeping
    type: bool
    restore_value: false
    initial_value: "false"
  # Night sleep (Settings → Night sleep): asleep from night_from until night_to
  # (minutes after midnight). Green button: awake, back to sleep 5 min after the last touch.
  - id: night_on
    type: bool
    restore_value: true
    initial_value: "false"
  - id: night_from
    type: int
    restore_value: true
    initial_value: "1380"            # 23:00
  - id: night_to
    type: int
    restore_value: true
    initial_value: "420"             # 07:00
  - id: base_doy                   # day of the year the "today" baselines belong to
    type: int
    restore_value: true
    initial_value: "-1"
  - id: draw_ok                    # false while a timer wake waits for Home Assistant's data
    type: bool
    restore_value: false
    initial_value: "true"
  - id: next_wake                  # next scheduled refresh, seconds after midnight
    type: int
    restore_value: false
    initial_value: "-1"
  - id: dirty_mask                 # what a touch changed: bits 0-5 plants, bit 6 week view; 0 = redraw all
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: page                       # 0 home, 1 energy, 2 heating, 3 plants, 4 settings, 5 agenda
    type: int
    restore_value: false
    initial_value: "0"
  - id: force_full                 # next draw redraws the whole page
    type: bool
    restore_value: false
    initial_value: "false"
  - id: more_page                  # heating: -1 = pinned rooms, 0.. = "More rooms" page
    type: int
    restore_value: false
    initial_value: "-1"
  - id: edit_area                  # heating: room card showing its thermostat controls ("" = none)
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: pend_area                  # optimistic target / leading room until HA confirms
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: pend_t
    type: float
    restore_value: false
    initial_value: "0"
  - id: pend_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: pend_pin_area              # optimistic pin toggle until HA confirms
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: pend_pin_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: pend_pin_ms
