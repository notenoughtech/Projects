  # Wi-Fi setup: drop the current network (not saved, so a restart brings it
  # back) → after ap_timeout the setup hotspot starts with its captive portal
  - id: start_wifi_setup
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("wifi", "Wi-Fi setup: starting the hotspot");
          if (id(page) != 8) id(setup_ret) = id(page) == 7 ? 7 : 0;
          id(page) = 8;
          id(net_state) = 0;
          id(force_full) = true;
          id(epaper_display).update();
          if (wifi::global_wifi_component->is_ap_active()) { id(net_state) = 1; return; }
          wifi::WiFiAP none;
          none.set_ssid("panel-setup-no-network");
          none.set_password("");
          wifi::global_wifi_component->disable();
          wifi::global_wifi_component->set_sta(none);
          wifi::global_wifi_component->enable();

  # Settings → Features: apply what was picked (called when leaving Settings)
  - id: apply_features
    mode: queued
    then:
      - lambda: |-
          const int m = id(feat_pend);
          if (m < 0) return;
          id(feat_pend) = -1;
          bool *f[6] = {&id(show_energy), &id(show_water), &id(show_heating), &id(show_agenda), &id(show_plants), &id(show_solar)};
          const bool old_heat = id(show_heating), old_plants = id(show_plants);
          for (int k = 0; k < 6; k++) *f[k] = (m >> k) & 1;
          ESP_LOGI("settings", "Features: energy %d solar %d water %d heating %d agenda %d plants %d",
                   id(show_energy), id(show_solar), id(show_water), id(show_heating), id(show_agenda), id(show_plants));
          if (old_plants != id(show_plants)) id(plant_summary_refresh).execute();   // DIY panel
          if (old_heat != id(show_heating)) id(heat_alert_refresh).execute();

  # Re-check the power / water alert (a limit changed in Settings → Alerts)
  - id: usage_alert_refresh
    mode: restart
    then:
      - component.update: usage_alert_pub

  # Re-publish the heating alert (heating switched on / off in Settings)
  - id: heat_alert_refresh
    mode: restart
    then:
      - component.update: heat_alert_pub

  # Re-publish the plant summary for the DIY panel (e.g. plants shown / hidden)
