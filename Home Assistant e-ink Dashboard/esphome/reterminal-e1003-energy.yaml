script:
  # ── Sleep between refreshes (Settings → Display → Refresh other than 1 min) ──
  # A new day that began while the panel slept: start today's kWh from now
  # (the sleep wakes on the 10 / 15 / 30 … min marks, so there's a wake at midnight)
  - id: day_check
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid() || id(base_doy) == t.day_of_year) return;
          if (id(base_doy) >= 0) {
            if (!std::isnan(id(myGridImport).state)) id(base_import) = id(myGridImport).state;
            if (!std::isnan(id(myGridExport).state)) id(base_export) = id(myGridExport).state;
            if (!std::isnan(id(mySolarTotal).state)) id(base_solar)  = id(mySolarTotal).state;
            id(water_week)[(t.day_of_week + 5) % 7] = 0;
          }
          id(base_doy) = t.day_of_year;
  # Deep sleep until the next refresh mark (a few seconds after it)
  - id: enter_sleep
    then:
      - lambda: |-
          // night sleep (Settings → Night sleep): between night_from and night_to
          auto in_night = [&](const ESPTime &tn) -> bool {
            if (!id(night_on) || !tn.is_valid()) return false;
            const int m = tn.hour * 60 + tn.minute, a = id(night_from), b = id(night_to);
            if (a == b) return false;
            return a < b ? (m >= a && m < b) : (m >= a || m < b);
          };
          {
            auto t0 = id(ha_time).now();
            if (in_night(t0)) {
              const int secs = t0.hour * 3600 + t0.minute * 60 + t0.second;
              const int left = ((id(night_to) * 60 - secs) % 86400 + 86400) % 86400;
              ESP_LOGI("sleep", "Night sleep for %d s, until %02d:%02d (green button wakes the panel)",
                       left + 15, id(night_to) / 60, id(night_to) % 60);
              id(deep_sleep_ctl).set_sleep_duration((uint32_t) (left + 15) * 1000u);
              id(deep_sleep_ctl).begin_sleep(true);
              return;
            }
          }
          if (id(refresh_idx) <= 0) {          // the night is over and refresh is "every minute": stay on
            id(wake_mode) = 0;
            id(going_sleep) = false;
            return;
          }
          static const int REFRESH_MIN[6] = {1, 10, 15, 30, 60, 120};
          const int iv = REFRESH_MIN[std::min(5, std::max(1, id(refresh_idx)))] * 60;
          int left = iv;
          auto t = id(ha_time).now();
          if (t.is_valid() && id(next_wake) >= 0) {
            const int secs = t.hour * 3600 + t.minute * 60 + t.second;
            left = ((id(next_wake) - secs) % 86400 + 86400) % 86400;
            if (left < 20 || left > iv) left = left < 20 ? left + iv : iv;
          }
          ESP_LOGI("sleep", "Sleeping %d s (green button wakes the panel)", left + 15);
          id(deep_sleep_ctl).set_sleep_duration((uint32_t) (left + 15) * 1000u);
          id(deep_sleep_ctl).begin_sleep(true);
  # Woken by the timer: wait for Home Assistant, draw Home once, sleep again.
  # No Home Assistant within a minute: keep the last picture, try at the next mark.
  - id: timer_refresh
    mode: single
    then:
      - wait_until:
          condition:
            lambda: 'return id(ha_ok) && id(ha_time).now().is_valid();'
          timeout: 60s
      - if:
          condition:
            lambda: 'return id(wake_mode) == 1 && !id(ha_ok);'
          then:
            - logger.log: "Timer wake: no Home Assistant – sleeping again"
            - script.execute: enter_sleep      # doesn't come back
      - delay: 6s                          # all the states arrive after the connection
      - if:
          condition:
            lambda: 'return id(wake_mode) == 1;'
          then:
            - script.execute: day_check
            - lambda: |-
                id(page) = 0;
                id(draw_ok) = true;
                id(force_full) = true;
                id(epaper_display).update();
            - delay: 10s                   # let the panel finish its refresh
            - if:
                condition:
                  lambda: 'return id(wake_mode) == 1;'
                then:
                  - script.execute: enter_sleep
  # In use, no touch for 2 min: back to Home with the "asleep" note, then sleep
  - id: go_sleep
    mode: single
    then:
      - lambda: |-
          id(page) = 0;
          id(edit_area) = "";
          id(more_page) = -1;
          id(going_sleep) = true;
          id(force_full) = true;
          id(epaper_display).update();
      - delay: 10s
      - if:
          condition:
            lambda: 'return id(going_sleep) && id(wake_mode) == 0;'
          then:
            - script.execute: enter_sleep
  # Touch refresh: partial update straight away (menus, thermostat, pages)
  - id: refresh_now
    mode: restart
    then:
      - lambda: |-
          id(epaper_display).update();

  # Second partial refresh a moment later (e.g. the leading-room panel after a
  # room card), so the part you touched updates first
  - id: refresh_followup
    mode: restart
    then:
      - delay: 1200ms
      - lambda: |-
          id(dirty_mask) |= id(followup_mask);
          id(followup_mask) = 0;
      - script.execute: refresh_now

  # Page navigation from the buttons: dir -1 = left, +1 = right, 0 = toggle Settings
  - id: nav
    mode: queued
    parameters:
      dir: int
    then:
      - lambda: |-
          id(ui_touch_ms) = millis();
          int p = id(page);
          int np;
          if (p == 4) id(apply_features).execute();   // leaving Settings: apply Features now
          if (p == 8) {                         // Wi-Fi setup: buttons do nothing (Cancel on screen)
            np = 8;
          } else if (dir == 3) {                // hold green: Home
            np = 0;
          } else if (dir == 2) {                // hold left / right: Settings
            if (p != 4) { id(prev_page) = p == 7 || p == 6 ? 0 : p; }
            np = 4;
          } else if (p == 7) {                  // Wi-Fi → back to Settings
            np = 4;
          } else if (p == 6) {                  // room picker: any button = cancel
            np = id(pick_ret);
          } else if (dir == 0) {                // long hold / Done: open / close Settings
            if (p == 4) np = id(prev_page) == 4 ? 0 : id(prev_page);
            else { id(prev_page) = p; np = 4; }
          } else if (p == 4) {
            np = id(prev_page) == 4 ? 0 : id(prev_page);   // any button leaves Settings
          } else {
            // Energy · Home · Heating · Lights · Agenda, wraps around both ways (keep pressing);
            // pages switched off are skipped. Lights shows when Home Assistant has rooms for it.
            const std::string &lr = id(lt_rows).state;
            const bool lights = !lr.empty() && lr != "unknown" && lr != "unavailable";
            int order[5], n = 0;
            if (id(show_energy) || id(show_water)) order[n++] = 1;
            order[n++] = 0;
            if (id(show_heating)) order[n++] = 2;
            if (lights) order[n++] = 9;
            if (id(show_agenda)) order[n++] = 5;
            int cur = p == 3 ? 0 : p, idx = 0;
            for (int k = 0; k < n; k++) if (order[k] == cur) idx = k;
            np = order[(idx + dir + n) % n];
          }
          // a page that was switched off in Settings meanwhile → Home
          if ((np == 1 && !id(show_energy) && !id(show_water)) || (np == 2 && !id(show_heating)) ||
              (np == 5 && !id(show_agenda)) || (np == 3 && !id(show_plants))) np = 0;
          if (np == 9) {
            const std::string &l2 = id(lt_rows).state;
            if (l2.empty() || l2 == "unknown" || l2 == "unavailable") np = 0;
          }
          if (np != p) {
            id(page) = np;
            id(edit_area) = "";
            id(force_full) = true;
            id(epaper_display).update();
          }

