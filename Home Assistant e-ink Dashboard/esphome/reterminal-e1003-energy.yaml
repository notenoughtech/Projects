# reTerminal E1003 (10.3", 1872×1404, 16-level grey, GT911 touch)
# Needs ESPHome 2026.7.0 or newer.
#
# Pages:  left button ◂ Energy · Home · Heating · Agenda ▸ right button (wraps around)
#         hold left or right (1 s) = Settings · green button = full refresh
#         hold green (1 s) = Home page · voice: say "Okay Nabu"
#         buttons tick on a tap; opening or closing Settings gives three short beeps
# Wi-Fi: Settings → Wi-Fi (tap the Device card) → add a Wi-Fi network from
#         your phone (QR code → hotspot → pick the network). If the panel can't
#         find any known Wi-Fi it opens the same setup screen by itself.
# Features: Settings → Features switches Energy / Solar / Water / Heating /
#         Agenda / Plants on or off (first-boot defaults: feature_* substitutions).
#         Off = not drawn, its page skipped, the other cards take the space.
#
# Touch feedback (Settings → Touch feedback): a tick from the buzzer, and the
#         touched card's border goes bold at once, before the card updates.
# Home touch:
#         today card  → switch power ↔ water (only on a tap, no auto-switching)
#         agenda card → Agenda page (calendar + tasks)
#         a plant     → add one glass of water (tap again for another);
#                       hold it → move it to another room
#         All plants  → full list, thirstiest first, 8 per page
# Energy touch: anywhere → power ↔ water analysis
# Agenda touch: a task → tick it off (Google Tasks / any HA to-do list)
# Top bar (every page): device stats + warnings; tap a warning to jump to it
#         (plants, offline room sensors, heating over its daily / weekly limit)
# Heating touch (rooms = Home Assistant areas with a temperature sensor):
#         room card  → 3 thermostat choices (set in Settings) + Pin; the room
#                      becomes the leading thermostat; pinned rooms (max 6) fill the page
#         HEATING ON/OFF pill → switch the thermostat mode
#         More rooms → unpinned rooms, 9 per page
#
# Calendar + tasks come from the "Panel Agenda" sensor (packages/panel_agenda.yaml)
# (Google Calendar / Google Tasks integrations, signed in from HA's UI).

esphome:
  name: reterminal-e1003
  friendly_name: reTerminal e1003
  # buzzer timing runs on a hardware timer (see the "buzz" script)
  includes:
    - <driver/ledc.h>
    - <esp_timer.h>
    - <esp_sleep.h>
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable   # battery voltage divider must be on before GPIO1 is read
        - output.turn_on: mic_power
        - delay: 200ms
        - component.update: battery_voltage
        - component.update: battery_level
    - priority: -100
      then:
        - lambda: |-
            id(epaper_display).set_invert_colors(id(theme_dark));
            // woken by the sleep timer (Settings → Display → Refresh): draw once, sleep again.
            // Green button or power on: normal use (sleeps again 2 min after the last touch).
            const bool timer = esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER;
            id(wake_mode) = (timer && (id(refresh_idx) > 0 || id(night_on))) ? 1 : 0;
            id(draw_ok) = id(wake_mode) == 0;
            id(act_ms) = millis();
            ESP_LOGI("sleep", "Boot: %s", id(wake_mode) ? "timer refresh" : "in use");
        - if:
            condition:
              lambda: 'return id(wake_mode) == 1;'
            then:
              - script.execute: timer_refresh
            else:
              # the display has no update interval of its own (the 30 s interval below
              # drives it), so draw the first frame here – once Home Assistant's data is in
              - wait_until:
                  condition:
                    lambda: 'return id(ha_ok);'
                  timeout: 20s
              - delay: 3s
              - lambda: 'id(force_full) = true;'
              - component.update: epaper_display

output:
  - platform: gpio
    pin: GPIO40
    id: bsp_battery_enable
  # Passive piezo buzzer (button feedback, voice prompts)
  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm
    frequency: 2700Hz
    channel: 0           # fixed: the "buzz" script switches this channel off directly
  # Power for the on-board PDM microphone
  - platform: gpio
    pin: GPIO38
    id: mic_power

# ─────────────────────────────────────────────────────────────
# Home Assistant entity IDs
# ─────────────────────────────────────────────────────────────
substitutions:
  # Shown on Home (footnote) and in Settings → Device, to check what's installed
  fw_version: "v28 (8 Nov 2026)"
  # Top row of Home:
  #   "wide"  – clock and weather now in one dark card (2/3), 3 h forecast on the right
  #   "split" – clock card on the left half, a bordered weather card (now + 3 h) on the right
  top_layout: "split"
  # ── Setup hotspot (when there's no known Wi-Fi, or Settings → Add Wi-Fi) ──
  ap_ssid: "reTerminal E1003 Setup"
  ap_password: !secret fallback_password       # also put in the QR code on the screen

  # ── Features: what the panel shows. These are only the first-boot defaults –
  # switch them any time in Settings → Features (hold left or right).
  # Match them to the packages you installed in Home Assistant.
  feature_energy: "true"      # grid: power cards, power chart, Energy page
  feature_solar: "true"       # solar card, solar on the charts, solar strip over the forecast
  feature_water: "true"       # water today / this week, water history
  feature_heating: "true"     # Heating page, heating alerts
  feature_agenda: "true"      # calendar + tasks card, Agenda page
  feature_plants: "true"      # plant cards + Plants page

  grid_power: sensor.grid_power                     # W, + import / - export (flipped on device)
  grid_import_energy: sensor.grid_import_energy     # kWh lifetime total
  grid_export_energy: sensor.grid_export_energy     # kWh lifetime total
  solar_power: sensor.solar_power                   # W
  solar_energy: sensor.solar_energy                 # kWh lifetime total
  solar_forecast: sensor.power_production_now       # W, Forecast.Solar
  water_today: sensor.panel_water_today            # L today (packages/panel_water.yaml)
  # Today's kWh, reset at midnight by Home Assistant (packages/panel_energy.yaml and
  # panel_solar.yaml) – the same numbers on every panel. Missing: the panel counts
  # from its own midnight snapshot instead.
  import_today: sensor.grid_import_today
  export_today: sensor.grid_export_today
  solar_today: sensor.solar_energy_today
  water_price: input_number.water_price             # £ per m³
  water_standing: input_number.water_standing_charge             # £ per year
  waste_water_standing: input_number.waste_water_standing_charge # £ per year

  # ── Plants ──
  indoor_temp: sensor.living_room_temperature       # CHANGE to your indoor temperature sensor
  plant_multiplier: input_number.plant_water_multiplier

  # Touch alignment. The log prints "Touch: x=…, y=…" for every tap; tapping the
  # far-left plant should give x ≈ 390, y ≈ 1240. If x comes out near 1480
  # instead, set this back to "true".
  touch_mirror_x: "false"


  # ── Heating: rooms come from HA areas via sensor.panel_rooms (configuration.yaml) ──
  rooms_sensor: sensor.panel_rooms
  thermostat: climate.house_thermostat   # your Generic Thermostat helper (sensor: Heating Leading Temperature)

  # 15 sample plants – name shown on the card ("" hides it) and type, which picks the icon.
  # These are only defaults: the "Plant N Name" / "Plant N Icon" helpers in HA
  # override them (type "-" as the name in HA to hide a plant).
  #   foliage cactus succulent flowering orchid tulip grass palm herb tree chili
  # Glass size and days per glass live in HA (input_number.plant_N_glass_ml / plant_N_days).
  plant1_name: "Monstera"
  plant1_type: "foliage"
  plant2_name: "Snake plant"
  plant2_type: "grass"
  plant3_name: "Peace lily"
  plant3_type: "flowering"
  plant4_name: "Orchid"
  plant4_type: "orchid"
  plant5_name: "Cactus"
  plant5_type: "cactus"
  plant6_name: "Basil"
  plant6_type: "herb"
  plant7_name: "Fiddle fig"
  plant7_type: "tree"
  plant8_name: "Pothos"
  plant8_type: "foliage"
  plant9_name: "Aloe vera"
  plant9_type: "succulent"
  plant10_name: "Spider plant"
  plant10_type: "grass"
  plant11_name: "Kentia palm"
  plant11_type: "palm"
  plant12_name: "Jade plant"
  plant12_type: "succulent"
  plant13_name: "Chili pepper"
  plant13_type: "chili"
  plant14_name: "Tulips"
  plant14_type: "tulip"
  plant15_name: "Calathea"
  plant15_type: "foliage"

esp32:
  board: seeed_xiao_esp32s3
  # The E1003 has 32 MB of flash; 16 MB partitions leave plenty of room for
  # voice (wake word + Assist). Changing this changes the partition table, so
  # the FIRST install after this change must be over USB – wireless updates
  # work again from then on.
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal          # required for the E1003 framebuffer

preferences:
  flash_write_interval: 10min

logger:
  hardware_uart: UART0

api:
  homeassistant_services: true   # device calls HA actions (set targets, heating mode)
  reboot_timeout: 0s             # keep running (showing the last data) when HA can't reach the panel
  on_client_connected:
    - lambda: 'if (client_info.find("Home Assistant") != std::string::npos) id(ha_ok) = true;'
    - script.execute: first_limit_sync
    - script.execute: plants_to_ha
  on_client_disconnected:
    - lambda: 'if (client_info.find("Home Assistant") != std::string::npos) id(ha_ok) = false;'
  encryption:
    key: !secret reterminal_e1003__encryption_key
  # Called by Home Assistant (voice commands in configuration.yaml, or any
  # automation): esphome.reterminal_e1003_show_page  name: main | energy |
  # heating | plants | agenda | settings
  actions:
    # esphome.reterminal_e1003_refresh – redraw now with the latest data (used
    # when the thermostat target is changed in HA). Skipped while a menu or
    # card is open and in use, like the scheduled refreshes.
    - action: refresh
      then:
        - lambda: |-
            const int pg = id(page);
            const bool open_ui = !id(edit_area).empty() || (pg == 2 && id(more_page) >= 0) ||
                                 pg >= 3;
            if (open_ui && id(ui_touch_ms) != 0 && millis() - id(ui_touch_ms) < 120000) return;
            id(force_full) = true;
            id(epaper_display).update();
    - action: show_page
      variables:
        name: string                 # not "page": that would hide the page global
      then:
        - lambda: |-
            std::string w = name.str();
            for (auto &c : w) c = tolower(c);
            int p = -1;
            if (w == "main" || w == "home")              p = 0;
            else if (w == "energy" || w == "power")      p = 1;
            else if (w == "heating" || w == "rooms")     p = 2;
            else if (w == "plants")                      p = 3;
            else if (w == "settings")                    { p = 4; if (id(page) != 4) id(prev_page) = id(page); }
            else if (w == "agenda" || w == "calendar" || w == "tasks") p = 5;
            else if (w == "lights" || w == "light" || w == "lamps") p = 9;
            if (p < 0) { ESP_LOGW("voice", "Unknown page '%s'", w.c_str()); return; }
            if (p == 4 && id(page) != 4) id(prev_page) = id(page);
            id(page) = p;
            id(edit_area) = "";
            id(more_page) = -1;
            id(plant_page) = 0;
            id(force_full) = true;
            id(epaper_display).update();

ota:
  - platform: esphome
    password: !secret reterminal_e1003__ota_password
    on_begin:
      - lambda: 'id(wake_mode) = 2;'          # an update is coming in: don't sleep

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # First wireless install only: the board is still called
  # reterminal-e1003-energy on the network. Remove this line once it's flashed.
  use_address: reterminal-e1003-energy.local
  # No known network for 30 s → the setup hotspot starts (it keeps looking for
  # your Wi-Fi meanwhile). Join it from the QR code on the screen, pick the new
  # network and its password; it's saved on the panel.
  ap:
    ssid: "${ap_ssid}"
    password: "${ap_password}"
    ap_timeout: 30s
  reboot_timeout: 0s          # never reboot just because Wi-Fi is missing

captive_portal:

# QR code that joins the setup hotspot (Wi-Fi setup page)
qr_code:
  - id: wifi_qr
    value: "WIFI:T:WPA;S:${ap_ssid};P:${ap_password};;"

