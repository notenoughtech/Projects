  # HA changed a plant level / reservoir / warning: new summary, redraw plant views soon
  - id: plant_levels_in
    mode: restart
    then:
      - delay: 2s
      - component.update: plant_summary_pub
      - lambda: |-
          if (id(page) == 0 || id(page) == 3) id(force_full) = true;
      - script.execute: refresh_soon

  # Once, after this firmware is flashed: hand the panel's plant levels (where HA
  # has none yet), reservoir size and warning to Home Assistant. From then on HA
  # keeps them, drains them every 5 minutes, and every panel reads them.
  - id: plants_to_ha
    mode: single
    then:
      - delay: 10s
      - if:
          condition:
            lambda: 'return id(ha_ok) && !id(plants_in_ha);'
          then:
            - lambda: 'ESP_LOGI("plants", "Handing plant water levels to Home Assistant (once)");'
            - homeassistant.action:
                action: script.panel_plants_import
                data:
                  levels: !lambda |-
                    number::Number *lv[15] = {id(p1_level), id(p2_level), id(p3_level), id(p4_level), id(p5_level), id(p6_level), id(p7_level), id(p8_level), id(p9_level), id(p10_level), id(p11_level), id(p12_level), id(p13_level), id(p14_level), id(p15_level)};
                    std::string o;
                    for (int i = 0; i < 15; i++)
                      o += str_sprintf("%s%.0f", i ? "," : "", std::isnan(lv[i]->state) ? 0.0f : lv[i]->state);
                    return o;
            - script.execute: push_plant_settings
            - delay: 4s
            - lambda: |-
                id(plants_in_ha) = true;
                // from now on: Home Assistant's levels
                sensor::Sensor *ha[15] = {id(ha_p1_level), id(ha_p2_level), id(ha_p3_level), id(ha_p4_level), id(ha_p5_level), id(ha_p6_level), id(ha_p7_level), id(ha_p8_level), id(ha_p9_level), id(ha_p10_level), id(ha_p11_level), id(ha_p12_level), id(ha_p13_level), id(ha_p14_level), id(ha_p15_level)};
                number::Number *lv[15] = {id(p1_level), id(p2_level), id(p3_level), id(p4_level), id(p5_level), id(p6_level), id(p7_level), id(p8_level), id(p9_level), id(p10_level), id(p11_level), id(p12_level), id(p13_level), id(p14_level), id(p15_level)};
                for (int i = 0; i < 15; i++) {
                  if (std::isnan(ha[i]->state)) continue;
                  auto c = lv[i]->make_call(); c.set_value(ha[i]->state); c.perform();
                }
            - script.execute: plant_levels_in

  # Settings → Plants changed here: reservoir size and warning → HA
  - id: push_plant_settings
    mode: restart
    then:
      - delay: 600ms
      - lambda: 'id(plant_set_ms) = millis();'
      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.plant_reservoir_glasses
            value: !lambda 'return str_sprintf("%d", id(max_glasses));'
      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.plant_warning_days
            value: !lambda 'return str_sprintf("%.1f", id(dry_days));'

  # First time HA connects: give the new helpers the panel's limits once;
  # from then on a change on either side is passed to the other
  - id: first_limit_sync
    mode: single
    then:
      - delay: 8s
      - if:
          condition:
            lambda: 'return id(ha_ok) && !id(lim_synced);'
          then:
            - lambda: |-
                ESP_LOGI("heating", "Sending the panel's heating limits to Home Assistant (first sync)");
                id(heat_lim_ms) = millis();
            - script.execute: push_limits
            - delay: 2s
            - lambda: 'id(lim_synced) = true;'

  # Settings changed a heating limit: re-check the alert now
  - id: heat_limits_changed
    mode: restart
    then:
      - delay: 500ms
      - component.update: heat_alert_pub
      - if:                                      # top bar now – unless Settings is open
          condition:                             # (it's redrawn on Done)
            lambda: 'return id(page) != 4;'
          then:
            - lambda: 'id(dirty_mask) |= 1u << 24;'
            - script.execute: refresh_now

  # Adds one glass to plant i (0-based), capped at the reservoir size
  - id: add_glass
    mode: queued
    parameters:
      i: int
    then:
      - lambda: |-
          number::Number *lv[15] = {id(p1_level), id(p2_level), id(p3_level), id(p4_level), id(p5_level), id(p6_level), id(p7_level), id(p8_level), id(p9_level), id(p10_level), id(p11_level), id(p12_level), id(p13_level), id(p14_level), id(p15_level)};
          sensor::Sensor *gl[15] = {id(p1_glass), id(p2_glass), id(p3_glass), id(p4_glass), id(p5_glass), id(p6_glass), id(p7_glass), id(p8_glass), id(p9_glass), id(p10_glass), id(p11_glass), id(p12_glass), id(p13_glass), id(p14_glass), id(p15_glass)};
          float glass = std::isnan(gl[i]->state) ? 250.0f : gl[i]->state;
          float cap = glass * id(max_glasses);
          float cur = std::isnan(lv[i]->state) ? 0.0f : lv[i]->state;
          auto call = lv[i]->make_call();
          call.set_value(std::min(cap, cur + glass));
          call.perform();
      - if:                                      # the real level lives in Home Assistant
          condition:
            lambda: 'return id(ha_ok);'
          then:
            - homeassistant.action:
                action: script.panel_water_plant
                data:
                  plant: !lambda 'return str_sprintf("%d", i + 1);'
                  glasses: "1"
      - component.update: plant_summary_pub
      - script.execute: refresh_soon

# Sleep between refreshes (Settings → Display → Refresh): the green button wakes it
deep_sleep:
  id: deep_sleep_ctl
  wakeup_pin:
    number: GPIO3
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: KEEP_AWAKE

interval:
  # Wi-Fi setup screen: open it when the hotspot comes up (no known Wi-Fi),
  # redraw when its state changes, leave it once connected
  - interval: 5s
    then:
      - lambda: |-
          if (id(wake_mode) == 1) return;           // timer wake: just the refresh
          const bool ap = wifi::global_wifi_component->is_ap_active();
          const bool conn = wifi::global_wifi_component->is_connected();
          const int st = conn ? 2 : ap ? 1 : 0;
          if (ap && id(page) != 8) {
            ESP_LOGI("wifi", "No known Wi-Fi – showing the setup screen");
            id(setup_ret) = (id(page) == 7) ? 7 : 0;
            id(page) = 8;
            id(net_state) = st;
            id(force_full) = true;
            id(epaper_display).update();
            return;
          }
          if (id(page) != 8 || st == id(net_state)) return;
          const int was = id(net_state);
          id(net_state) = st;
          if (st == 2 && was != -1) {                 // connected again: back after a moment
            id(page) = id(setup_ret);
            id(net_state) = -1;
          }
          id(force_full) = true;
          id(epaper_display).update();
  # Display clock: a full redraw every minute (skipped while you're using the
  # screen). Power ↔ water only switches when you tap the today card (Home)
  # or the Energy page.
  - interval: 30s
    then:
      - script.execute: day_check
      - lambda: |-
          if (id(wake_mode) == 1 || id(going_sleep)) return;   // timer wake / about to sleep
          id(tick)++;
          if (id(done_ms) && millis() - id(done_ms) > 600000) { id(done_uids).clear(); id(done_ms) = 0; }
          const int pg = id(page);
          // Something is open (room controls, More rooms, Plants list, Settings,
          // Agenda): leave the screen alone for 2 min after the last tap so cards
          // don't change or move under your finger. Taps still refresh as usual.
          const bool open_ui = !id(edit_area).empty() || (pg == 2 && id(more_page) >= 0) ||
                               pg >= 3;
          if (open_ui && id(ui_touch_ms) != 0 && millis() - id(ui_touch_ms) < 120000) {
            ESP_LOGD("refresh", "Scheduled refresh skipped: page in use");
            return;
          }
          // anywhere else: no full redraw within 30 s of a tap, so a full-screen
          // refresh never holds up the next tap
          if (id(ui_touch_ms) != 0 && millis() - id(ui_touch_ms) < 30000) return;
          // power ↔ water only changes when the today card is tapped
          if (id(tick) % 2 == 0) {
            id(force_full) = true;                    // scheduled full redraw (every minute)
            id(epaper_display).update();
          }
  # 1-minute rolling averages for the solar + grid card (12 samples, 5 s apart)
  - interval: 5s
    then:
      - lambda: |-
          static float gr[12], sr[12];
          static int n = 0, k = 0;
          const float g = id(myGridConsumption).state, so = id(mySolarProduction).state;
          if (std::isnan(g)) return;
          gr[k] = g;
          sr[k] = std::isnan(so) ? 0.0f : so;
          k = (k + 1) % 12;
          if (n < 12) n++;
          float a = 0, b = 0;
          for (int i = 0; i < n; i++) { a += gr[i]; b += sr[i]; }
          id(grid_avg) = a / n;
          id(solar_avg) = b / n;
  # Sleep mode on (Settings → Display → Refresh): 2 min after the last touch or
  # button press the panel draws Home with an "asleep" note and sleeps
  - interval: 10s
    then:
      - lambda: |-
          // night sleep (Settings → Night sleep): between night_from and night_to
          auto in_night = [&](const ESPTime &tn) -> bool {
            if (!id(night_on) || !tn.is_valid()) return false;
            const int m = tn.hour * 60 + tn.minute, a = id(night_from), b = id(night_to);
            if (a == b) return false;
            return a < b ? (m >= a && m < b) : (m >= a || m < b);
          };
          const bool night = in_night(id(ha_time).now());
          if ((id(refresh_idx) <= 0 && !night) || id(wake_mode) != 0 || id(going_sleep)) return;
          if (id(page) == 8 || wifi::global_wifi_component->is_ap_active()) return;   // Wi-Fi setup
          const uint32_t idle = night ? 300000u : 120000u;     // night: 5 min after the last touch
          const uint32_t nowms = millis();
          if (nowms < idle) return;
          const uint32_t a = nowms - id(act_ms), b = id(ui_touch_ms) ? nowms - id(ui_touch_ms) : a;
          if (std::min(a, b) < idle) return;
          ESP_LOGI("sleep", "%s without a touch – going to sleep", night ? "5 min (night sleep)" : "2 min");
          id(go_sleep).execute();
  # (the plants drink in Home Assistant now: automation "plants_drink", every 5 min)

# ─────────────────────────────────────────────────────────────
# Buttons
# ─────────────────────────────────────────────────────────────
binary_sensor:
  # Boiler actively heating (template "Boiler Active" in configuration.yaml)
  - platform: homeassistant
    entity_id: binary_sensor.boiler_active
    id: boiler_on
    internal: true
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: key_left
    name: "Left button"
    on_press:
      - lambda: |-
          id(act_ms) = millis();
          if (id(wake_mode) == 1) id(wake_mode) = 0;      // in use now: no sleep for 2 min
          if (id(going_sleep)) { id(going_sleep) = false; id(force_full) = true; }
    on_multi_click:
      - timing:
          - ON for at most 0.8s
          - OFF for at least 0.05s
        then:
          - if:
              condition:
                lambda: 'return id(fb_sound);'
              then:
                - script.execute: { id: buzz, ms: 25, count: 1 }
          - script.execute:
              id: nav
              dir: -1
      - timing:                          # hold: Settings
          - ON for at least 1s
        then:
          - script.execute: { id: buzz, ms: 20, count: 3 }
          - script.execute:
              id: nav
              dir: 2
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: key_right
    name: "Right button"
    on_press:
      - lambda: |-
          id(act_ms) = millis();
          if (id(wake_mode) == 1) id(wake_mode) = 0;      // in use now: no sleep for 2 min
          if (id(going_sleep)) { id(going_sleep) = false; id(force_full) = true; }
    on_multi_click:
      - timing:
          - ON for at most 0.8s
          - OFF for at least 0.05s
        then:
          - if:
              condition:
                lambda: 'return id(fb_sound);'
              then:
                - script.execute: { id: buzz, ms: 25, count: 1 }
          - script.execute:
              id: nav
              dir: 1
      - timing:                          # hold: Settings
          - ON for at least 1s
        then:
          - script.execute: { id: buzz, ms: 20, count: 3 }
          - script.execute:
              id: nav
              dir: 2
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true       # also wakes the panel from sleep (deep_sleep below)
    id: key_green
    name: "Green button"
    on_press:
      - lambda: |-
          id(act_ms) = millis();
          if (id(wake_mode) == 1) id(wake_mode) = 0;      // in use now: no sleep for 2 min
          if (id(going_sleep)) { id(going_sleep) = false; id(force_full) = true; }
    on_multi_click:
      - timing:                          # tap: full refresh
          - ON for at most 0.8s
          - OFF for at least 0.05s
        then:
          - if:
              condition:
                lambda: 'return id(fb_sound);'
              then:
                - script.execute: { id: buzz, ms: 25, count: 1 }
          - script.execute: full_refresh
      - timing:                          # hold: Home page (voice: say "Okay Nabu")
          - ON for at least 1s
        then:
          - script.execute: { id: buzz, ms: 20, count: 3 }
          - script.execute:
              id: nav
              dir: 3

# ─────────────────────────────────────────────────────────────
# Voice: on-board PDM microphone → Home Assistant Assist
#
# Say "Okay Nabu" (or hold the green button), then e.g. "show heating",
# "show plants", "show agenda", "show main", "heating on", "heating off",
# "set heating to 21". The commands are custom sentences in Home Assistant
# (custom_sentences/en/panel.yaml + intent_script in configuration.yaml).
# The E1003 has no speaker: what you said and the reply appear in the top bar.
# The "Wake word" switch (in HA) turns "Okay Nabu" listening on or off.
# ─────────────────────────────────────────────────────────────
i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO42          # PDM clock

microphone:
  - platform: i2s_audio
    id: onboard_mic
    i2s_audio_id: i2s_mic
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO41            # PDM data
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

micro_wake_word:
  id: mww
  microphone: onboard_mic
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda 'return wake_word;'

voice_assistant:
  id: va
  microphone: onboard_mic
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - if:
        condition:
          switch.is_on: wake_word_sw
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  on_listening:
    - script.stop: va_clear
    - script.execute: { id: buzz, ms: 60, count: 1 }
    - lambda: 'id(va_phase) = 1; id(va_text) = "Listening...";'
    - script.execute: va_show
  on_stt_end:
    - lambda: 'id(va_phase) = 2; id(va_text) = "\"" + x + "\"";'
    - script.execute: va_show
  on_tts_start:                     # the reply text (shown, not spoken)
    - lambda: 'id(va_phase) = 3; id(va_text) = x;'
    - script.execute: va_show
  on_error:
    - lambda: |-
        if (code == "wake-word-timeout" || code == "wake_word_detection_aborted") return;
        id(va_phase) = 3;
        id(va_text) = "Voice: " + message;
    - script.execute: va_show
  on_end:
    - script.execute: va_clear
    - wait_until:
        not:
          voice_assistant.is_running:
    - if:
        condition:
          and:
            - switch.is_on: wake_word_sw
            - not:
                micro_wake_word.is_running:
        then:
          - micro_wake_word.start:

switch:
  - platform: template
    id: wake_word_sw
    name: "Wake word"
    icon: mdi:microphone
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - micro_wake_word.start:
    on_turn_off:
      - micro_wake_word.stop:

# ─────────────────────────────────────────────────────────────
# Display + touch
# ─────────────────────────────────────────────────────────────
i2c:
  scl: GPIO20
  sda: GPIO19

spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

touchscreen:
  - platform: gt911
    id: e1003_touch
    display: epaper_display
    # The display driver switches on the board's power rails (GPIO21/GPIO11)
    # during its own setup. Set the touch chip up after that, otherwise it
    # can't be reached and is marked failed at boot.
    setup_priority: 300
    interrupt_pin: GPIO2
    reset_pin: GPIO48
    transform:
      mirror_x: ${touch_mirror_x}
    # A plant that was pressed but not held long enough: it was a tap → one glass
    on_release:
      - lambda: |-
          id(touch_down) = false;
          const int p = id(press_plant);
          if (p < 0) return;
          id(press_plant) = -1;
          id(plant_hold).stop();
          id(tap_plant).execute(p, (int) id(press_bit));
    on_touch:
      - logger.log:
          format: "Touch: x=%d, y=%d"
          args: ["touch.x", "touch.y"]
      # 1. feedback straight away: tick + bold border on what was touched
      - lambda: |-
          const int tx = touch.x, ty = touch.y, pg = id(page);
          id(touch_down) = true;
          id(act_ms) = millis();
          if (id(wake_mode) == 1) id(wake_mode) = 0;      // in use now: no sleep for 2 min
          if (id(going_sleep)) { id(going_sleep) = false; id(force_full) = true; }
          if (id(fb_sound)) id(buzz).execute(8, 1);
          if (!id(fb_ui) || ty < 64) return;
          int r[5] = {0, 0, 0, 0, 28};
          auto in = [&](int x, int y, int w, int h) { return tx >= x && tx < x + w && ty >= y && ty < y + h; };
          auto set = [&](int x, int y, int w, int h, int rad) { r[0] = x; r[1] = y; r[2] = w; r[3] = h; r[4] = rad; };
          if (pg == 0) {
            const auto &L = id(home_lay);
            if (id(show_plants) && ty >= 1084) {
              for (int j = 0; j < 7; j++)
                if (in(64 + j * 250 - 7, 1084, 250, 272)) set(64 + j * 250, 1100, 236, 240, 22);
            } else if (L[2] > 0 && in(L[0] - 8, L[1] - 8, L[2] + 16, L[3] + 16)) {
              set(L[0], L[1], L[2], L[3], L[3] / 2);                    // 24 h title button
            } else if (L[10] > 0 && in(L[8], L[9], L[10], L[11])) {
              set(L[8], L[9], L[10], L[11], 28);                        // 24 h card
            } else if (L[6] > 0 && in(L[4], L[5], L[6], L[7])) {
              set(L[4], L[5], L[6], L[7], 28);                          // agenda card
            }
          } else if (pg == 1) {
            const auto &T = id(en_tabs);
            const int nu = (id(show_energy) ? 1 : 0) + (id(show_water) ? 1 : 0) + (id(show_heating) ? 1 : 0);
            const int k = (tx - T[0]) / T[3];
            if (ty >= T[1] && ty < T[1] + 76 && tx >= T[0] && k < nu && tx - T[0] - k * T[3] < T[2])
              set(T[0] + k * T[3], T[1], T[2], 76, 38);
            else if (ty >= 312 && ty < 502) {                       // 7 days · 30 days · this month
              const int c = (tx - 48) / 360;
              const bool sol = c == 3 && id(home_util) == 0 && id(show_energy) && id(show_solar);
              if ((c == 1 || c == 2 || c == 4 || sol) && tx - 48 - c * 360 < 336) set(48 + c * 360, 312, 336, 190, 28);
            } else if (in(48, 526, 600, 378)) set(48, 526, 600, 378, 28);
            else if (in(672, 526, 1152, 378)) set(672, 526, 1152, 378, 28);
            else if (in(48, 928, 1242, 448)) set(48, 928, 1242, 448, 28);
          } else if (pg == 3) {
            if (ty >= 396 && ty < 1236) {
              const int c = (tx - 48) / 450, rr = (ty - 396) / 432;
              if (c >= 0 && c < 4 && rr >= 0 && rr < 2) set(48 + c * 450, 396 + rr * 432, 426, 408, 28);
            } else if (ty >= 1256) {
              if (in(48, 1256, 320, 100)) set(48, 1256, 320, 100, 28);
              else if (in(1284, 1256, 260, 100)) set(1284, 1256, 260, 100, 28);
              else if (in(1564, 1256, 260, 100)) set(1564, 1256, 260, 100, 28);
            }
          } else if (pg == 5 && tx >= 1176 && ty >= 284 && ty < 284 + 11 * 88) {
            const int k = (ty - 284) / 88;                              // a task row
            set(1176 + 16, 284 + k * 88 + 6, 648 - 32, 76, 20);
          } else if (pg == 2 || pg >= 4) {
            const auto &zs = id(zones);
            for (int i = (int) zs.size() - 1; i >= 0; i--) {
              const auto &z = zs[i];
              if (in(z[0], z[1], z[2], z[3])) { set(z[0], z[1], z[2], z[3], std::min(28, std::min(z[2], z[3]) / 2)); break; }
            }
          }
          if (r[2] <= 0) return;
          for (int k = 0; k < 5; k++) id(fb_rect)[k] = r[k];
          id(fb_pending) = true;
          id(dirty_mask) |= 1u << 26;
          id(epaper_display).update_mode(it8951::UPDATE_MODE_DU);
      # 2. then what the touch does (the screen update queues behind the border)
      - wait_until:
          condition:
            lambda: 'return !id(fb_pending);'
          timeout: 250ms
      - lambda: |-
          const int tx = touch.x, ty = touch.y;
          const int pg = id(page);
          id(ui_touch_ms) = millis();
          auto refresh = [&](uint32_t bits) {
            id(dirty_mask) |= bits;
            id(refresh_now).execute();
          };

          // ───────── TOP BAR (every page): tap a warning to jump to it ─────────
          if (ty < 64) {
            const auto &h = id(bar_hit);
            if (h[0] >= 0 && tx >= h[0] && tx < h[1]) {
              id(page) = 3;
              id(plant_page) = 0;
              id(edit_area) = "";
              id(force_full) = true;
              id(epaper_display).update();
            } else if (h[2] >= 0 && tx >= h[2] && tx < h[3]) {
              id(page) = 2;
              id(more_page) = id(bar_sens_page);
              id(edit_area) = "";
              id(force_full) = true;
              id(epaper_display).update();
            } else if (h[4] >= 0 && tx >= h[4] && tx < h[5]) {
              id(page) = 2;                              // heating over its limit
              id(more_page) = -1;
              id(edit_area) = "";
              id(force_full) = true;
              id(epaper_display).update();
            }
            return;
          }

          // finger on a plant: tap (released quickly) = one glass, hold 0.65 s = room picker
          auto water = [&](int p, uint32_t bit) {
            if (p < 0 || p >= 15) return;
            if (!id(touch_down)) {                      // already lifted: it was a tap
              id(tap_plant).execute(p, (int) bit);
              return;
            }
            id(press_plant) = p;
            id(press_bit) = bit;
            id(plant_hold).execute();
          };

          // ───────── HOME ─────────
          if (pg == 0) {
            // plant tiles: 6 thirstiest + "All plants" (when plants are shown)
            if (id(show_plants) && ty >= 1084 && tx >= 57) {
              int j = std::min(6, (tx - 57) / 250), off = (tx - 57) % 250;
              if (j == 6 || off < 250) {
                if (j == 6) {
                  id(page) = 3;
                  id(plant_page) = 0;
                  id(force_full) = true;
                  id(epaper_display).update();
                } else {
                  water(id(plant_order)[j], 1u << j);
                }
              }
              return;
            }

            const auto &L = id(home_lay);
            // 24 h title button → that utility's page (Energy page, same utility)
            if (L[2] > 0 && ty >= L[1] - 8 && ty < L[1] + L[3] + 8 && tx >= L[0] - 8 && tx < L[0] + L[2] + 8) {
              const bool en[3] = {id(show_energy), id(show_water), id(show_heating)};
              int u = id(home_util);
              if (u < 0 || u > 2 || !en[u]) id(home_util) = en[0] ? 0 : en[1] ? 1 : 2;
              id(page) = 1;
              id(force_full) = true;
              id(epaper_display).update();
              return;
            }
            // the rest of the 24 h card: next utility (power → water → heating)
            const bool on24 = L[10] > 0 && ty >= L[9] && ty < L[9] + L[11] && tx >= L[8] && tx < L[8] + L[10];
            if (on24) {
              const bool en[3] = {id(show_energy), id(show_water), id(show_heating)};
              int u = id(home_util);
              for (int k = 0; k < 3; k++) {
                u = (u + 1) % 3;
                if (en[u]) break;
              }
              if (u == id(home_util)) return;           // only one utility on
              id(home_util) = u;
              refresh(1u << 6);
              return;
            }
            // agenda card → Agenda page
            if (L[6] > 0 && ty >= L[5] && ty < L[5] + L[7] && tx >= L[4] && tx < L[4] + L[6]) {
              id(page) = 5;
              id(force_full) = true;
              id(epaper_display).update();
            }
            return;
          }

          // ───────── ENERGY: the tabs switch power / water / heating ─────────
          if (pg == 1) {
            const auto &T = id(en_tabs);
            // figures and charts: flip their view, redraw just that card
            auto flip = [&](uint32_t b) { id(en_view) ^= b; refresh(b); };
            if (ty >= 312 && ty < 502) {
              const int c = (tx - 48) / 360;
              if (tx - 48 - c * 360 >= 336) return;
              if (c == 1) flip(1u); else if (c == 2) flip(2u); else if (c == 4) flip(4u);
              else if (c == 3 && id(home_util) == 0 && id(show_energy) && id(show_solar)) flip(64u);
              return;
            }
            if (ty >= 526 && ty < 904) { if (tx < 648) flip(8u); else if (tx >= 672) flip(16u); return; }
            if (ty >= 928 && tx < 1290) { flip(32u); return; }
            if (ty < T[1] || ty >= T[1] + 76 || tx < T[0]) return;
            const int k = (tx - T[0]) / T[3];
            if (tx - T[0] - k * T[3] >= T[2]) return;           // the gap between tabs
            const bool en[3] = {id(show_energy), id(show_water), id(show_heating)};
            int q = 0;
            for (int u = 0; u < 3; u++) {
              if (!en[u]) continue;
              if (q++ == k) {
                if (u == id(home_util)) return;
                id(home_util) = u;
                id(force_full) = true;
                id(epaper_display).update();
                return;
              }
            }
            return;
          }

          // ───────── PLANTS ─────────
          if (pg == 3) {
            if (ty >= 396 && ty < 1236 && tx >= 48 && tx < 1824) {
              int c = (tx - 48) / 450, offx = (tx - 48) % 450;
              int r = (ty - 396) / 432, offy = (ty - 396) % 432;
              if (c < 4 && offx < 426 && r < 2 && offy < 408) {
                int slot = r * 4 + c, k = id(plant_page) * 8 + slot;
                if (k < 15) water(id(plant_order)[k], 1u << slot);
              }
              return;
            }
            if (ty >= 1260 && ty < 1356) {
              const char *names[15];
              for (int q_ = 0; q_ < 15; q_++) names[q_] = id(plant_nm)[q_].c_str();
              int active = 0;
              for (int i = 0; i < 15; i++) if (names[i][0] != 0) active++;
              const int pages = std::max(1, (active + 7) / 8);
              int np = id(plant_page);
              if (tx >= 48 && tx < 368) {                // Home
                id(page) = 0;
                id(force_full) = true;
                id(epaper_display).update();
                return;
              }
              if (tx >= 1284 && tx < 1544) np--;         // Prev
              else if (tx >= 1564 && tx < 1824) np++;    // Next
              if (np >= 0 && np < pages && np != id(plant_page)) {
                id(plant_page) = np;
                id(force_full) = true;
                id(epaper_display).update();
              }
            }
            return;
          }

          // ───────── HEATING + SETTINGS + AGENDA + ROOM PICKER: tap zones from the display ─────────
          if (pg != 2 && pg < 4) return;
          int act = -1, arg = 0;
          {
            const auto &zs = id(zones);
            for (int i = (int) zs.size() - 1; i >= 0; i--) {     // last drawn = on top
              const auto &z = zs[i];
              if (tx >= z[0] && tx < z[0] + z[2] && ty >= z[1] && ty < z[1] + z[3]) { act = z[4]; arg = z[5]; break; }
            }
          }
          if (act < 0) return;
          const uint32_t HERO = 1u << 7, GRID = 1u << 23;
          auto card_bit = [&](const std::string &area) -> uint32_t {
            if (area.empty()) return 0;
            const auto &sl = id(slot_ids);
            for (int j = 0; j < 9; j++) if (sl[j] == area) return 1u << (8 + j);
            return 0;
          };
          const std::string ea = id(edit_area);
          switch (act) {
            // ── heating ──
            case 1: {                                    // room card: open / close its controls
              const std::string area = id(slot_ids)[arg];
              if (area.empty()) break;
              id(edit_area) = area == ea ? std::string() : area;
              refresh(card_bit(area) | card_bit(ea));
              break;
            }
            case 2: {                                    // preset k → target, room leads
              if (ea.empty()) break;
              const float t = id(preset_t)[arg];
              const std::string old_lead = id(lead_area);
              ESP_LOGI("heating", "%s → %.1f °C (leading)", ea.c_str(), t);
              id(pend_area) = ea;
              id(pend_t) = t;
              id(pend_ms) = millis();
              id(edit_area) = "";
              id(set_room_target).execute(ea, t);
              // heating off? picking a setpoint switches it on too
              {
                const bool heat_on = id(pend_mode) >= 0 && millis() - id(pend_mode_ms) < 15000
                                         ? id(pend_mode) == 1 : id(heat_mode).state == "heat";
                if (!heat_on) {
                  ESP_LOGI("heating", "Heating was off – switching it on");
                  id(pend_mode) = 1;
                  id(pend_mode_ms) = millis();
                  id(set_heat_mode).execute(true);
                }
              }
              refresh(card_bit(ea));                     // the card you touched first …
              id(followup_mask) |= HERO | card_bit(old_lead);   // … then the leading-room panel
              id(refresh_followup).execute();
              break;
            }
            case 3: {                                    // pin / unpin
              if (ea.empty()) break;
              const bool pinned = id(edit_pinned);
              if (!pinned && id(pin_count) >= 6) break;
              ESP_LOGI("heating", "%s → %s", ea.c_str(), pinned ? "unpinned" : "pinned");
              id(pend_pin_area) = ea;
              id(pend_pin_on) = !pinned;
              id(pend_pin_ms) = millis();
              id(edit_area) = "";
              id(toggle_pin).execute(ea);
              refresh(GRID);                             // card sizes / order change
              break;
            }
            case 4:                                      // close controls
              id(edit_area) = "";
              refresh(card_bit(ea));
              break;
            case 5: {                                    // heating on / off
              bool heat_on = id(pend_mode) >= 0 && millis() - id(pend_mode_ms) < 15000
                                 ? id(pend_mode) == 1 : id(heat_mode).state == "heat";
              id(pend_mode) = heat_on ? 0 : 1;
              id(pend_mode_ms) = millis();
              id(set_heat_mode).execute(!heat_on);
              refresh(HERO);
              break;
            }
            case 6:                                      // pinned ↔ more rooms
              id(more_page) = id(more_page) < 0 ? 0 : -1;
              id(edit_area) = "";
              refresh(GRID);
              break;
            case 7:                                      // more rooms: prev / next (wraps)
            case 8: {
              const int n = std::max(1, id(heat_pages));
              id(more_page) = (id(more_page) + (act == 7 ? -1 : 1) + n) % n;
              id(edit_area) = "";
              refresh(GRID);
              break;
            }

            // ── settings (arg 0 = minus / first option, 1 = plus / second …) ──
            case 20:                                     // theme
              if (id(theme_dark) != (arg == 1)) {
                id(theme_dark) = arg == 1;
                id(epaper_display).set_invert_colors(id(theme_dark));
                id(force_full) = true;
                id(epaper_display).update();
              }
              break;
            case 21: id(clock_12h) = arg == 1; refresh(1u << 1); break;
            case 22: id(temp_f) = arg == 1;    refresh(1u << 2); break;
            case 23: id(press_unit) = arg;     refresh(1u << 3); break;
            // ── Lights page ──
            case 70: {                                   // a light / device: switch it
              if (arg < 0 || arg >= 30) break;
              const std::string e = id(lt_ents)[arg];
              if (e.empty() || id(lt_on)[arg] < 0) break;
              const int want = id(lt_on)[arg] == 1 ? 0 : 1;
              id(lt_pend)[e] = want;
              id(lt_pend_ms)[e] = millis();
              id(lt_send).execute("set", e, want ? "on" : "off");
              refresh(1u << (8 + arg / 5));
              break;
            }
            case 74: {                                   // brightness 30 / 50 / 100 % on main / mood
              const int sw = arg / 3, lv = arg % 3;
              static const int LVL[3] = {30, 50, 100};
              if (sw < 0 || sw >= 30) break;
              const std::string e = id(lt_ents)[sw];
              if (e.empty()) break;
              id(lt_bpend)[e] = LVL[lv];
              id(lt_bpend_ms)[e] = millis();
              id(lt_pend)[e] = 1;                        // it comes on too
              id(lt_pend_ms)[e] = millis();
              char v[8];
              snprintf(v, sizeof(v), "%d", LVL[lv]);
              id(lt_send).execute("bri", e, v);
              refresh(1u << (8 + sw / 5));
              break;
            }
            case 71: {                                   // pin / unpin a room
              const std::string a = id(lt_area)[arg];
              if (!a.empty()) id(lt_send).execute("pin", a, "");
              break;                                     // the new order arrives from HA
            }
            case 72:                                     // All lights: arg = 1 on, 0 off
              id(lt_all_pend) = arg;
              id(lt_all_ms) = millis();
              id(lt_send).execute("all", "", arg ? "on" : "off");
              refresh(1u << 1);
              break;
            case 73: {                                   // previous / next page of rooms (wraps)
              const std::string &src = id(lt_rows).state;
              int n = src.empty() ? 0 : 1;
              for (char c : src) if (c == ';') n++;
              const int np = std::max(1, (n + 5) / 6);
              id(lt_pg) = (id(lt_pg) + (arg ? 1 : -1) + np) % np;
              id(force_full) = true;
              id(epaper_display).update();
              break;
            }
            case 43:                                     // Settings tab: General / Alerts
              if (id(set_tab) != arg) {
                id(set_tab) = arg;
                id(force_full) = true;
                id(epaper_display).update();
              }
              break;
            case 44:                                     // heating per month (0 = off)
              if (id(lim_budget)) id(lim_month_gbp) = std::min(1000.0f, std::max(0.0f, id(lim_month_gbp) + (arg ? 5.0f : -5.0f)));
              else                id(lim_month_h)   = std::min(744.0f, std::max(0.0f, id(lim_month_h) + (arg ? 5.0f : -5.0f)));
              refresh(1u << 18);
              id(heat_limits_changed).execute();
              id(push_limits).execute();                 // → HA helpers
              break;
            case 45: case 46: {                          // electricity / water: row (day, week, month) × − +
              const int r = arg / 2;
              static const float ST[2][3] = {{0.5f, 2.0f, 10.0f}, {10.0f, 50.0f, 250.0f}};
              static const float MX[2][3] = {{100.0f, 500.0f, 2000.0f}, {2000.0f, 10000.0f, 50000.0f}};
              const int q = act == 45 ? 0 : 1;
              auto &L = q == 0 ? id(pw_lim) : id(wt_lim);
              L[r] = std::min(MX[q][r], std::max(0.0f, L[r] + ((arg & 1) ? ST[q][r] : -ST[q][r])));
              static const uint32_t BITS[2][3] = {{1u << 19, 1u << 20, 1u << 21}, {1u << 22, 1u << 23, 1u << 25}};
              refresh(BITS[q][r]);
              id(usage_alert_refresh).execute();
              id(push_limits).execute();                 // → HA helpers
              break;
            }
            case 47:                                     // night sleep: 0 off, 1 on
              id(night_on) = arg == 1;
              id(act_ms) = millis();
              refresh(1u << 27);
              break;
            case 48:                                     // asleep from: − / + 30 min
            case 49: {                                   // wake up at: − / + 30 min
              int &tv = act == 48 ? id(night_from) : id(night_to);
              tv = ((tv + (arg ? 30 : -30)) % 1440 + 1440) % 1440;
              id(act_ms) = millis();
              refresh(act == 48 ? (1u << 28) : (1u << 29));
              break;
            }
            case 37:                                     // refresh: 0 = 1 min … 5 = 2 h (sleep between)
              id(refresh_idx) = std::min(5, std::max(0, arg));
              id(act_ms) = millis();                     // stay awake 2 min from now
              refresh(1u << 17);
              break;
            case 24:                                     // touch feedback: 0 tick, 1 bold border
              if (arg == 0) id(fb_sound) = !id(fb_sound); else id(fb_ui) = !id(fb_ui);
              refresh(1u << 4);
              break;
            case 25: {                                   // presets: arg = k * 2 + (0 minus, 1 plus)
              const int k = arg / 2;
              float &v = id(preset_t)[k];
              v = std::min(25.0f, std::max(5.0f, v + (arg % 2 ? 0.5f : -0.5f)));
              refresh(1u << (5 + k));
              break;
            }
            case 26:
              id(max_glasses) = std::min(5, std::max(1, id(max_glasses) + (arg ? 1 : -1)));
              refresh(1u << 8);
              id(push_plant_settings).execute();         // → HA helper
              break;
            case 27:
              id(dry_days) = std::min(5.0f, std::max(0.5f, id(dry_days) + (arg ? 0.5f : -0.5f)));
              refresh(1u << 9);
              id(push_plant_settings).execute();         // → HA helper
              break;
            case 28: {
              float cur = (!std::isnan(id(pend_mult)) && millis() - id(pend_mult_ms) < 15000)
                              ? id(pend_mult) : id(plant_mult).state;
              if (std::isnan(cur)) cur = 1.0f;
              const float v = std::min(5.0f, std::max(0.1f, roundf((cur + (arg ? 0.05f : -0.05f)) * 100) / 100));
              id(pend_mult) = v;
              id(pend_mult_ms) = millis();
              id(set_multiplier).execute(v);
              refresh(1u << 10);
              break;
            }
            case 29:
              id(samples_ms) = millis();
              id(load_plant_samples).execute();
              refresh(1u << 11);
              break;
            case 30:                                     // Done: apply, close Settings, full refresh
              id(nav).execute(0);
              break;

            // ── settings: heating cost + limits ──
            case 31:                                     // £ per hour
              id(heat_cost_h) = std::min(5.0f, std::max(0.0f, roundf((id(heat_cost_h) + (arg ? 0.05f : -0.05f)) * 100) / 100));
              id(heat_cost_ms) = millis();
              id(set_heat_cost).execute(id(heat_cost_h));       // → input_number.heating_cost_per_hour
              refresh(1u << 12);                         // just this row
              id(heat_limits_changed).execute();
              break;
            case 32:                                     // limit by time / budget
              id(lim_budget) = arg == 1;
              refresh((1u << 13) | (1u << 14) | (1u << 15) | (1u << 18));
              id(heat_limits_changed).execute();
              id(heat_lim_ms) = millis();
              id(push_limits).execute();                 // → HA helpers
              break;
            case 33: {                                   // daily limit (0 = off)
              if (id(lim_budget)) id(lim_day_gbp) = std::min(50.0f, std::max(0.0f, id(lim_day_gbp) + (arg ? 0.25f : -0.25f)));
              else                id(lim_day_h)   = std::min(24.0f, std::max(0.0f, id(lim_day_h) + (arg ? 0.5f : -0.5f)));
              refresh(1u << 14);
              id(heat_limits_changed).execute();
              id(heat_lim_ms) = millis();
              id(push_limits).execute();                 // → HA helpers
              break;
            }
            case 34: {                                   // weekly limit (0 = off)
              if (id(lim_budget)) id(lim_week_gbp) = std::min(200.0f, std::max(0.0f, id(lim_week_gbp) + (arg ? 1.0f : -1.0f)));
              else                id(lim_week_h)   = std::min(168.0f, std::max(0.0f, id(lim_week_h) + (arg ? 1.0f : -1.0f)));
              refresh(1u << 15);
              id(heat_limits_changed).execute();
              id(heat_lim_ms) = millis();
              id(push_limits).execute();                 // → HA helpers
              break;
            }

            // ── settings: features on / off (0 energy, 1 water, 2 heating, 3 agenda, 4 plants, 5 solar) ──
            // picked here, applied on Done (one full refresh then)
            case 35: {
              if (arg < 0 || arg > 5) break;
              if (id(feat_pend) < 0)
                id(feat_pend) = (id(show_energy) ? 1 : 0) | (id(show_water) ? 2 : 0) | (id(show_heating) ? 4 : 0) |
                                (id(show_agenda) ? 8 : 0) | (id(show_plants) ? 16 : 0) | (id(show_solar) ? 32 : 0);
              id(feat_pend) ^= 1 << arg;
              refresh(1u << 16);                         // just the features row
              break;
            }

            // ── room picker ──
            case 50: {                                   // a room was picked
              const int p = id(pick_plant);
              if (p < 0 || arg < 0 || arg >= (int) id(pick_ids).size()) break;
              ESP_LOGI("plants", "Plant %d → %s", p + 1, id(pick_names)[arg].c_str());
              id(plant_room)[p] = id(pick_names)[arg];     // shown straight away; HA confirms
              id(plant_floor)[p] = id(pick_floors)[arg];
              id(set_plant_room).execute(p + 1, id(pick_ids)[arg]);
              id(page) = id(pick_ret);
              id(force_full) = true;
              id(epaper_display).update();
              break;
            }
            case 51:                                     // cancel
              id(page) = id(pick_ret);
              id(force_full) = true;
              id(epaper_display).update();
              break;
            case 52:                                     // previous / next page of rooms
            case 53: {
              const int n = std::max(1, ((int) id(pick_ids).size() + 17) / 18);
              id(pick_pg) = (id(pick_pg) + (act == 52 ? -1 : 1) + n) % n;
              id(force_full) = true;
              id(epaper_display).update();
              break;
            }

            // ── network ──
            case 60:                                     // Add Wi-Fi
              id(start_wifi_setup).execute();
              break;
            case 62:                                     // Back → Settings
              id(page) = 4;
              id(force_full) = true;
              id(epaper_display).update();
              break;
            case 63:                                     // cancel Wi-Fi setup: restart with the saved network
              ESP_LOGI("wifi", "Wi-Fi setup cancelled – restarting");
              App.safe_reboot();
              break;
            case 64:                                     // Settings → Wi-Fi
              id(page) = 7;
              id(force_full) = true;
              id(epaper_display).update();
              break;

            // ── agenda: next page of tasks / calendar ──
            case 41:
              id(ag_tk_pg) = (id(ag_tk_pg) + 1) % std::max(1, id(ag_tk_pages));
              id(force_full) = true;
              id(epaper_display).update();
              break;
            case 42:
              id(ag_ev_pg) = (id(ag_ev_pg) + 1) % std::max(1, id(ag_ev_pages));
              id(force_full) = true;
              id(epaper_display).update();
              break;

            // ── agenda: tick a task off ──
            case 40: {
              const auto &ti = id(task_ids);
              if (arg < 0 || arg >= (int) ti.size()) break;
              const std::string &rec = ti[arg];
              const size_t bar = rec.find('|');
              if (bar == std::string::npos) break;
              const std::string uid = rec.substr(0, bar), ent = rec.substr(bar + 1);
              auto &done = id(done_uids);
              if (std::find(done.begin(), done.end(), uid) != done.end()) break;
              ESP_LOGI("agenda", "Task %s done (%s)", uid.c_str(), ent.c_str());
              done.push_back(uid);
              id(done_ms) = millis();
              id(complete_task).execute(ent, uid);
              refresh(1u << (8 + arg));                  // just that task row
              break;
            }
          }

display:
  - platform: it8951
    id: epaper_display
    spi_id: epaper_spi_bus
    model: seeed-reterminal-e1003
    update_interval: never          # driven by the 30 s interval (60 s full redraws)
    # Every refresh is a clean GC16 one, and the whole screen is redrawn every
    # minute anyway – so the driver's own "make every Nth refresh full screen"
    # is pushed out as far as it goes (it made a random tap slow now and then).
    full_update_every: 255
    grayscale: true
    dithering: false                # the panel has 16 greys of its own; faster drawing, crisper text
    update_mode: GC16
    # Don't wipe the frame buffer before each draw: partial refreshes rely on
    # the rest of the previous frame still being there. Full redraws clear it
    # themselves with it.fill().
    auto_clear_enabled: false
    transform:
      mirror_x: true
      mirror_y: false
    lambda: |-
      if (!id(draw_ok)) return;           // timer wake: keep the last picture until the data is in
      // ───────── palette ─────────
      const Color INK   = Color::BLACK;
      const Color PAPER = Color::WHITE;
      const Color DARK  = Color(85, 85, 85);
      const Color MID   = Color(140, 140, 140);
      const Color LIGHT = Color(190, 190, 190);
      // Partial refresh: after a touch only the changed cards are drawn. The
      // IT8951 driver refreshes just the area that was drawn into, so the rest
      // of the panel stays as it is. Scheduled updates (dirty_mask == 0) redraw
      // everything; every full_update_every-th update is a full clean refresh.
      // ── touch feedback frame: only the bold border of the touched card ──
      // (sent as a quick black/white refresh of that card; the real update follows)
      const uint32_t FB = 1u << 26;
      if (id(dirty_mask) == FB && !id(force_full)) {
        id(dirty_mask) = 0;
        id(fb_pending) = false;
        const auto &r = id(fb_rect);
        // rows of a rounded rectangle: [x0, x1) at row yy, false if outside
        auto span = [](int rx, int ry, int rw, int rh, int rad, int yy, int &x0, int &x1) -> bool {
          if (yy < ry || yy >= ry + rh || rw <= 0) return false;
          int dx = 0;
          const int cy = yy < ry + rad ? ry + rad : (yy >= ry + rh - rad ? ry + rh - rad - 1 : -1);
          if (cy >= 0) {
            const float dy = fabsf((float) (yy - cy)) + 0.5f;
            dx = rad - (int) sqrtf(std::max(0.0f, (float) (rad * rad) - dy * dy));
          }
          x0 = rx + dx; x1 = rx + rw - dx;
          return x1 > x0;
        };
        // bold ink ring over the card's own edge, then a thin paper line inside it
        // (so it shows on dark cards too)
        auto ring = [&](int inset, int width, Color c) {
          const int ox = r[0] + inset, oy = r[1] + inset, ow = r[2] - 2 * inset, oh = r[3] - 2 * inset;
          const int orad = std::max(0, r[4] - inset), irad = std::max(0, orad - width);
          for (int yy = oy; yy < oy + oh; yy++) {
            int a0, a1, b0, b1;
            if (!span(ox, oy, ow, oh, orad, yy, a0, a1)) continue;
            if (span(ox + width, oy + width, ow - 2 * width, oh - 2 * width, irad, yy, b0, b1)) {
              it.horizontal_line(a0, yy, b0 - a0, c);
              it.horizontal_line(b1, yy, a1 - b1, c);
            } else {
              it.horizontal_line(a0, yy, a1 - a0, c);
            }
          }
        };
        ring(0, 9, INK);
        ring(9, 3, PAPER);
        return;
      }
      id(fb_pending) = false;
      const uint32_t mask = id(dirty_mask) & ~FB;
      id(dirty_mask) = 0;
      const bool all = mask == 0 || id(force_full);
      if (id(page) == 2 || id(page) >= 4) id(zones).clear();   // tap targets, re-registered below
      id(force_full) = false;
      const bool do_week = all || (mask & (1u << 6));
      if (all) it.fill(PAPER);

      // ───────── helpers ─────────
      auto rbox = [&](int x, int y, int w, int h, int r, Color c) {
        it.filled_rectangle(x + r, y, w - 2 * r, h, c);
        it.filled_rectangle(x, y + r, w, h - 2 * r, c);
        it.filled_circle(x + r, y + r, r, c);
        it.filled_circle(x + w - r - 1, y + r, r, c);
        it.filled_circle(x + r, y + h - r - 1, r, c);
        it.filled_circle(x + w - r - 1, y + h - r - 1, r, c);
      };
      // Rounded card; border = outline width, dark = solid black card
      auto card = [&](int x, int y, int w, int h, int border, bool dark) {
        rbox(x, y, w, h, 28, INK);
        if (!dark) rbox(x + border, y + border, w - 2 * border, h - 2 * border, 28 - border, PAPER);
      };
      auto nz = [](float v) { return std::isnan(v) ? 0.0f : v; };
      auto today_of = [&](float v, float base) {
        if (std::isnan(v) || std::isnan(base)) return 0.0f;
        return std::max(0.0f, v - base);
      };

      auto now = id(ha_time).now();

      // day + date from the panel's own clock (HA's date sensors only as a fallback)
      char day_s[16], date_s[24];
      {
        static const char *DN[7] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
        static const char *MN[12] = {"January", "February", "March", "April", "May", "June", "July",
                                     "August", "September", "October", "November", "December"};
        if (now.is_valid()) {
          snprintf(day_s, sizeof(day_s), "%s", DN[(now.day_of_week + 6) % 7]);
          snprintf(date_s, sizeof(date_s), "%d %s %d", now.day_of_month, MN[(now.month + 11) % 12], now.year);
        } else {
          snprintf(day_s, sizeof(day_s), "%s", id(ha_day).state.c_str());
          snprintf(date_s, sizeof(date_s), "%s", id(ha_date).state.c_str());
        }
      }
      const int today = now.is_valid() ? (now.day_of_week + 5) % 7 : -1;   // 0 = Monday

      // refresh + sleep (Settings → Display → Refresh): when this frame was drawn, when
      // the next one comes, and whether the panel sleeps after it (no live clock then)
      static const int REFRESH_MIN[6] = {1, 10, 15, 30, 60, 120};
      const int r_idx = std::min(5, std::max(0, id(refresh_idx)));
      // night sleep (Settings → Night sleep): between night_from and night_to
      auto in_night = [&](const ESPTime &tn) -> bool {
        if (!id(night_on) || !tn.is_valid()) return false;
        const int m = tn.hour * 60 + tn.minute, a = id(night_from), b = id(night_to);
        if (a == b) return false;
        return a < b ? (m >= a && m < b) : (m >= a || m < b);
      };
      const bool night_now = in_night(now);
      const bool sleepy = (r_idx > 0 || night_now) && (id(wake_mode) == 1 || id(going_sleep));
      const bool night_frame = sleepy && night_now;          // the last frame before night sleep
      char upd_s[12] = "--:--", next_s[12] = "--:--", sdate_s[20] = "";
      {
        auto hm_of = [&](int mins, char *o, size_t n) {
          mins = ((mins % 1440) + 1440) % 1440;
          const int h = mins / 60, m = mins % 60;
          if (id(clock_12h)) snprintf(o, n, "%d:%02d%s", h % 12 == 0 ? 12 : h % 12, m, h < 12 ? "am" : "pm");
          else               snprintf(o, n, "%02d:%02d", h, m);
        };
        if (now.is_valid()) {
          const int secs = now.hour * 3600 + now.minute * 60 + now.second;
          const int iv = REFRESH_MIN[r_idx] * 60;
          int nxt = (secs / iv + 1) * iv;                      // on the 10 / 15 / 30 … min marks
          if (nxt - secs < 45) nxt += iv;
          id(next_wake) = nxt % 86400;                         // the sleep uses this
          hm_of(secs / 60, upd_s, sizeof(upd_s));
          hm_of(nxt / 60, next_s, sizeof(next_s));
          snprintf(sdate_s, sizeof(sdate_s), "%.3s %d %.3s", day_s, now.day_of_month, date_s + (now.day_of_month >= 10 ? 3 : 2));
          if (night_frame) hm_of(id(night_to), next_s, sizeof(next_s));   // back at …
        }
      }
      // power (0) or water (1) on the utility card, week chart and Energy page

      float price    = nz(id(energy_price).state);
      float standing = nz(id(energy_standing_charge).state);
      float import_today = !std::isnan(id(ha_imp_today).state) ? id(ha_imp_today).state : today_of(id(myGridImport).state, id(base_import));
      float export_today = !std::isnan(id(ha_exp_today).state) ? id(ha_exp_today).state : today_of(id(myGridExport).state, id(base_export));
      float solar_today  = !std::isnan(id(ha_sol_today).state) ? id(ha_sol_today).state : today_of(id(mySolarTotal).state, id(base_solar));
      float water_today  = nz(id(myWaterToday).state);
      float wprice       = nz(id(water_price).state) / 1000.0f;                 // £ per litre
      float wstanding    = (nz(id(water_standing_charge).state) +
                            nz(id(waste_water_standing_charge).state)) / 365.0f; // £ per day
      const float heat_h = id(heat_cost_h);                                     // £ per boiler hour

      // ── the last 7 days of a utility (0 power kWh, 1 water L, 2 heating h), oldest first,
      // today last – HA's statistics, else the 30-day history matched by date; today live ──
      auto parse_l = [](const std::string &src, float *out, int maxn) -> int {
        const char *q = src.c_str();
        if (*q == '[' || *q == '(') q++;
        int n = 0;
        while (*q && n < maxn) {
          char *e;
          const float v = strtof(q, &e);
          if (e == q) break;
          out[n++] = v;
          q = e;
          while (*q == ',' || *q == ' ') q++;
        }
        return n;
      };
      auto last7_of = [&](int u, float *vals) {
        for (int i = 0; i < 7; i++) vals[i] = 0;
        if (u == 2) {
          sensor::Sensor *hd[7] = {id(ht_6), id(ht_5), id(ht_4), id(ht_3), id(ht_2), id(ht_1), id(ht_0)};
          for (int i = 0; i < 7; i++) vals[i] = nz(hd[i]->state);
          return;
        }
        const bool wat = u == 1;
        parse_l(wat ? id(wh_last7).state : id(en_last7_imp).state, vals, 7);
        bool none = true;
        for (int i = 0; i < 6; i++) if (vals[i] > 0) none = false;
        if (none && now.is_valid()) {
          float hv[30] = {}, hl[30] = {};
          const int nv = parse_l(wat ? id(wh_d).state : id(en_d_imp).state, hv, 30);
          const int nl = parse_l(wat ? id(wh_dlbl).state : id(en_d_lbl).state, hl, 30);
          if (nl >= nv && nv > 0) {
            for (int i = 0; i < 6; i++) {
              const int dom = ESPTime::from_epoch_local(now.timestamp - (6 - i) * 86400).day_of_month;
              for (int j = nv - 1; j >= std::max(0, nv - 8); j--)
                if ((int) hl[j] == dom) { vals[i] = hv[j]; break; }
            }
          } else if (nv >= 7) {
            for (int i = 0; i < 6; i++) vals[i] = hv[nv - 7 + i];
          }
        }
        vals[6] = wat ? water_today : import_today;
      };
      // £ for a day's use (incl. the daily standing charge)
      auto day_cost = [&](int u, float v) -> float {
        return u == 0 ? v * price + standing : u == 1 ? v * wprice + wstanding : v * heat_h;
      };
      // Bills from Home Assistant (sensor.panel_bills): 7 × £, today last. false = not there
      auto ha_bill = [&](int u, float *o) -> bool {
        const std::string &bs = u == 0 ? id(bill_p).state : u == 1 ? id(bill_w).state : id(bill_h).state;
        float t[7] = {};
        if (parse_l(bs, t, 7) < 7) return false;
        for (int i = 0; i < 7; i++) o[i] = t[i];
        return true;
      };

      const uint32_t BAR = 1u << 24;
      const bool d_bar = all || (mask & BAR);
      auto text_w = [&](esphome::font::Font *f, const char *t) -> int {
        int bx, by, bw, bh;
        it.get_text_bounds(0, 0, t, f, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
        return bw;
      };
      // largest of two fonts that fits
      auto fit = [&](const char *t, int maxw, esphome::font::Font *a, esphome::font::Font *b) -> esphome::font::Font * {
        return text_w(a, t) <= maxw ? a : b;
      };
      // why there's no data (nullptr = connected): shown where a card has nothing yet
      const bool wifi_ok = wifi::global_wifi_component->is_connected();
      auto offline_msg = [&]() -> const char * {
        if (!wifi_ok) return "Not connected to Wi-Fi";
        if (!id(ha_ok)) return "Not connected to Home Assistant";
        return nullptr;
      };

      // ───────── settings: units and clock ─────────
      const bool use_f = id(temp_f);
      auto TC = [&](float c) -> float { return use_f ? c * 9.0f / 5.0f + 32.0f : c; };   // temperature
      auto TD = [&](float d) -> float { return use_f ? d * 9.0f / 5.0f : d; };            // temperature difference
      const char *TU = use_f ? "°F" : "°C";
      auto PRESS = [&](float hpa, char *out, size_t n) {
        if (std::isnan(hpa)) { snprintf(out, n, "--"); return; }
        if (id(press_unit) == 1)      snprintf(out, n, "%.0f mmHg", hpa * 0.750062f);
        else if (id(press_unit) == 2) snprintf(out, n, "%.2f inHg", hpa * 0.0295300f);
        else                          snprintf(out, n, "%.0f hPa", hpa);
      };
      // "14:05" or "2:05" + "PM"
      auto clock_str = [&](char *hm, size_t n, char *ampm, size_t m) {
        ampm[0] = 0;
        if (!now.is_valid()) { snprintf(hm, n, "--:--"); return; }
        if (id(clock_12h)) {
          int h = now.hour % 12;
          snprintf(hm, n, "%d:%02d", h == 0 ? 12 : h, now.minute);
          snprintf(ampm, m, "%s", now.hour < 12 ? "AM" : "PM");
        } else {
          snprintf(hm, n, "%02d:%02d", now.hour, now.minute);
        }
      };
      auto zone = [&](int x, int y, int w, int h, int action, int arg) {
        id(zones).push_back({x, y, w, h, action, arg});
      };

      // shorten a string with "..." until it fits (keeps UTF-8 characters whole)
      auto ellipsize = [&](esphome::font::Font *f, const std::string &src, int maxw) -> std::string {
        if (text_w(f, src.c_str()) <= maxw) return src;
        std::string s = src;
        while (!s.empty()) {
          do { s.pop_back(); } while (!s.empty() && (s.back() & 0xC0) == 0x80);
          while (!s.empty() && s.back() == ' ') s.pop_back();
          if (text_w(f, (s + "...").c_str()) <= maxw) return s + "...";
        }
        return std::string("...");
      };
      // split "a|b|c" into at most n fields; returns the count
      auto split = [](const std::string &rec, std::string *f, int n) -> int {
        int k = 0;
        size_t q = 0;
        while (k < n) {
          size_t e = rec.find('|', q);
          if (e == std::string::npos) { f[k++] = rec.substr(q); break; }
          f[k++] = rec.substr(q, e - q);
          q = e + 1;
        }
        return k;
      };

      // weather condition → icon + label
      auto wx = [](const std::string &cond, const char **label) -> const char * {
        const char *l = "Unknown", *i = "\U000F05D6";
        if      (cond == "sunny")           { i = "\U000F0599"; l = "Sunny"; }
        else if (cond == "clear-night")     { i = "\U000F0594"; l = "Clear night"; }
        else if (cond == "cloudy")          { i = "\U000F0590"; l = "Cloudy"; }
        else if (cond == "partlycloudy")    { i = "\U000F0595"; l = "Partly cloudy"; }
        else if (cond == "fog")             { i = "\U000F0591"; l = "Foggy"; }
        else if (cond == "windy")           { i = "\U000F059D"; l = "Windy"; }
        else if (cond == "windy-variant")   { i = "\U000F059E"; l = "Breezy"; }
        else if (cond == "hail")            { i = "\U000F0592"; l = "Hail"; }
        else if (cond == "lightning")       { i = "\U000F0593"; l = "Lightning"; }
        else if (cond == "lightning-rainy") { i = "\U000F067E"; l = "Thunderstorm"; }
        else if (cond == "pouring")         { i = "\U000F0596"; l = "Heavy rain"; }
        else if (cond == "rainy")           { i = "\U000F0597"; l = "Rainy"; }
        else if (cond == "snowy")           { i = "\U000F0598"; l = "Snowy"; }
        else if (cond == "snowy-rainy")     { i = "\U000F067F"; l = "Sleet"; }
        else if (cond == "exceptional")     { i = "\U000F05D6"; l = "Warning"; }
        if (label) *label = l;
        return i;
      };

      // ───────── agenda: sensor.panel_agenda (calendar events + open tasks) ─────────
      struct Ev { std::string date, s, e, title, cal; };
      struct Tk { std::string uid, title, due, ent, list; };
      std::vector<Ev> evs;
      std::vector<Tk> tks;
      if (id(page) == 0 || id(page) == 5) {
        auto each = [](const std::string &src, const std::function<void(const std::string &)> &fn) {
          size_t pos = 0;
          while (pos < src.size()) {
            size_t end = src.find(';', pos);
            if (end == std::string::npos) end = src.size();
            if (end > pos) fn(src.substr(pos, end - pos));
            pos = end + 1;
          }
        };
        each(id(ag_events).state, [&](const std::string &rec) {
          std::string f[5];
          if (split(rec, f, 5) >= 4 && f[0].size() == 10) evs.push_back(Ev{f[0], f[1], f[2], f[3], f[4]});
        });
        each(id(ag_tasks).state, [&](const std::string &rec) {
          std::string f[5];                          // uid|title|due|todo entity|list name
          if (split(rec, f, 5) >= 2 && !f[0].empty()) tks.push_back(Tk{f[0], f[1], f[2], f[3], f[4]});
        });
      }
      // days since 1970-01-01 (for "Today" / "Tomorrow" / weekday names)
      auto civil = [](int y, int m, int d) -> int {
        y -= m <= 2;
        const int era = (y >= 0 ? y : y - 399) / 400;
        const int yoe = y - era * 400;
        const int doy = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1;
        const int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
        return era * 146097 + doe - 719468;
      };
      const int today_n = now.is_valid() ? civil(now.year, now.month, now.day_of_month) : 0;
      // "YYYY-MM-DD" → days from today (99 if unknown)
      auto day_diff = [&](const std::string &date) -> int {
        if (date.size() < 10 || !now.is_valid()) return 99;
        return civil(atoi(date.substr(0, 4).c_str()), atoi(date.substr(5, 2).c_str()), atoi(date.substr(8, 2).c_str())) - today_n;
      };
      // "Today", "Tomorrow" or "Tue 3 Nov"
      auto day_name = [&](const std::string &date, char *out, size_t n) {
        static const char *wd[7] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
        static const char *mo[12] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
        const int diff = day_diff(date);
        if (diff == 0) { snprintf(out, n, "Today"); return; }
        if (diff == 1) { snprintf(out, n, "Tomorrow"); return; }
        if (date.size() < 10) { snprintf(out, n, "%s", date.c_str()); return; }
        const int m = atoi(date.substr(5, 2).c_str()), d = atoi(date.substr(8, 2).c_str());
        const int dn = civil(atoi(date.substr(0, 4).c_str()), m, d);
        snprintf(out, n, "%s %d %s", wd[((dn + 4) % 7 + 7) % 7], d, (m >= 1 && m <= 12) ? mo[m - 1] : "?");
      };
      // "14:30" → "14:30" or "2:30 PM" (clock setting)
      auto hhmm = [&](const std::string &t, char *out, size_t n) {
        if (t.size() < 5) { snprintf(out, n, "%s", t.c_str()); return; }
        const int h = atoi(t.substr(0, 2).c_str()), m = atoi(t.substr(3, 2).c_str());
        if (id(clock_12h)) snprintf(out, n, "%d:%02d %s", h % 12 == 0 ? 12 : h % 12, m, h < 12 ? "AM" : "PM");
        else               snprintf(out, n, "%02d:%02d", h, m);
      };
      // events still to come (finished ones from earlier today are skipped)
      auto upcoming = [&](const Ev &e) -> bool {
        if (day_diff(e.date) != 0 || e.e.size() < 5 || !now.is_valid()) return true;
        return atoi(e.e.substr(0, 2).c_str()) * 60 + atoi(e.e.substr(3, 2).c_str()) > now.hour * 60 + now.minute;
      };
      auto is_done = [&](const std::string &uid) -> bool {
        const auto &d = id(done_uids);
        return std::find(d.begin(), d.end(), uid) != d.end();
      };
      auto due_text = [&](const std::string &due, char *out, size_t n) {
        out[0] = 0;
        if (due.size() < 10) return;
        const int diff = day_diff(due);
        if (diff < 0)       snprintf(out, n, "Overdue");
        else if (diff == 0) snprintf(out, n, "Due today");
        else if (diff == 1) snprintf(out, n, "Due tomorrow");
        else { char dn[24]; day_name(due, dn, sizeof(dn)); snprintf(out, n, "Due %s", dn); }
      };

      // ───────── shared: page dots + page title for Energy / Heating / Plants / Settings ─────────
      auto page_dots = [&](int cx, int cy) {
        int order[5], n = 0;                         // Energy · Home(+Plants) · Heating · Lights · Agenda,
        if (id(show_energy) || id(show_water)) order[n++] = 1;   // pages switched off left out
        order[n++] = 0;
        if (id(show_heating)) order[n++] = 2;
        {
          const std::string &lr = id(lt_rows).state;
          if (!lr.empty() && lr != "unknown" && lr != "unavailable") order[n++] = 9;
        }
        if (id(show_agenda)) order[n++] = 5;
        const int cur = id(page) == 3 ? 0 : id(page);
        for (int k = 0; k < n; k++) {
          int x = cx - (n - 1) * 20 + k * 40;
          if (order[k] == cur) {
            it.filled_circle(x, cy, 11, INK);
          } else {
            it.filled_circle(x, cy, 11, MID);
            it.filled_circle(x, cy, 8, PAPER);
          }
        }
      };
      auto top_bar = [&](const char *title, const char *sub) {
        it.print(48, 60, id(f_value), INK, title);           // title, then a clear gap
        it.print(52, 158, id(f_small), DARK, sub);           // to the line under it
        page_dots(936, 118);
        char hm[12], ap[4];
        clock_str(hm, sizeof(hm), ap, sizeof(ap));
        int rx = 1824;
        if (ap[0]) {
          it.print(rx, 74, id(f_label), DARK, TextAlign::TOP_RIGHT, ap);
          rx -= text_w(id(f_label), ap) + 10;
        }
        it.print(rx, 60, id(f_value), INK, TextAlign::TOP_RIGHT, hm);
        it.printf(1824, 158, id(f_small), DARK, TextAlign::TOP_RIGHT, "%s %s", day_s, date_s);
      };

      // ───────── plants (shared by the top bar, Home and the Plants page) ─────────
      const char *pname[15];
      for (int q_ = 0; q_ < 15; q_++) pname[q_] = id(plant_nm)[q_].c_str();
      const char *ptype[15];
      for (int q_ = 0; q_ < 15; q_++) ptype[q_] = id(plant_ty)[q_].c_str();
      number::Number *lv[15] = {id(p1_level), id(p2_level), id(p3_level), id(p4_level), id(p5_level), id(p6_level), id(p7_level), id(p8_level), id(p9_level), id(p10_level), id(p11_level), id(p12_level), id(p13_level), id(p14_level), id(p15_level)};
      sensor::Sensor *gl[15] = {id(p1_glass), id(p2_glass), id(p3_glass), id(p4_glass), id(p5_glass), id(p6_glass), id(p7_glass), id(p8_glass), id(p9_glass), id(p10_glass), id(p11_glass), id(p12_glass), id(p13_glass), id(p14_glass), id(p15_glass)};
      sensor::Sensor *dy[15] = {id(p1_days), id(p2_days), id(p3_days), id(p4_days), id(p5_days), id(p6_days), id(p7_days), id(p8_days), id(p9_days), id(p10_days), id(p11_days), id(p12_days), id(p13_days), id(p14_days), id(p15_days)};

      float ht = id(house_temp).state;
      if (std::isnan(ht)) ht = id(room_temp).state;   // fall back to the on-board sensor
      float htc = std::isnan(ht) ? 20.0f : std::min(35.0f, std::max(5.0f, ht));
      float pm = std::isnan(id(plant_mult).state) ? 1.0f : id(plant_mult).state;
      float pfactor = powf(2.0f, (htc - 20.0f) / 10.0f) * pm;   // house fallback

      float p_level[15], p_cap[15], p_frac[15], p_left[15], p_glass[15], p_days[15], p_temp[15], p_fac[15];
      float fac_lo = 1e9f, fac_hi = 0;
      int n_active = 0, n_thirsty = 0, first_thirsty = -1;
      for (int i = 0; i < 15; i++) {
        p_glass[i] = std::isnan(gl[i]->state) ? 250.0f : gl[i]->state;
        p_days[i]  = std::isnan(dy[i]->state) || dy[i]->state <= 0 ? 7.0f : dy[i]->state;
        p_level[i] = std::isnan(lv[i]->state) ? 0.0f : lv[i]->state;
        p_cap[i]   = p_glass[i] * id(max_glasses);
        p_frac[i]  = p_cap[i] > 0 ? std::min(1.0f, p_level[i] / p_cap[i]) : 0.0f;
        // the plant's room temperature (floor / house average if its room has no sensor)
        p_temp[i]  = std::isnan(id(plant_t)[i]) ? ht : id(plant_t)[i];
        const float tc_ = std::isnan(p_temp[i]) ? 20.0f : std::min(35.0f, std::max(5.0f, p_temp[i]));
        p_fac[i]   = powf(2.0f, (tc_ - 20.0f) / 10.0f) * pm;
        float per_day = p_glass[i] / p_days[i] * p_fac[i];
        p_left[i]  = per_day > 0 ? p_level[i] / per_day : 0.0f;   // days of water left
        if (pname[i][0] == 0) { p_left[i] = 1e9f; continue; }
        n_active++;
        fac_lo = std::min(fac_lo, p_fac[i]);
        fac_hi = std::max(fac_hi, p_fac[i]);
        if (p_left[i] < id(dry_days)) { n_thirsty++; if (first_thirsty < 0) first_thirsty = i; }
      }
      // thirstiest first (fewest days left). Frozen for 30 s after a tap so cards
      // don't move under your finger; the next full refresh re-sorts.
      auto &ord = id(plant_order);
      if (all && (!id(order_ready) || millis() - id(last_plant_tap) > 30000)) {
        for (int i = 0; i < 15; i++) ord[i] = i;
        for (int i = 1; i < 15; i++) {
          int v = ord[i], j = i - 1;
          while (j >= 0 && p_left[ord[j]] > p_left[v]) { ord[j + 1] = ord[j]; j--; }
          ord[j + 1] = v;
        }
        id(order_ready) = true;
      }

      auto plant_icon = [](const char *t) -> const char * {
        std::string s(t);
        if (s == "cactus")    return "\U000F0DB5";
        if (s == "succulent") return "\U000F0CD1";
        if (s == "flowering") return "\U000F024A";
        if (s == "orchid")    return "\U000F0D08";
        if (s == "tulip")     return "\U000F09F1";
        if (s == "grass")     return "\U000F1510";
        if (s == "palm")      return "\U000F1055";
        if (s == "herb")      return "\U000F0E66";
        if (s == "tree")      return "\U000F0531";
        if (s == "chili")     return "\U000F07B4";
        return "\U000F032A";   // foliage
      };

      // plant card with a water level that rises from the bottom
      auto plant_tile = [&](int i, int rank, int x, int y, int w, int h, bool big) {
        const bool thirsty = p_left[i] < id(dry_days);
        it.filled_rectangle(x - 2, y - 2, w + 4, h + 4, PAPER);
        rbox(x, y, w, h, 22, thirsty ? INK : DARK);
        rbox(x + 3, y + 3, w - 6, h - 6, 19, PAPER);
        int fh = (int) ((h - 6) * p_frac[i]);
        if (fh > 0) {
          it.start_clipping(esphome::display::Rect(x + 3, y + h - 3 - fh, w - 6, fh));
          rbox(x + 3, y + 3, w - 6, h - 6, 19, Color(205, 205, 205));
          it.end_clipping();
        }
        const int cx = x + w / 2;
        if (!big) {
          it.printf(x + w - 16, y + 16, id(f_bar), DARK, TextAlign::TOP_RIGHT, "%.0f%%", p_frac[i] * 100);
          const bool has_room = !id(plant_room)[i].empty();
          it.print(cx, has_room ? y + 74 : y + 80, id(f_plant), INK, TextAlign::CENTER, plant_icon(ptype[i]));
          it.print(cx, has_room ? y + 144 : y + 152, fit(pname[i], w - 20, id(f_label), id(f_bar)), INK, TextAlign::CENTER, pname[i]);
          if (has_room)                                                     // where it is
            it.print(cx, y + 174, id(f_bar), DARK, TextAlign::CENTER, ellipsize(id(f_bar), id(plant_room)[i], w - 24).c_str());
          const int sy = has_room ? y + 208 : y + 200;
          if (thirsty) {
            rbox(cx - 82, sy - 18, 164, 36, 18, INK);
            it.print(cx, sy, id(f_bar), PAPER, TextAlign::CENTER, "WATER ME");
          } else {
            it.printf(cx, sy, id(f_bar), DARK, TextAlign::CENTER, "%.1f days left", p_left[i]);
          }
        } else {
          it.printf(x + w - 24, y + 24, id(f_bar), DARK, TextAlign::TOP_RIGHT, "#%d", rank + 1);
          it.print(x + 80, y + 84, id(f_plant), INK, TextAlign::CENTER, plant_icon(ptype[i]));
          it.print(x + 140, y + 66, fit(pname[i], w - 190, id(f_cond), id(f_label)), INK,
                   TextAlign::CENTER_LEFT, pname[i]);
          {
            // where it is: "Kitchen · Ground floor" (shortened to fit), type if no room
            const std::string &rm = id(plant_room)[i], &fl = id(plant_floor)[i];
            const int maxw = w - 140 - 24;
            std::string line = rm.empty() ? std::string(ptype[i]) : rm;
            if (!rm.empty() && !fl.empty() && text_w(id(f_tiny), (rm + " · " + fl).c_str()) <= maxw) line = rm + " · " + fl;
            it.print(x + 140, y + 112, id(f_tiny), DARK, TextAlign::CENTER_LEFT, ellipsize(id(f_tiny), line, maxw).c_str());
            // the temperature it drinks at, and where that comes from
            if (!std::isnan(p_temp[i])) {
              const std::string &src = id(plant_src)[i];
              it.printf(x + w - 32, y + 178, id(f_cond), INK, TextAlign::CENTER_RIGHT, "%.1f°", TC(p_temp[i]));
              it.print(x + w - 32, y + 214, id(f_bar), DARK, TextAlign::CENTER_RIGHT,
                       src == "room" ? "room" : src == "floor" ? "floor average" : src == "house" ? "house average" : "indoor");
            }
          }
          it.printf(x + 32, y + 146, id(f_value), INK, "%.0f%%", p_frac[i] * 100);
          it.printf(x + 32, y + 236, id(f_small), DARK, "%.0f / %.0f ml", p_level[i], p_cap[i]);
          if (thirsty) {
            rbox(x + 28, y + 294, 210, 46, 23, INK);
            it.print(x + 133, y + 317, id(f_label), PAPER, TextAlign::CENTER, "WATER ME");
          } else {
            it.printf(x + 32, y + 317, id(f_cond), INK, TextAlign::CENTER_LEFT, "%.1f days left", p_left[i]);
          }
          it.printf(x + 32, y + 372, id(f_tiny), DARK, TextAlign::CENTER_LEFT, "Glass %.0f ml · lasts %.1f d",
                    p_glass[i], p_days[i]);
        }
      };

      // ═════════════════════════ HOME PAGE ═════════════════════════
      // header 80–240: clock + date (left half), weather (right half, no border)
      // all features on:
      //   left column 48–1128: bills 264–564 · solar + grid strip 588–684 ·
      //                        24 hours 708–1060 (tap: next utility; its title
      //                        button opens that utility's page)
      //   right column 1152–1824: agenda 264–1060 · plants 1084–1356
      //   footnote 1381: when the screen was updated (and when it wakes next)
      // Features switched off in Settings leave their space to the others.
      if (id(page) == 0) {
        // ── layout ──
        const bool fE = id(show_energy), fW = id(show_water), fH = id(show_heating);
        const bool fA = id(show_agenda), fP = id(show_plants), fS = fE && id(show_solar);
        const int nb = (fE ? 1 : 0) + (fW ? 1 : 0) + (fH ? 1 : 0);   // utilities on
        const int top = 264, bottom = fP ? 1060 : 1356;          // plants strip below when on
        const bool left = nb > 0;                                // left column: utilities
        const int lx = 48, lw = left ? (fA ? 1080 : 1776) : 0;   // full width without the agenda
        const int ax = left ? 1152 : 48, aw = fA ? (left ? 672 : 1776) : 0;
        int ly = top;
        const int by = ly, bh = 300;                             // bills today (the big one)
        ly += bh + 24;
        const int sy = ly, sh = 96;                              // solar + grid strip (energy)
        if (fE) ly += sh + 24;
        const int rcy = ly, rch = bottom - ly;                   // 24 hours
        // utility on the 24 h card (tap it for the next one)
        const bool u_on[3] = {fE, fW, fH};
        int hu = id(home_util);
        if (hu < 0 || hu > 2 || !u_on[hu]) hu = fE ? 0 : fW ? 1 : 2;
        static const char *U_NAME[3] = {"POWER", "WATER", "HEATING"};
        static const char *U_ICON[3] = {"\U000F0241", "\U000F058C", "\U000F0238"};
        // the 24 h card's title is a button: → that utility's history page
        const int pb_x = lx + 24, pb_y = rcy + 14, pb_h = 56;
        const int pb_w = 64 + text_w(id(f_label), U_NAME[hu]) + 12 + 36 + 16;
        id(home_lay) = {pb_x, pb_y, left ? pb_w : 0, pb_h, ax, top, aw, bottom - top,
                        lx, rcy, left ? lw : 0, rch};           // for the touch handler

        if (all) {
          // ───────── TOP ROW: top_layout "wide" or "split" (substitutions) ─────────
          const bool split_top = strcmp("${top_layout}", "split") == 0;
          // clock + date (+ weather now when "wide"): one dark card
          card(48, 80, split_top ? 864 : 1080, 160, 4, true);
          {
            char hm[12], ap[4];
            clock_str(hm, sizeof(hm), ap, sizeof(ap));
            it.print(84, 162, id(f_clock), PAPER, TextAlign::CENTER_LEFT, hm);
            int dx = 84 + text_w(id(f_clock), hm);
            if (ap[0]) {
              it.print(dx + 10, 200, id(f_label), PAPER, TextAlign::BOTTOM_LEFT, ap);
              dx += 10 + text_w(id(f_label), ap);
            }
            it.filled_rectangle(dx + 26, 112, 3, 96, DARK);
            const char *dy_s = day_s, *dt_s = date_s;
            char dt2[48];
            if (sleepy) {                                  // asleep: the time is when this was drawn
              snprintf(dt2, sizeof(dt2), night_frame ? "%s · back at %s" : "%s · next %s", sdate_s, next_s);
              dy_s = night_frame ? "Night sleep" : "Updated";
              dt_s = dt2;
            }
            const int dw = (split_top ? 880 : 784) - dx - 54;   // room left for the day / date
            it.print(dx + 54, 132, fit(dy_s, dw, id(f_cond), id(f_small)), PAPER, TextAlign::CENTER_LEFT, dy_s);
            it.print(dx + 54, 188, fit(dt_s, dw, id(f_small), fit(dt_s, dw, id(f_tiny), id(f_bar))), LIGHT,
                     TextAlign::CENTER_LEFT, dt_s);
          }

          // weather now: icon · temperature · condition · pressure –
          // "wide": inside the clock card · "split": left of the bordered weather card
          if (split_top) card(936, 80, 888, 160, 4, false);
          {
            const int wx0 = split_top ? 944 : 804;
            const Color fg = split_top ? INK : PAPER, fg2 = split_top ? DARK : LIGHT;
            const char *label;
            const char *icon = wx(id(myWeather).state, &label);
            if (!split_top) it.filled_rectangle(wx0, 112, 3, 96, DARK);
            it.print(wx0 + 62, 160, id(f_wx_icon), fg, TextAlign::CENTER, icon);
            char tb[16], pb[24];
            if (std::isnan(id(myTemperature).state)) snprintf(tb, sizeof(tb), "--");
            else snprintf(tb, sizeof(tb), "%.0f°", TC(id(myTemperature).state));
            it.print(wx0 + 120, 140, id(f_temp), fg, TextAlign::CENTER_LEFT, tb);
            PRESS(id(myPressure).state, pb, sizeof(pb));
            {
              const int lx0 = wx0 + 124, lw0 = (split_top ? 1250 : 1104) - lx0;   // a long condition drops a size first
              esphome::font::Font *lf = fit(label, lw0, id(f_bar), id(f_tiny));
              it.print(lx0, 190, lf, fg2, TextAlign::CENTER_LEFT, ellipsize(lf, label, lw0).c_str());
              it.print(lx0, 216, id(f_bar), fg2, TextAlign::CENTER_LEFT, pb);
            }
          }

          // ───────── WEATHER: next 24 h in 3 h steps ─────────
          // "wide": right third, above the Agenda card · "split": inside the weather card
          {
            const std::string &src = id(wx_slots).state;
            const int sx0 = split_top ? 1262 : 1152, sw = split_top ? 68 : 84;
            const int yo = split_top ? -1 : 0;                // a little higher, inside the card
            const int ys = split_top ? 224 : 228;            // solar strip
            size_t pos = 0;
            int n = 0;
            while (n < 8 && pos < src.size()) {
              size_t end = src.find(';', pos);
              if (end == std::string::npos) end = src.size();
              std::string f[6];                    // HH|condition|temp|rain %|light %|daylight %
              const int k = split(src.substr(pos, end - pos), f, 6);
              pos = end + 1;
              if (k < 3) continue;
              const int x = sx0 + n * sw, cx = x + sw / 2;
              // solar strip: how much sun reaches the panels in these 3 h – dark at night,
              // shaded when it's cloudy, clear when it's sunny
              if (id(show_solar) && k >= 6) {
                const int light = atoi(f[4].c_str()), day = atoi(f[5].c_str());
                const int score = light * day / 100;                 // 0…100
                const int v = day <= 0 ? 60 : std::min(255, 150 + score * 105 / 100);
                it.filled_rectangle(x + 1, ys + 1, sw - 2, 8, Color(v, v, v));   // under the slot
              }
              for (int yy = 100 + yo; yy < ys - 6; yy += 6) it.draw_pixel_at(x, yy, LIGHT), it.draw_pixel_at(x, yy + 1, LIGHT);
              char hl[12];
              const int hh = atoi(f[0].c_str());
              if (id(clock_12h)) snprintf(hl, sizeof(hl), "%d%s", hh % 12 == 0 ? 12 : hh % 12, hh < 12 ? "am" : "pm");
              else               snprintf(hl, sizeof(hl), "%02d", hh);
              it.print(cx, 100 + yo, id(f_bar), DARK, TextAlign::CENTER, hl);
              it.print(cx, 142 + yo, id(f_wx_sm), INK, TextAlign::CENTER, wx(f[1], nullptr));
              it.printf(cx, 184 + yo, id(f_label), INK, TextAlign::CENTER, "%.0f°", TC(atof(f[2].c_str())));
              if (k >= 4 && atoi(f[3].c_str()) >= 30)
                it.printf(cx, 208 + yo, id(f_bar), MID, TextAlign::CENTER, "%s%%", f[3].c_str());
              n++;
            }
            if (n == 0) {
              const char *why = offline_msg();
              it.print(split_top ? 1536 : 1488, 160, id(f_bar), DARK, TextAlign::CENTER, why ? why : "3 h forecast not available yet");
            } else if (id(show_solar)) {
              it.rectangle(sx0, ys, n * sw, 10, INK);                // frame of the solar strip
              for (int q = 1; q < n; q++) it.filled_rectangle(sx0 + q * sw, ys, 1, 10, INK);
            }
          }

          if (!left && !fA)
            it.print(936, 660, id(f_small), DARK, TextAlign::CENTER,
                     "Energy, water and agenda are switched off · Settings → Features");

          // ───────── SOLAR + GRID: a slim strip – 1-minute averages + today's kWh ─────────
          if (fE) {
            const int x = lx, y = sy, w = lw, h = sh;
            card(x, y, w, h, 4, false);
            auto watts = [](float v, char *o, size_t n) {
              if (fabsf(v) >= 1000.0f) snprintf(o, n, "%.1f kW", fabsf(v) / 1000.0f);
              else                     snprintf(o, n, "%.0f W", fabsf(v));
            };
            // icon · label over the live value · today's kWh on the right
            auto half = [&](int hx, int hw, bool solid, const char *glyph, const char *lab, const char *val,
                            const char *today_s, const char *today_short) {
              it.filled_circle(hx + 54, y + h / 2, 26, INK);
              if (!solid) it.filled_circle(hx + 54, y + h / 2, 23, PAPER);
              it.print(hx + 54, y + h / 2, id(f_icon_sm), solid ? PAPER : INK, TextAlign::CENTER, glyph);
              it.print(hx + 98, y + 28, id(f_bar), DARK, TextAlign::CENTER_LEFT, lab);
              it.print(hx + 96, y + 64, id(f_cond), INK, TextAlign::CENTER_LEFT, val);
              const int tmax = hw - 28 - (98 + std::max(text_w(id(f_bar), lab), text_w(id(f_cond), val)) + 20);
              const char *ts = text_w(id(f_small), today_s) <= tmax ? today_s : today_short;
              it.print(hx + hw - 28, y + h / 2, fit(ts, tmax, id(f_small), id(f_bar)), DARK, TextAlign::CENTER_RIGHT, ts);
            };
            const float g = std::isnan(id(grid_avg)) ? nz(id(myGridConsumption).state) : id(grid_avg);
            const bool importing = g < 0;
            char gv[24], gt[48], gt2[40];
            watts(g, gv, sizeof(gv));
            snprintf(gt, sizeof(gt), "today ↓ %.1f  ↑ %.1f kWh", import_today, export_today);
            snprintf(gt2, sizeof(gt2), "↓ %.1f  ↑ %.1f kWh", import_today, export_today);
            int gx0 = x, gw0 = w;
            if (fS) {
              const float sv = std::max(0.0f, std::isnan(id(solar_avg)) ? nz(id(mySolarProduction).state) : id(solar_avg));
              char sv_s[24], st[32], st2[24];
              watts(sv, sv_s, sizeof(sv_s));
              snprintf(st, sizeof(st), "%.1f kWh today", solar_today);
              snprintf(st2, sizeof(st2), "%.1f kWh", solar_today);
              const int hw = w * 9 / 20;
              half(x, hw, false, "\U000F0A72", "SOLAR · 1 MIN", sv_s, st, st2);
              for (int yy = y + 18; yy < y + h - 18; yy += 6) it.filled_rectangle(x + hw, yy, 2, 3, MID);
              gx0 = x + hw; gw0 = w - hw;
            }
            half(gx0, gw0, importing, "\U000F0D3E", importing ? "IMPORTING · 1 MIN" : "EXPORTING · 1 MIN", gv, gt, gt2);
          }

          // ───────── AGENDA (tap → Agenda page) ─────────
          if (fA) {
            const int x = ax, y = top, w = aw, h = bottom - top, pad = 32;
            card(x, y, w, h, 4, false);
            it.print(x + pad + 17, y + 40, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F00ED");
            it.print(x + pad + 46, y + 40, id(f_label), INK, TextAlign::CENTER_LEFT, "AGENDA");
            it.print(x + w - pad - 22, y + 40, id(f_icon_sm), DARK, TextAlign::CENTER, "\U000F0142");
            int open = 0;
            for (const auto &t : tks) if (!is_done(t.uid)) open++;
            const int ntask = std::min(open, h > 1000 ? 8 : 5);
            const int tasks_h = open ? 56 + ntask * 46 : 0;
            const int ev_bottom = y + h - 20 - tasks_h;
            int yy = y + 86, shown = 0, total = 0;
            std::string last_day;
            bool clipped = false;
            for (const auto &e : evs) {
              if (!upcoming(e)) continue;
              total++;
              if (clipped) continue;
              const bool new_day = e.date != last_day;
              if (yy + (new_day ? 34 : 0) + 46 > ev_bottom) { clipped = true; continue; }
              if (new_day) {
                char dn[24];
                day_name(e.date, dn, sizeof(dn));
                for (char *c = dn; *c; c++) *c = toupper(*c);
                it.print(x + pad, yy + 2, id(f_bar), DARK, TextAlign::CENTER_LEFT, dn);
                yy += 34;
                last_day = e.date;
              }
              char tb[16];
              if (e.s.empty()) snprintf(tb, sizeof(tb), "All day");
              else hhmm(e.s, tb, sizeof(tb));
              it.print(x + pad, yy + 4, id(f_bar), e.s.empty() ? DARK : INK, TextAlign::CENTER_LEFT, tb);
              const int tx = x + pad + (id(clock_12h) ? 132 : 100);
              it.print(tx, yy + 4, id(f_small), INK, TextAlign::CENTER_LEFT,
                       ellipsize(id(f_small), e.title, x + w - pad - tx).c_str());
              yy += 46;
              shown++;
            }
            if (total == 0) {
              it.print(x + pad, yy + 4, id(f_small), DARK, TextAlign::CENTER_LEFT,
                       id(ag_events).state.empty() || id(ag_events).state == "unknown" ? (offline_msg() ? offline_msg() : "No calendar data yet") : "Nothing planned this week");
              yy += 46;
            } else if (shown < total) {
              it.printf(x + pad, yy + 2, id(f_bar), MID, TextAlign::CENTER_LEFT, "+%d more this week", total - shown);
            }
            if (open) {
              int ty0 = y + h - 20 - tasks_h;
              for (int xx = x + pad; xx < x + w - pad; xx += 6) it.draw_pixel_at(xx, ty0 + 6, LIGHT);
              it.print(x + pad, ty0 + 34, id(f_bar), DARK, TextAlign::CENTER_LEFT, "TASKS");
              it.printf(x + w - pad, ty0 + 34, id(f_bar), DARK, TextAlign::CENTER_RIGHT, "%d open", open);
              int k = 0;
              for (const auto &t : tks) {
                if (is_done(t.uid)) continue;
                if (k >= ntask) break;
                const int ry = ty0 + 56 + k * 46 + 20;
                it.print(x + pad + 16, ry, id(f_icon_sm), DARK, TextAlign::CENTER, "\U000F0130");
                const int dl = day_diff(t.due);
                const bool late = t.due.size() >= 10 && dl <= 0;
                int maxw = x + w - pad - (x + pad + 48);
                if (late) {
                  const char *tag = dl < 0 ? "overdue" : "today";
                  const int tw2 = text_w(id(f_bar), tag) + 24;
                  rbox(x + w - pad - tw2, ry - 16, tw2, 32, 16, INK);
                  it.print(x + w - pad - tw2 / 2, ry, id(f_bar), PAPER, TextAlign::CENTER, tag);
                  maxw -= tw2 + 12;
                }
                it.print(x + pad + 48, ry, id(f_small), INK, TextAlign::CENTER_LEFT,
                         ellipsize(id(f_small), t.title, maxw).c_str());
                k++;
              }
            }
          }
        }

        // ───────── shared bits ─────────
        const char *days = "MTWTFSS";
        auto hmin = [](float h, char *o, size_t n) {                // hours → "3h 20m"
          const int m = (int) roundf(h * 60.0f);
          if (m < 60) snprintf(o, n, "%d min", m);
          else        snprintf(o, n, "%dh %02dm", m / 60, m % 60);
        };
        // stacked bar segment for one utility: power black, water grey, heating light + outline
        auto seg = [&](int x, int y, int w, int h, int u) {
          if (h <= 0) return;
          if (u == 0)      it.filled_rectangle(x, y, w, h, INK);
          else if (u == 1) it.filled_rectangle(x, y, w, h, MID);
          else {
            it.filled_rectangle(x, y, w, h, INK);
            if (h > 4) it.filled_rectangle(x + 2, y + 2, w - 4, h - 4, LIGHT);
          }
        };
        auto money = [](float v, char *o, size_t n) {
          if (v >= 100)     snprintf(o, n, "£%.0f", v);
          else if (v >= 10) snprintf(o, n, "£%.1f", v);
          else              snprintf(o, n, "£%.2f", v);
        };

        // ───────── BILLS TODAY: the headline – today's total, per utility, 7 days stacked ─────────
        if (all && left) {
          const int x = lx, y = by, w = lw, h = bh;
          card(x, y, w, h, 4, false);
          float g[3][7] = {}, tot[7] = {}, wk = 0, mx = 0.01f;
          for (int u = 0; u < 3; u++) {
            if (!u_on[u]) continue;
            float v[7];
            last7_of(u, v);
            if (!ha_bill(u, g[u]))                       // Home Assistant's £, or the panel's own
              for (int i = 0; i < 7; i++) g[u][i] = day_cost(u, v[i]);
          }
          for (int i = 0; i < 7; i++) {
            tot[i] = g[0][i] + g[1][i] + g[2][i];
            mx = std::max(mx, tot[i]);
            wk += tot[i];
          }
          it.print(x + 32, y + 44, id(f_label), INK, TextAlign::CENTER_LEFT, "BILLS TODAY");
          char tb[24];
          snprintf(tb, sizeof(tb), "£%.2f", tot[6]);
          it.print(x + 26, y + 124, id(f_temp), INK, TextAlign::CENTER_LEFT, tb);
          {                                                      // today per utility
            static const char *LN[3] = {"Power", "Water", "Heating"};
            int ry = y + 204;
            for (int u = 0; u < 3; u++) {
              if (!u_on[u]) continue;
              seg(x + 32, ry - 11, 22, 22, u);
              it.print(x + 66, ry, id(f_small), DARK, TextAlign::CENTER_LEFT, LN[u]);
              char lb[16];
              snprintf(lb, sizeof(lb), "£%.2f", g[u][6]);
              it.print(x + 380, ry, id(f_small), INK, TextAlign::CENTER_RIGHT, lb);
              ry += 36;
            }
          }
          {
            char wb[40];
            snprintf(wb, sizeof(wb), "Last 7 days £%.2f", wk);
            it.print(x + w - 36, y + 44, id(f_small), DARK, TextAlign::CENTER_RIGHT, wb);
          }
          const int bx0 = x + 430, bx1 = x + w - 36;
          const float step = (bx1 - bx0) / 7.0f;
          const int bw = std::min(80, (int) (step * 0.62f));
          const int base = y + h - 52, bmax = base - (y + 108);
          for (int i = 0; i < 7; i++) {
            const int bx = bx0 + (int) roundf(i * step + (step - bw) / 2), cx = bx + bw / 2;
            int yy = base;
            for (int u = 0; u < 3; u++) {
              if (!u_on[u]) continue;
              const int sh = (int) roundf(g[u][i] / mx * bmax);
              if (sh < 2) continue;
              seg(bx, yy - sh, bw, sh - (sh > 6 ? 2 : 0), u);    // 2 px gap between utilities
              yy -= sh;
            }
            char lb[16];
            money(tot[i], lb, sizeof(lb));
            it.print(cx, yy - 8, id(f_bar), i == 6 ? INK : DARK, TextAlign::BOTTOM_CENTER, lb);
            const int wd = today >= 0 ? (today - 6 + i + 7) % 7 : i;
            char d[2] = {days[wd], 0};
            if (i == 6) {
              it.filled_circle(cx, base + 26, 16, INK);
              it.print(cx, base + 26, id(f_bar), PAPER, TextAlign::CENTER, d);
            } else {
              it.print(cx, base + 26, id(f_bar), DARK, TextAlign::CENTER, d);
            }
          }
          it.filled_rectangle(bx0 - 4, base, bx1 - bx0 + 8, 3, INK);
        }

        // ───────── 24 HOURS of the utility on show ─────────
        // tap the card → next utility · tap its title button → that utility's history page
        if (left && (all || do_week)) {
          const int cy0 = rcy, ch0 = rch;
          const bool narrow = lw < 900;
          if (!all) it.filled_rectangle(lx - 4, cy0 - 4, lw + 8, ch0 + 8, PAPER);
          card(lx, cy0, lw, ch0, 4, false);
          {
            const int my = pb_y + pb_h / 2;
            rbox(pb_x, pb_y, pb_w, pb_h, pb_h / 2, INK);
            it.print(pb_x + 36, my, id(f_icon_sm), PAPER, TextAlign::CENTER, U_ICON[hu]);
            it.print(pb_x + 64, my, id(f_label), PAPER, TextAlign::CENTER_LEFT, U_NAME[hu]);
            it.print(pb_x + pb_w - 32, my, id(f_icon_sm), PAPER, TextAlign::CENTER, "\U000F0142");
            const char *span = (hu == 0 && !fS) ? "20 HOURS" : "24 HOURS";
            int tx = pb_x + pb_w + 18;
            it.print(tx, my, id(f_label), DARK, TextAlign::CENTER_LEFT, span);
            tx += text_w(id(f_label), span) + 22;
            if (nb >= 2)                                          // which utility (tap for the next)
              for (int u = 0; u < 3; u++) {
                if (!u_on[u]) continue;
                it.filled_circle(tx + 8, my, 8, u == hu ? INK : LIGHT);
                tx += 24;
              }
          }
          const int gx = lx + 124, gy = cy0 + 96, gw = lw - 156, gh = ch0 - 152;
          auto parse_hist = [](const std::string &str, float *out, int n) {
            for (int i = 0; i < n; i++) out[i] = NAN;
            const char *q = str.c_str();
            if (*q == '[' || *q == '(') q++;                 // HA may send [1, 2, 3]
            for (int i = 0; i < n; i++) {
              if (*q != ',' && *q != 0) {
                char *e;
                float v = strtof(q, &e);
                if (e == q) break;          // not a number list (e.g. "unknown")
                out[i] = v;
                q = e;
              }
              if (*q != ',') break;
              q++;
            }
          };
          // a round number ≥ v for the axis top (the biggest value + 15 %)
          auto nice_top = [](float v) -> float {
            static const float st[] = {0.1f, 0.2f, 0.25f, 0.5f, 1, 2, 2.5f, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000};
            for (float s : st) if (v <= s * 4) return ceilf(v / s - 0.001f) * s;
            return ceilf(v / 1000.0f) * 1000.0f;
          };
          auto num = [](float v, char *o, size_t n) {
            if (fabsf(v - roundf(v)) < 0.05f) snprintf(o, n, "%.0f", v); else snprintf(o, n, "%.1f", v);
          };
          for (int k = 0; k <= 4; k++) {                           // dotted grid
            int yy = gy + k * (gh - 1) / 4;
            for (int xx = gx; xx < gx + gw; xx += 2) it.draw_pixel_at(xx, yy, LIGHT);
          }

          if (hu == 0) {
            // ── POWER: the last 20 h (120 ten-minute averages from HA) + the live value,
            // and with solar on, the solar forecast 4 h ahead (sensor.panel_solar_forecast)
            const int N = 120;                                     // past slots (10 min)
            const int xnow = fS ? gx + (int) roundf(gw * 20.0f / 24.0f) : gx + gw - 1;   // no solar: no forecast part
            {
              int gl = lx + lw - (fS ? (narrow ? 400 : 520) : 152);                   // legend, top right
              it.filled_rectangle(gl, cy0 + 39, 32, 6, INK);
              it.print(gl + 40, cy0 + 42, id(f_bar), INK, TextAlign::CENTER_LEFT, "Grid");
              if (fS) {
                gl += 120;
                it.filled_rectangle(gl, cy0 + 40, 32, 4, DARK);
                it.print(gl + 40, cy0 + 42, id(f_bar), INK, TextAlign::CENTER_LEFT, "Solar");
                gl += 124;
                for (int q = 0; q < 32; q += 12) it.filled_rectangle(gl + q, cy0 + 41, 7, 3, MID);
                it.print(gl + 40, cy0 + 42, id(f_bar), INK, TextAlign::CENTER_LEFT, narrow ? "Forecast" : "Solar forecast");
              }
            }
            float hg[N], hs[N], hf[N], fut[8];
            parse_hist(id(hist_grid).state, hg, N);
            parse_hist(id(hist_solar).state, hs, N);
            parse_hist(id(hist_forecast).state, hf, N);
            parse_hist(id(sf_future).state, fut, 8);
            // hour lines; the next 4 h lightly shaded
            const int hours = fS ? 24 : 20;
            for (int h = 0; h <= hours; h++) {
              int xx = gx + h * (gw - 1) / hours;
              for (int yy = gy; yy < gy + gh; yy += 2) it.draw_pixel_at(xx, yy, LIGHT);
            }
            if (fS)
              for (int yy = gy; yy < gy + gh; yy += 4)
                for (int xx = xnow + (yy / 4) % 2 * 3; xx < gx + gw; xx += 6) it.draw_pixel_at(xx, yy, LIGHT);
            // axis: the biggest value in the chart + 15 % (same above and below zero)
            float peak = fabsf(nz(id(myGridConsumption).state));
            for (int k = 0; k < N; k++) if (!std::isnan(hg[k])) peak = std::max(peak, fabsf(hg[k]));
            if (fS) {
              peak = std::max(peak, fabsf(nz(id(mySolarProduction).state)));
              for (int k = 0; k < N; k++) {
                if (!std::isnan(hs[k])) peak = std::max(peak, fabsf(hs[k]));
                if (!std::isnan(hf[k])) peak = std::max(peak, fabsf(hf[k]));
              }
              for (int k = 0; k < 8; k++) if (!std::isnan(fut[k])) peak = std::max(peak, fut[k]);
            }
            const float top_kw = nice_top(std::max(0.2f, peak * 1.15f / 1000.0f));
            const float top_w = top_kw * 1000.0f;
            auto ymap = [&](float w) {
              w = std::max(-top_w, std::min(top_w, w));
              return gy + (int) roundf((top_w - w) / (2 * top_w) * (gh - 1));
            };
            auto xpast = [&](int k) { return gx + (int) roundf((k + 0.5f) * (xnow - gx) / N); };
            // sign: grid history is + import, the chart shows export above the line
            auto trace = [&](const float *v, float live, float sign, int th, Color c, bool dashed) {
              int px = 0, py = 0, seg = 0;
              bool have = false;
              for (int k = 0; k <= N; k++) {
                float val = k < N ? v[k] : live;
                if (std::isnan(val)) { have = false; continue; }
                int x = k < N ? xpast(k) : xnow;
                int y = ymap(sign * val);
                if (have && (!dashed || (seg % 2) == 0)) {
                  for (int dx = 0; dx < th; dx++)
                    for (int dy = 0; dy < th; dy++)
                      it.line(px + dx - th / 2, py + dy - th / 2, x + dx - th / 2, y + dy - th / 2, c);
                }
                if (have) seg++;
                px = x; py = y; have = true;
              }
            };
            if (fS) {
              trace(hf, id(mySolarPrediction).state, 1.0f, 3, MID, true);
              trace(hs, std::max(0.0f, id(mySolarProduction).state), 1.0f, 4, DARK, false);
              // forecast ahead: from the live forecast at "now" out to +4 h, thicker dashes
              float lv = id(mySolarPrediction).state;
              int px = xnow, py = ymap(std::isnan(lv) ? 0 : lv);
              for (int k = 0; k < 8; k++) {
                if (std::isnan(fut[k])) break;
                const int x = xnow + (int) roundf((k + 1) * (gx + gw - 1 - xnow) / 8.0f);
                const int y = ymap(fut[k]);
                for (int t = 0; t < 4; t++) it.line(px, py + t - 1, x, y + t - 1, DARK);
                px = x; py = y;
              }
            }
            trace(hg, -id(myGridConsumption).state, -1.0f, 5, INK, false);
            it.filled_rectangle(gx, gy + gh / 2 - 1, gw, 3, INK);   // zero line
            if (fS) for (int yy = gy; yy < gy + gh; yy += 10) it.filled_rectangle(xnow - 1, yy, 3, 5, INK);   // now
            char a[16], b[16], l0[20], l1[20], l3[20], l4[20];
            num(top_kw, a, sizeof(a));
            num(top_kw / 2, b, sizeof(b));
            snprintf(l0, sizeof(l0), "+%s kW", a); snprintf(l1, sizeof(l1), "+%s", b);
            snprintf(l3, sizeof(l3), "-%s", b);    snprintf(l4, sizeof(l4), "-%s kW", a);
            const char *ylab[] = {l0, l1, "0", l3, l4};
            for (int i = 0; i < 5; i++)
              it.print(gx - 12, gy + i * (gh - 1) / 4, id(f_bar), DARK, TextAlign::CENTER_RIGHT, ylab[i]);
            it.print(xnow - 10, gy + 6,      id(f_bar), MID, TextAlign::TOP_RIGHT,    "export");
            it.print(xnow - 10, gy + gh - 6, id(f_bar), MID, TextAlign::BOTTOM_RIGHT, "import");
            (void) hours;
            it.print(gx,          gy + gh + 10, id(f_bar), DARK, TextAlign::TOP_LEFT,   "-20h");
            it.print(gx + (xnow - gx) / 2, gy + gh + 10, id(f_bar), DARK, TextAlign::TOP_CENTER, "-10h");
            if (fS) {
              it.print(xnow,      gy + gh + 10, id(f_bar), INK, TextAlign::TOP_CENTER, "now");
              it.print(gx + gw,   gy + gh + 10, id(f_bar), DARK, TextAlign::TOP_RIGHT,  "+4h");
            } else {
              it.print(gx + gw,   gy + gh + 10, id(f_bar), INK, TextAlign::TOP_RIGHT,  "now");
            }
            // nothing at all to draw yet: say why
            bool any = !std::isnan(id(myGridConsumption).state);
            for (int k = 0; k < N && !any; k++) if (!std::isnan(hg[k])) any = true;
            if (!any) {
              const char *why = offline_msg();
              it.print(gx + gw / 2, gy + gh / 2 - 40, id(f_cond), DARK, TextAlign::CENTER, why ? why : "No power data yet");
            }
          } else {
            // ── WATER (litres) or HEATING (boiler minutes) per hour, last 24 h:
            // HA statistics for the complete hours, this hour from today's total ──
            const bool heat = hu == 2;
            float hv[24];
            parse_hist(heat ? id(ht_hourly).state : id(wh_hourly).state, hv, 23);
            const int hr = now.is_valid() ? now.hour : 0;
            float since_midnight = 0;                              // complete hours today
            for (int k = 23 - hr; k < 23; k++) if (k >= 0 && !std::isnan(hv[k])) since_midnight += hv[k];
            const float today_v = heat ? nz(id(ht_0).state) * 60.0f : water_today;
            hv[23] = std::max(0.0f, today_v - since_midnight);
            if (heat) hv[23] = std::min(60.0f, hv[23]);
            float peak = 0, sum = 0;
            for (int k = 0; k < 24; k++) if (!std::isnan(hv[k])) { peak = std::max(peak, hv[k]); sum += hv[k]; }
            char rt[40];
            if (heat) {
              char hb[16];
              hmin(sum / 60.0f, hb, sizeof(hb));
              snprintf(rt, sizeof(rt), "%s · £%.2f", hb, sum / 60.0f * id(heat_cost_h));
            } else {
              snprintf(rt, sizeof(rt), "%.0f L · £%.2f", sum, sum * wprice);
            }
            it.print(lx + lw - 32, cy0 + 42, id(f_label), INK, TextAlign::CENTER_RIGHT, rt);
            float top = nice_top(std::max(1.0f, peak * 1.15f));
            if (heat) top = std::min(60.0f, std::max(10.0f, top));   // never more than 60 min an hour
            const float slot = gw / 24.0f;
            const int bw = std::max(4, (int) (slot * 0.62f));
            for (int k = 0; k < 24; k++) {
              if (std::isnan(hv[k]) || hv[k] <= 0) continue;
              const int bh = std::max(3, (int) roundf(std::min(hv[k], top) / top * (gh - 1)));
              const int bx = gx + (int) roundf(k * slot + (slot - bw) / 2);
              rbox(bx, gy + gh - bh, bw, bh, std::min(4, bh / 2), k == 23 ? INK : DARK);
            }
            it.filled_rectangle(gx, gy + gh - 1, gw, 3, INK);       // base line
            char a[16], l0[20], l1[20], l3[20], q1[20];
            num(top, a, sizeof(a));
            snprintf(l0, sizeof(l0), heat ? "%s min" : "%s L", a);
            num(top * 3 / 4, l3, sizeof(l3));
            num(top / 2, l1, sizeof(l1));
            num(top / 4, q1, sizeof(q1));
            const char *ylab[] = {l0, l3, l1, q1, "0"};
            for (int i = 0; i < 5; i++)
              it.print(gx - 12, gy + i * (gh - 1) / 4, id(f_bar), DARK, TextAlign::CENTER_RIGHT, ylab[i]);
            // hour labels every 6 h, "now" at the end
            for (int k = 0; k < 24; k += 6) {
              char hl[12];
              const int h = ((hr - 23 + k) % 24 + 24) % 24;
              if (id(clock_12h)) snprintf(hl, sizeof(hl), "%d%s", h % 12 == 0 ? 12 : h % 12, h < 12 ? "am" : "pm");
              else               snprintf(hl, sizeof(hl), "%02d:00", h);
              it.print(gx + (int) roundf(k * slot + slot / 2), gy + gh + 10, id(f_bar), DARK, TextAlign::TOP_CENTER, hl);
            }
            it.print(gx + gw, gy + gh + 10, id(f_bar), DARK, TextAlign::TOP_RIGHT, "now");
            if (sum <= 0 && peak <= 0) {
              const char *why = offline_msg();
              it.print(gx + gw / 2, gy + gh / 2, id(f_small), DARK, TextAlign::CENTER,
                       why ? why : heat ? "No heating in the last 24 h" : "No water used in the last 24 h");
            }
          }
        }

        // ───────── PLANTS: 6 thirstiest + All plants (unless hidden in Settings) ─────────
        if (all && id(show_plants)) card(48, 1084, 1776, 272, 4, false);
        for (int j = 0; j < 6 && id(show_plants); j++) {
          if (!all && !(mask & (1u << j))) continue;      // partial: only the tapped tile
          int i = ord[j];
          if (pname[i][0] == 0) continue;
          plant_tile(i, j, 64 + j * 250, 1100, 236, 240, false);
        }
        if (all && id(show_plants)) {
          const int x = 64 + 6 * 250, y = 1100, w = 236, h = 240, cx = x + w / 2;
          rbox(x, y, w, h, 22, INK);
          it.print(cx, y + 44, id(f_label), PAPER, TextAlign::CENTER, "ALL PLANTS");
          it.printf(cx, y + 110, id(f_value), PAPER, TextAlign::CENTER, "%d", n_active);
          if (n_thirsty) it.printf(cx, y + 170, id(f_bar), LIGHT, TextAlign::CENTER, "%d need water", n_thirsty);
          else           it.print(cx, y + 170, id(f_bar), LIGHT, TextAlign::CENTER, "all watered");
          rbox(cx - 70, y + 190, 140, 36, 18, PAPER);
          it.print(cx - 8, y + 208, id(f_bar), INK, TextAlign::CENTER, "View");
          it.print(cx + 34, y + 208, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0142");
        }

        // ───────── FOOTNOTE: when this was drawn (and, with sleep on, when it wakes) ─────────
        if (all && now.is_valid()) {
          static const char *R_LAB[6] = {"minute", "10 min", "15 min", "30 min", "hour", "2 hours"};
          char fn[160];
          if (night_frame)
            snprintf(fn, sizeof(fn), "Updated %s · Night sleep until %s · press the green button to use the touch screen",
                     upd_s, next_s);
          else if (sleepy)
            snprintf(fn, sizeof(fn), "Updated %s · next update %s · Asleep: press the green button to use the touch screen",
                     upd_s, next_s);
          else if (r_idx > 0)
            snprintf(fn, sizeof(fn), "Updated %s · refreshes every %s · sleeps 2 min after the last touch",
                     upd_s, R_LAB[r_idx]);
          else
            snprintf(fn, sizeof(fn), "Updated %s", upd_s);
          if (sleepy) {
            const int fw = text_w(id(f_bar), fn);
            it.filled_circle(1824 - fw - 22, 1381, 9, INK);        // a dot: "not live"
          }
          it.print(1824, 1381, id(f_bar), sleepy ? INK : MID, TextAlign::CENTER_RIGHT, fn);
          it.print(48, 1381, id(f_bar), MID, TextAlign::CENTER_LEFT, "${fw_version}");
        }
      }

      // ═════════════════════════ PLANTS PAGE ═════════════════════════
      if (id(page) == 3) {
        const int pages = std::max(1, (n_active + 7) / 8);
        if (id(plant_page) >= pages) id(plant_page) = pages - 1;
        const int pp = id(plant_page);

        if (all) {
          top_bar("Plants", "Thirstiest first · tap a plant to add a glass");

          // how the drinking rate is worked out
          card(48, 212, 1776, 160, 4, false);
          auto block = [&](int x, const char *label, const char *value, const char *note) {
            it.print(x, 246, id(f_label), DARK, TextAlign::CENTER_LEFT, label);
            it.print(x, 296, id(f_cond), INK, TextAlign::CENTER_LEFT, value);
            it.print(x, 342, id(f_tiny), DARK, TextAlign::CENTER_LEFT, note);
          };
          char v2[24], v3[24], v4[24];
          snprintf(v2, sizeof(v2), "×%.2f", pm);
          if (n_active && fac_hi > 0 && fabsf(fac_hi - fac_lo) >= 0.005f) snprintf(v3, sizeof(v3), "×%.2f–%.2f", fac_lo, fac_hi);
          else snprintf(v3, sizeof(v3), "×%.2f", n_active && fac_hi > 0 ? fac_hi : pfactor);
          snprintf(v4, sizeof(v4), "%d · %d dry", n_active, n_thirsty);
          block(84,   "ROOM TEMPERATURE", "per plant", "its room · else floor / house avg");
          block(530,  "MULTIPLIER", v2, "Plant Water Multiplier in HA");
          block(976,  "DRINK RATE", v3, use_f ? "×2 for every +18°F above 68°F" : "×2 for every +10°C above 20°C");
          char dn[32];
          snprintf(dn, sizeof(dn), "dry = under %.1f day%s left", id(dry_days), id(dry_days) == 1.0f ? "" : "s");
          block(1422, "PLANTS", v4, dn);
        }

        for (int slot = 0; slot < 8; slot++) {
          int k = pp * 8 + slot;
          if (k >= 15) break;
          int i = ord[k];
          if (pname[i][0] == 0) continue;
          if (!all && !(mask & (1u << slot))) continue;   // partial: only the tapped card
          int c = slot % 4, r = slot / 4;
          plant_tile(i, k, 48 + c * 450, 396 + r * 432, 426, 408, true);
        }

        if (all) {
          card(48, 1260, 320, 96, 4, false);
          it.print(106, 1308, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F004D");
          it.print(140, 1308, id(f_cond), INK, TextAlign::CENTER_LEFT, "Home");
          it.printf(826, 1308, id(f_cond), INK, TextAlign::CENTER, "Page %d of %d", pp + 1, pages);
          const bool can_prev = pp > 0, can_next = pp < pages - 1;
          card(1284, 1260, 260, 96, 4, false);
          it.print(1336, 1308, id(f_icon_sm), can_prev ? INK : LIGHT, TextAlign::CENTER, "\U000F0141");
          it.print(1366, 1308, id(f_cond), can_prev ? INK : LIGHT, TextAlign::CENTER_LEFT, "Prev");
          card(1564, 1260, 260, 96, 4, false);
          it.print(1720, 1308, id(f_cond), can_next ? INK : LIGHT, TextAlign::CENTER_RIGHT, "Next");
          it.print(1764, 1308, id(f_icon_sm), can_next ? INK : LIGHT, TextAlign::CENTER, "\U000F0142");
        }
      }

      // ═════════════════════════ ENERGY PAGE: power · water · heating ═════════════════════════
      // tabs 200–284 (tap to switch) · figures 308–508 · last 7 days + last 30 days 532–904 ·
      // last 12 months + totals 928–1376. Home's 24 h title button opens the same utility here.
      if (id(page) == 1) {
        auto dim = [](int m, int y) -> int {
          static const int d[12] = {31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};
          if (m == 2 && ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0)) return 29;
          return (m >= 1 && m <= 12) ? d[m - 1] : 30;
        };
        auto nice_max = [](float v) -> float {                  // 4 round grid steps above v
          static const float steps[] = {0.1f, 0.2f, 0.25f, 0.5f, 1, 2, 2.5f, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 2500, 5000};
          for (float st : steps) if (v <= st * 4) return st * 4;
          return ceilf(v / 4000.0f) * 4000.0f;
        };
        static const char *mn[12] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun",
                                     "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
        static const char *days7 = "MTWTFSS";
        const bool u_on[3] = {id(show_energy), id(show_water), id(show_heating)};
        int u = id(home_util);
        if (u < 0 || u > 2 || !u_on[u]) u = u_on[0] ? 0 : u_on[1] ? 1 : 2;
        const bool fS = u == 0 && id(show_solar);

        // ── data: days (30) and months (12), main series + solar / export for power ──
        float dv[30] = {}, ds[30] = {}, de[30] = {}, dl[30] = {};
        float mv[12] = {}, ms[12] = {}, me[12] = {}, ml[12] = {};
        int nd = 0, nm = 0, ndl = 0, nml = 0;
        if (u == 0) {
          nd = parse_l(id(en_d_imp).state, dv, 30);
          parse_l(id(en_d_sol).state, ds, 30);
          parse_l(id(en_d_exp).state, de, 30);
          ndl = parse_l(id(en_d_lbl).state, dl, 30);
          nm = parse_l(id(en_m_imp).state, mv, 12);
          parse_l(id(en_m_sol).state, ms, 12);
          parse_l(id(en_m_exp).state, me, 12);
          nml = parse_l(id(en_m_lbl).state, ml, 12);
          if (!fS) { for (auto &v : ds) v = 0; for (auto &v : ms) v = 0; }
        } else if (u == 1) {
          nd = parse_l(id(wh_d).state, dv, 30);
          ndl = parse_l(id(wh_dlbl).state, dl, 30);
          nm = parse_l(id(wh_m).state, mv, 12);
          nml = parse_l(id(wh_mlbl).state, ml, 12);
        } else {
          nd = parse_l(id(ht_d).state, dv, 30);
          ndl = parse_l(id(ht_dlbl).state, dl, 30);
          nm = parse_l(id(ht_m).state, mv, 12);
          nml = parse_l(id(ht_mlbl).state, ml, 12);
        }
        // labels missing or broken (e.g. an empty "lbl" from Home Assistant): the history
        // ends today / this month, so count back from there
        if (now.is_valid()) {
          bool bad = ndl < nd;
          for (int i = 0; i < nd && !bad; i++) bad = dl[i] < 1 || dl[i] > 31;
          if (bad)
            for (int i = 0; i < nd; i++) dl[i] = ESPTime::from_epoch_local(now.timestamp - (nd - 1 - i) * 86400).day_of_month;
          bad = nml < nm;
          for (int i = 0; i < nm && !bad; i++) bad = ml[i] < 1 || ml[i] > 12;
          if (bad)
            for (int i = 0; i < nm; i++) ml[i] = ((now.month - 1 - (nm - 1 - i)) % 12 + 12) % 12 + 1;
        }
        // heating today from the live sensor (statistics lag up to an hour)
        if (u == 2 && nd > 0 && now.is_valid() && (int) dl[nd - 1] == now.day_of_month) dv[nd - 1] = nz(id(ht_0).state);
        int yr[12] = {};                                       // year of each month
        {
          int y = now.is_valid() ? now.year : 2026;
          for (int i = nm - 1; i >= 0; i--) {
            if (i < nm - 1 && ml[i] > ml[i + 1]) y--;
            yr[i] = y;
          }
        }
        auto days_of = [&](int i) -> int {
          const int m = (int) ml[i];
          const bool cur = now.is_valid() && i == nm - 1 && m == now.month;
          return cur ? now.day_of_month : dim(m, yr[i]);
        };
        // £: days include the daily standing charge, months standing × days
        auto mon_cost = [&](int i) -> float {
          return u == 0 ? mv[i] * price + days_of(i) * standing
               : u == 1 ? mv[i] * wprice + days_of(i) * wstanding : mv[i] * heat_h;
        };
        // amounts: kWh · litres (m³ for months) · boiler hours
        static const char *UNIT[3] = {"kWh", "L", "h"};
        auto amt = [&](float v, char *o, size_t n) {
          if (u == 0)      snprintf(o, n, v >= 100 ? "%.0f kWh" : "%.1f kWh", v);
          else if (u == 1) snprintf(o, n, v >= 1000 ? "%.1f m³" : "%.0f L", v >= 1000 ? v / 1000.0f : v);
          else {
            const int m = (int) roundf(v * 60.0f);
            if (m < 60) snprintf(o, n, "%d min", m); else snprintf(o, n, "%dh %02dm", m / 60, m % 60);
          }
        };
        auto num = [&](float v, char *o, size_t n) {         // short number for bar labels
          if (u == 1) snprintf(o, n, "%.0f", v);
          else        snprintf(o, n, v >= 100 ? "%.0f" : "%.1f", v);
        };
        float w7[7];
        last7_of(u, w7);
        const float today_v = w7[6];

        static const char *TITLE[3] = {"Power", "Water", "Heating"};
        if (all) top_bar(TITLE[u], "Last 7 days · 30 days · 12 months");

        // ── tabs: one per utility that's on ──
        if (all) {
          static const char *TAB[3] = {"Power", "Water", "Heating"};
          static const char *TIC[3] = {"\U000F0241", "\U000F058C", "\U000F0238"};
          const int tw = 300, tstep = 316, ty = 214, th = 76;
          id(en_tabs) = {48, ty, tw, tstep};
          int k = 0;
          for (int q = 0; q < 3; q++) {
            if (!u_on[q]) continue;
            const int x = 48 + k * tstep;
            const bool sel = q == u;
            rbox(x, ty, tw, th, th / 2, INK);
            if (!sel) rbox(x + 4, ty + 4, tw - 8, th - 8, (th - 8) / 2, PAPER);
            const int cw = 44 + text_w(id(f_cond), TAB[q]);
            it.print(x + (tw - cw) / 2 + 18, ty + th / 2, id(f_icon_sm), sel ? PAPER : INK, TextAlign::CENTER, TIC[q]);
            it.print(x + (tw - cw) / 2 + 44, ty + th / 2, id(f_cond), sel ? PAPER : INK, TextAlign::CENTER_LEFT, TAB[q]);
            k++;
          }
          char tb[64], ab[24];
          amt(today_v, ab, sizeof(ab));
          snprintf(tb, sizeof(tb), "Today %s · £%.2f", ab, day_cost(u, today_v));
          it.print(1824, ty + th / 2, id(f_cond), INK, TextAlign::CENTER_RIGHT, tb);
        }

        if (nd == 0 && nm == 0) {
          if (!all) return;
          const char *why = offline_msg();
          static const char *SRC[3] = {"packages/panel_energy.yaml", "packages/panel_water.yaml", "packages/panel_heating.yaml"};
          char sb[96];
          snprintf(sb, sizeof(sb), "It comes from %s in Home Assistant", SRC[u]);
          card(336, 620, 1200, 360, 4, false);
          it.print(936, 740, id(f_value), INK, TextAlign::CENTER, why ? why : "No history yet");
          it.print(936, 840, id(f_small), DARK, TextAlign::CENTER, why ? "The last figures show again once it's back" : sb);
        } else {
          // ── figures ──
          // tap 7 DAYS / 30 DAYS / THIS MONTH: use vs standing charge (tap again: back)
          // tap a chart: £ (default) ↔ kWh / litres / time. Only the tapped card redraws.
          const uint32_t ev = id(en_view);
          const float rate = u == 0 ? price : u == 1 ? wprice : heat_h;      // £ per unit
          const float st_d = u == 0 ? standing : u == 1 ? wstanding : 0.0f;  // standing £ a day
          float s30 = 0, c30 = 0, sol30 = 0, exp30 = 0, peak = 0, w7s = 0, w7c = 0;
          for (int i = 0; i < nd; i++) { s30 += dv[i]; c30 += day_cost(u, dv[i]); sol30 += ds[i]; exp30 += de[i]; }
          for (int i = 0; i < 7; i++) { w7s += w7[i]; w7c += day_cost(u, w7[i]); }
          for (int i = 0; i < nd; i++) peak = std::max(peak, dv[i]);
          const float avg = nd ? s30 / nd : 0;
          int ydays_all = 0;
          for (int i = 0; i < nm; i++) ydays_all += days_of(i);
          char vb[32], sb[64], ab[24];
          auto kpi_box = [&](int k) {
            const int x = 48 + k * 360, y = 312;
            if (!all) it.filled_rectangle(x - 6, y - 6, 348, 202, PAPER);
            card(x, y, 336, 190, 4, false);
            return x;
          };
          auto kpi_head = [&](int x, const char *glyph, const char *label) {
            const int y = 312;
            it.filled_circle(x + 50, y + 44, 26, INK);
            it.print(x + 50, y + 44, id(f_icon_sm), PAPER, TextAlign::CENTER, glyph);
            it.print(x + 90, y + 44, id(f_label), INK, TextAlign::CENTER_LEFT, label);
          };
          auto kpi = [&](int k, const char *glyph, const char *label, const char *value, const char *sub) {
            const int x = kpi_box(k), y = 312, w = 336;
            kpi_head(x, glyph, label);
            it.print(x + 26, y + 108, fit(value, w - 52, id(f_value), id(f_cond)), INK, TextAlign::CENTER_LEFT, value);
            std::string sl(sub);                               // too long: drop the last " · " part
            while (text_w(id(f_bar), sl.c_str()) > w - 56 && sl.rfind(" · ") != std::string::npos)
              sl = sl.substr(0, sl.rfind(" · "));
            it.print(x + 28, y + 160, fit(sl.c_str(), w - 56, id(f_tiny), id(f_bar)), DARK, TextAlign::CENTER_LEFT, sl.c_str());
          };
          // the split view: what you used vs the standing charge for those days
          auto kpi_split = [&](int k, const char *label, float units, int ndays) {
            const int x = kpi_box(k), y = 312;
            kpi_head(x, "\U000F00ED", label);
            char a[24], b[24];
            snprintf(a, sizeof(a), "£%.2f", units * rate);
            if (u == 2) snprintf(b, sizeof(b), "none");
            else        snprintf(b, sizeof(b), "£%.2f", ndays * st_d);
            const char *l1 = u == 0 ? "Energy" : u == 1 ? "Water" : "Boiler";
            const int room = 308 - 28 - text_w(id(f_tiny), "Standing") - 12;
            esphome::font::Font *vf = (text_w(id(f_cond), a) <= room && text_w(id(f_cond), b) <= room) ? id(f_cond) : id(f_small);
            it.print(x + 28, y + 104, id(f_tiny), DARK, TextAlign::CENTER_LEFT, l1);
            it.print(x + 308, y + 104, vf, INK, TextAlign::CENTER_RIGHT, a);
            it.print(x + 28, y + 154, id(f_tiny), DARK, TextAlign::CENTER_LEFT, "Standing");
            it.print(x + 308, y + 154, vf, INK, TextAlign::CENTER_RIGHT, b);
          };
          // ── battery suggestion from a year of exported solar ──
          // Each month: average export a day (what a battery could store) and average
          // import a day (what it could save). Stored a day = min(90 % of the battery,
          // export, import). Sizes 2.5 … 20 kWh; pick the one after which 2.5 kWh more
          // adds less than 8 % a year.
          auto battery_card = [&]() {
            const int x = kpi_box(3), y = 312;
            kpi_head(x, "\U000F0A72", "BATTERY SIZE");
            static const float SZ[] = {2.5f, 5, 7.5f, 10, 12.5f, 15, 17.5f, 20};
            auto saved = [&](float b) {
              float t = 0;
              for (int i = 0; i < nm; i++) {
                const int dd = std::max(1, days_of(i));
                t += dd * std::min(0.9f * b, std::min(me[i] / dd, mv[i] / dd));
              }
              return t;
            };
            float best_b = 0, best_s = 0;
            if (nm >= 3) {
              for (float b : SZ) {
                const float sv = saved(b);
                if (best_b > 0 && sv - best_s < 0.08f * best_s) break;
                best_b = b; best_s = sv;
              }
            }
            const float yd = ydays_all > 0 ? (float) ydays_all : 365.0f;
            if (best_b <= 0 || best_s < 20) {
              it.print(x + 26, y + 108, id(f_cond), INK, TextAlign::CENTER_LEFT, nm < 3 ? "Need 3 months" : "Not worth it");
              it.print(x + 28, y + 160, id(f_bar), DARK, TextAlign::CENTER_LEFT, nm < 3 ? "of solar history" : "too little solar exported");
              return;
            }
            char a[24], b[64];
            snprintf(a, sizeof(a), best_b == roundf(best_b) ? "%.0f kWh" : "%.1f kWh", best_b);
            it.print(x + 26, y + 108, id(f_value), INK, TextAlign::CENTER_LEFT, a);
            snprintf(b, sizeof(b), "~%.0f kWh · £%.0f a year", best_s * 365.0f / yd, best_s * 365.0f / yd * price);
            it.print(x + 28, y + 160, fit(b, 280, id(f_tiny), id(f_bar)), DARK, TextAlign::CENTER_LEFT, b);
          };
          static const char *UIC[3] = {"\U000F0241", "\U000F058C", "\U000F0238"};
          if (all) {
            snprintf(vb, sizeof(vb), "£%.2f", day_cost(u, today_v));
            amt(today_v, ab, sizeof(ab));
            snprintf(sb, sizeof(sb), "%s so far", ab);
            kpi(0, UIC[u], "TODAY", vb, sb);
            if (fS && !(ev & 64u)) {
              const float use = s30 + sol30 - exp30;
              snprintf(vb, sizeof(vb), "%.0f%%", use > 0 ? std::max(0.0f, std::min(100.0f, (sol30 - exp30) / use * 100.0f)) : 0.0f);
              snprintf(sb, sizeof(sb), "of use from solar · tap: battery");
              kpi(3, "\U000F0A72", "SOLAR SHARE", vb, sb);
            } else if (fS) {
              battery_card();
            } else {
              snprintf(vb, sizeof(vb), "£%.2f", nd ? c30 / nd : 0.0f);
              char pk[24];
              amt(avg, ab, sizeof(ab));
              amt(peak, pk, sizeof(pk));
              snprintf(sb, sizeof(sb), "%s a day · max %s", ab, pk);
              kpi(3, "\U000F00ED", "DAILY AVG", vb, sb);
            }
          }
          if (!all && (mask & 64u) && fS) {                    // SOLAR SHARE ↔ battery
            if (ev & 64u) battery_card();
            else {
              const float use = s30 + sol30 - exp30;
              snprintf(vb, sizeof(vb), "%.0f%%", use > 0 ? std::max(0.0f, std::min(100.0f, (sol30 - exp30) / use * 100.0f)) : 0.0f);
              kpi(3, "\U000F0A72", "SOLAR SHARE", vb, "of use from solar · tap: battery");
            }
          }
          if (all || (mask & 1u)) {                            // 7 DAYS
            if (ev & 1u) kpi_split(1, "7 DAYS", w7s, 7);
            else {
              snprintf(vb, sizeof(vb), "£%.2f", w7c);
              amt(w7s, ab, sizeof(ab));
              snprintf(sb, sizeof(sb), "%s in 7 days", ab);
              kpi(1, "\U000F00ED", "7 DAYS", vb, sb);
            }
          }
          if (all || (mask & 2u)) {                            // 30 DAYS
            if (ev & 2u) kpi_split(2, "30 DAYS", s30, nd);
            else {
              snprintf(vb, sizeof(vb), "£%.2f", c30);
              amt(s30, ab, sizeof(ab));
              snprintf(sb, sizeof(sb), "%s in %d days", ab, nd);
              kpi(2, "\U000F00ED", "30 DAYS", vb, sb);
            }
          }
          if (all || (mask & 4u)) {                            // THIS MONTH
            if ((ev & 4u) && nm >= 1) kpi_split(4, "THIS MONTH", mv[nm - 1], days_of(nm - 1));
            else {
              if (nm >= 1) {
                const float cur = mv[nm - 1] / std::max(1, days_of(nm - 1));
                const float prev = nm >= 2 ? mv[nm - 2] / std::max(1, days_of(nm - 2)) : 0;
                snprintf(vb, sizeof(vb), "£%.2f", mon_cost(nm - 1));
                amt(cur, ab, sizeof(ab));
                if (prev > 0) snprintf(sb, sizeof(sb), "%s a day · %s%.0f%% vs last", ab, cur >= prev ? "↑" : "↓", fabsf(cur - prev) / prev * 100.0f);
                else          snprintf(sb, sizeof(sb), "%s a day", ab);
              } else {
                snprintf(vb, sizeof(vb), "--");
                snprintf(sb, sizeof(sb), "a day this month");
              }
              kpi(4, "\U000F00ED", "THIS MONTH", vb, sb);
            }
          }

          // chart title: name, what the bars show, and what a tap switches to
          const char *UNAME = u == 0 ? "kWh" : u == 1 ? "litres" : "time";
          auto chart_title = [&](int x, int y, const char *name, bool units, bool below = false, const char *uname = nullptr) {
            it.print(x, y, id(f_label), INK, TextAlign::CENTER_LEFT, name);
            char hb[48];
            if (!uname) uname = UNAME;
            if (units) snprintf(hb, sizeof(hb), "%s · tap for £", uname);
            else       snprintf(hb, sizeof(hb), "£ · tap for %s", uname);
            if (below) it.print(x, y + 36, id(f_bar), DARK, TextAlign::CENTER_LEFT, hb);
            else       it.print(x + text_w(id(f_label), name) + 16, y, id(f_bar), DARK, TextAlign::CENTER_LEFT, hb);
          };
          // a bar's label: £ or the amount (time for heating)
          auto bar_lab = [&](float v, bool units, char *o, size_t n) {
            if (!units) { snprintf(o, n, v >= 100 ? "£%.0f" : v >= 10 ? "£%.1f" : "£%.2f", v); return; }
            if (u == 2) {
              const int m = (int) roundf(v * 60.0f);
              if (m < 60) snprintf(o, n, "%dm", m); else snprintf(o, n, "%dh%02d", m / 60, m % 60);
            } else num(v, o, n);
          };

          // ── last 7 days ──
          if (all || (mask & 8u)) {
            const bool un = ev & 8u;
            const int x = 48, y = 526, w = 600, h = 378;
            if (!all) it.filled_rectangle(x - 6, y - 6, w + 12, h + 12, PAPER);
            card(x, y, w, h, 4, false);
            chart_title(x + 32, y + 40, "LAST 7 DAYS", un, true);
            char tb[24];
            if (un) amt(w7s, tb, sizeof(tb)); else snprintf(tb, sizeof(tb), "£%.2f", w7c);
            it.print(x + w - 32, y + 40, id(f_cond), INK, TextAlign::CENTER_RIGHT, tb);
            float v7[7], mx = 0.001f;
            for (int i = 0; i < 7; i++) { v7[i] = un ? w7[i] : day_cost(u, w7[i]); mx = std::max(mx, v7[i]); }
            const float step = (w - 56) / 7.0f;
            const int bw = (int) (step * 0.6f), base = y + h - 60, bmax = base - (y + 136);
            for (int i = 0; i < 7; i++) {
              const int bx = x + 28 + (int) roundf(i * step + (step - bw) / 2), cx = bx + bw / 2;
              const int bh = std::max(4, (int) (v7[i] / mx * bmax));
              rbox(bx, base - bh, bw, bh, std::min(8, bh / 2), i == 6 ? INK : DARK);
              char lb[16];
              bar_lab(v7[i], un, lb, sizeof(lb));
              it.print(cx, base - bh - 8, id(f_bar), INK, TextAlign::BOTTOM_CENTER, lb);
              const int wd = today >= 0 ? (today - 6 + i + 7) % 7 : i;
              char d[2] = {days7[wd], 0};
              if (i == 6) {
                it.filled_circle(cx, base + 30, 18, INK);
                it.print(cx, base + 30, id(f_bar), PAPER, TextAlign::CENTER, d);
              } else {
                it.print(cx, base + 30, id(f_tiny), DARK, TextAlign::CENTER, d);
              }
            }
            it.filled_rectangle(x + 20, base, w - 40, 3, INK);
          }

          // ── last 30 days ──
          if (all || (mask & 16u)) {
            const bool un = ev & 16u;
            const bool sol = fS && un;                         // solar bars only in kWh
            const int x = 672, y = 526, w = 1152, h = 378;
            if (!all) it.filled_rectangle(x - 6, y - 6, w + 12, h + 12, PAPER);
            card(x, y, w, h, 4, false);
            chart_title(x + 32, y + 40, "LAST 30 DAYS", un);
            int lgx = x + w - 32;                                // legend, right to left
            for (int k = 0; k < 30; k += 10) it.filled_rectangle(lgx - 150 + k, y + 39, 6, 3, INK);
            it.print(lgx - 110, y + 40, id(f_tiny), INK, TextAlign::CENTER_LEFT, "Average");
            lgx -= 190;
            if (sol) {
              it.filled_rectangle(lgx - 110, y + 29, 22, 22, MID);
              it.print(lgx - 80, y + 40, id(f_tiny), INK, TextAlign::CENTER_LEFT, "Solar");
              lgx -= 150;
            }
            it.filled_rectangle(lgx - 130, y + 29, 22, 22, INK);
            it.print(lgx - 100, y + 40, id(f_tiny), INK, TextAlign::CENTER_LEFT, !un ? "Cost" : u == 0 ? "Import" : u == 1 ? "Litres" : "Hours");
            float v30[30] = {}, s2[30] = {};
            float mx = 0.1f, vpk = 0, vav = 0;
            int pk_i = -1;
            for (int i = 0; i < nd; i++) {
              v30[i] = un ? dv[i] : day_cost(u, dv[i]);
              s2[i] = sol ? ds[i] : 0;
              mx = std::max(mx, std::max(v30[i], s2[i]));
              vav += v30[i];
              if (v30[i] > vpk) { vpk = v30[i]; pk_i = i; }
            }
            vav = nd ? vav / nd : 0;
            const int px0 = x + 110, px1 = x + w - 30, top = y + 96, base = y + h - 64;
            const float ymax = nice_max(mx);
            for (int g = 0; g <= 4; g++) {
              const int gy = base - (int) ((base - top) * g / 4.0f);
              for (int xx = px0; xx < px1; xx += 6) it.draw_pixel_at(xx, gy, LIGHT);
              const float gv = ymax * g / 4.0f;
              if (un) it.printf(px0 - 14, gy, id(f_tiny), DARK, TextAlign::CENTER_RIGHT, ymax < 10 ? "%.1f" : "%.0f", gv);
              else    it.printf(px0 - 14, gy, id(f_tiny), DARK, TextAlign::CENTER_RIGHT, ymax < 10 ? "£%.1f" : "£%.0f", gv);
            }
            if (un) it.print(px0 - 14, base + 32, id(f_bar), MID, TextAlign::CENTER_RIGHT, UNIT[u]);
            const float slot = (px1 - px0) / 30.0f;
            const int off = 30 - nd;
            for (int i = 0; i < nd; i++) {
              const int sx = px0 + (int) ((i + off) * slot), cx = sx + (int) (slot / 2);
              const int hv = (int) ((base - top) * std::min(1.0f, v30[i] / ymax));
              const int hs = (int) ((base - top) * std::min(1.0f, s2[i] / ymax));
              const int bw = (int) (slot * (sol ? 0.36f : 0.66f));
              if (sol) {
                if (hv > 0) it.filled_rectangle(cx - bw - 1, base - hv, bw, hv, i == nd - 1 ? INK : DARK);
                if (hs > 0) it.filled_rectangle(cx + 1, base - hs, bw, hs, MID);
              } else if (hv > 0) {
                it.filled_rectangle(cx - bw / 2, base - hv, bw, hv, i == nd - 1 ? INK : DARK);
              }
              const bool last = i == nd - 1;
              if (last || (nd - 1 - i) % 5 == 0) {
                if (last) {
                  it.filled_circle(cx, base + 30, 18, INK);
                  it.printf(cx, base + 30, id(f_bar), PAPER, TextAlign::CENTER, "%.0f", dl[i]);
                } else {
                  it.printf(cx, base + 30, id(f_tiny), DARK, TextAlign::CENTER, "%.0f", dl[i]);
                }
              }
              if (i == pk_i && vpk > 0) {
                char lb[16];
                bar_lab(vpk, un, lb, sizeof(lb));
                it.print(cx, base - hv - 8, id(f_bar), INK, TextAlign::BOTTOM_CENTER, lb);
              }
            }
            if (vav > 0) {
              const int ay = base - (int) ((base - top) * std::min(1.0f, vav / ymax));
              for (int xx = px0; xx < px1; xx += 16) it.filled_rectangle(xx, ay - 1, 9, 3, INK);
              // its value, at the left end of the line (on white so it reads over the bars)
              char al[32], av[16];
              if (un) { amt(vav, av, sizeof(av)); snprintf(al, sizeof(al), "avg %s", av); }
              else    snprintf(al, sizeof(al), "avg £%.2f", vav);
              const int aw2 = text_w(id(f_bar), al) + 16;
              const int ly2 = ay - 24 < top - 10 ? ay + 24 : ay - 24;
              rbox(px0 + 6, ly2 - 16, aw2, 32, 16, INK);
              it.print(px0 + 14, ly2, id(f_bar), PAPER, TextAlign::CENTER_LEFT, al);
            }
            it.filled_rectangle(px0, base, px1 - px0, 3, INK);
          }

          // ── last 12 months ──
          float ytot = 0, ycost = 0, ysol = 0, yexp = 0, hi_v = 0, lo_v = 1e9f, best = 0;
          int hi_i = -1, lo_i = -1, best_i = -1, ydays = 0;
          for (int i = 0; i < nm; i++) {
            ytot += mv[i]; ycost += mon_cost(i); ysol += ms[i]; yexp += me[i]; ydays += days_of(i);
            const float pd = mv[i] / std::max(1, days_of(i));
            if (mv[i] > 0 && pd > hi_v) { hi_v = pd; hi_i = i; }
            if (mv[i] > 0 && pd < lo_v) { lo_v = pd; lo_i = i; }
            if (ms[i] > best) { best = ms[i]; best_i = i; }
          }
          if (all || (mask & 32u)) {
            const bool un = ev & 32u;
            const bool sol = fS && un;
            const int x = 48, y = 928, w = 1242, h = 448;
            if (!all) it.filled_rectangle(x - 6, y - 6, w + 12, h + 12, PAPER);
            card(x, y, w, h, 4, false);
            chart_title(x + 36, y + 42, "LAST 12 MONTHS", un, false, u == 1 ? "m³" : nullptr);
            static const char *NOTE[3] = {"£ incl. standing charge", "£ water + waste water incl. standing",
                                          "£ = boiler hours × cost per hour"};
            if (!un) it.print(x + w - 36, y + 42, id(f_tiny), DARK, TextAlign::CENTER_RIGHT, NOTE[u]);
            else if (sol) {
              it.filled_rectangle(x + w - 290, y + 31, 22, 22, INK);
              it.print(x + w - 258, y + 42, id(f_tiny), INK, TextAlign::CENTER_LEFT, "Import");
              it.filled_rectangle(x + w - 150, y + 31, 22, 22, MID);
              it.print(x + w - 118, y + 42, id(f_tiny), INK, TextAlign::CENTER_LEFT, "Solar");
            }
            const int px0 = x + 102, px1 = x + w - 28, top = y + 118, base = y + 372;
            const float div = (un && u == 1) ? 1000.0f : 1.0f;  // water in m³
            float v12[12] = {}, mx = 0.1f;
            for (int i = 0; i < nm; i++) {
              v12[i] = un ? mv[i] / div : mon_cost(i);
              mx = std::max(mx, std::max(v12[i], sol ? ms[i] : 0.0f));
            }
            const float ymax = nice_max(mx * 1.12f);
            for (int g = 0; g <= 4; g++) {
              const int gy = base - (int) ((base - top) * g / 4.0f);
              for (int xx = px0; xx < px1; xx += 6) it.draw_pixel_at(xx, gy, LIGHT);
              const float gv = ymax * g / 4.0f;
              if (un) it.printf(px0 - 14, gy, id(f_tiny), DARK, TextAlign::CENTER_RIGHT, ymax < 10 ? "%.1f" : "%.0f", gv);
              else    it.printf(px0 - 14, gy, id(f_tiny), DARK, TextAlign::CENTER_RIGHT, "£%.0f", gv);
            }
            if (un) it.print(px0 - 14, base + 32, id(f_bar), MID, TextAlign::CENTER_RIGHT, u == 1 ? "m³" : UNIT[u]);
            const float slot = (px1 - px0) / 12.0f;
            const int off = 12 - nm;
            for (int i = 0; i < nm; i++) {
              const int sx = px0 + (int) ((i + off) * slot), cx = sx + (int) (slot / 2);
              const int m = (int) ml[i];
              const int hv = (int) ((base - top) * std::min(1.0f, v12[i] / ymax));
              const int hs = sol ? (int) ((base - top) * std::min(1.0f, ms[i] / ymax)) : 0;
              if (sol) {
                if (hv > 0) it.filled_rectangle(cx - 38, base - hv, 36, hv, INK);
                if (hs > 0) it.filled_rectangle(cx + 2, base - hs, 36, hs, MID);
              } else if (hv > 0) {
                it.filled_rectangle(cx - 30, base - hv, 60, hv, INK);
              }
              char lb[16];
              if (!un)          snprintf(lb, sizeof(lb), "£%.0f", v12[i]);
              else if (u == 1)  snprintf(lb, sizeof(lb), "%.1f", v12[i]);
              else if (u == 2)  snprintf(lb, sizeof(lb), "%.0fh", v12[i]);
              else              snprintf(lb, sizeof(lb), "%.0f", v12[i]);
              it.print(cx, base - std::max(hv, hs) - 8, id(f_bar), INK, TextAlign::BOTTOM_CENTER, lb);
              const bool cur = now.is_valid() && i == nm - 1 && m == now.month;
              const char *lab = (m >= 1 && m <= 12) ? mn[m - 1] : "?";
              if (cur) {
                rbox(cx - 38, base + 14, 76, 36, 18, INK);
                it.print(cx, base + 32, id(f_bar), PAPER, TextAlign::CENTER, lab);
              } else {
                it.print(cx, base + 32, id(f_tiny), DARK, TextAlign::CENTER, lab);
              }
            }
            it.filled_rectangle(px0, base, px1 - px0, 3, INK);
          }

          // ── 12-month totals ──
          if (all) {
            const int x = 1322, y = 928;
            card(x, y, 502, 448, 4, false);
            it.print(x + 36, y + 42, id(f_label), INK, TextAlign::CENTER_LEFT, "12-MONTH TOTALS");
            char rv[40];
            int k = 0;
            auto row = [&](const char *label, const char *value) {
              const int yy = y + 90 + k++ * 56;
              it.print(x + 36, yy, id(f_small), DARK, label);
              const int room = 466 - 36 - text_w(id(f_small), label) - 20;
              it.print(x + 466, yy - 6 + (text_w(id(f_cond), value) <= room ? 0 : 6), fit(value, room, id(f_cond), id(f_small)),
                       INK, TextAlign::TOP_RIGHT, value);
            };
            auto month_name = [&](int i) { const int m = (int) ml[i]; return (m >= 1 && m <= 12) ? mn[m - 1] : "?"; };
            amt(ytot, rv, sizeof(rv));
            row(u == 0 ? "Imported" : u == 1 ? "Used" : "Boiler on", rv);
            snprintf(rv, sizeof(rv), "£%.2f", ycost);                         row("Cost", rv);
            if (u == 0 && fS) {
              snprintf(rv, sizeof(rv), "%.0f kWh", ysol);                     row("Solar", rv);
              snprintf(rv, sizeof(rv), "%.0f kWh", yexp);                     row("Exported", rv);
              const float yuse = ytot + ysol - yexp;
              snprintf(rv, sizeof(rv), "%.0f%%", yuse > 0 ? std::max(0.0f, std::min(100.0f, (ysol - yexp) / yuse * 100.0f)) : 0.0f);
              row("Solar share", rv);
              if (best_i >= 0) { snprintf(rv, sizeof(rv), "%s · %.0f", month_name(best_i), best); row("Best solar", rv); }
            } else {
              if (u == 0) { snprintf(rv, sizeof(rv), "%.0f kWh", yexp); row("Exported", rv); }
              if (u == 1) { snprintf(rv, sizeof(rv), "£%.2f", ydays * wstanding); row("Standing", rv); }
              char ab[24];
              amt(ydays ? ytot / ydays : 0.0f, ab, sizeof(ab));
              row("Per day", ab);
              if (hi_i >= 0) {
                amt(hi_v, ab, sizeof(ab));
                snprintf(rv, sizeof(rv), "%s · %s", month_name(hi_i), ab);
                row(u == 1 ? "Thirstiest" : "Highest", rv);
              }
              if (lo_i >= 0 && k < 6) {
                amt(lo_v, ab, sizeof(ab));
                snprintf(rv, sizeof(rv), "%s · %s", month_name(lo_i), ab);
                row("Lowest", rv);
              }
            }
          }
        }
      }



      // ───────── rooms: Home Assistant areas via sensor.panel_rooms ─────────
      // "area_id|name|temp|hum|co2|pm25|voc|voc_unit|lux|target|pinned;…", pinned first
      struct Room {
        std::string id, name, voc_u;
        float t, h, co2, pm, voc, lux, tgt;
        bool pin;
      };
      std::vector<Room> rooms;
      {
        auto fnum = [](const std::string &v) -> float {
          if (v.empty()) return NAN;
          char *e;
          float f = strtof(v.c_str(), &e);
          return e == v.c_str() ? NAN : f;
        };
        const std::string &src = id(hp_rooms).state;
        size_t pos = 0;
        while (pos < src.size() && rooms.size() < 48) {
          size_t end = src.find(';', pos);
          if (end == std::string::npos) end = src.size();
          const std::string rec = src.substr(pos, end - pos);
          pos = end + 1;
          std::string f[11];
          int k = 0;
          size_t q = 0;
          while (k < 11) {
            size_t e2 = rec.find('|', q);
            if (e2 == std::string::npos) { f[k++] = rec.substr(q); break; }
            f[k++] = rec.substr(q, e2 - q);
            q = e2 + 1;
          }
          if (k < 2 || f[0].empty()) continue;
          rooms.push_back(Room{f[0], f[1], f[7], fnum(f[2]), fnum(f[3]), fnum(f[4]), fnum(f[5]),
                               fnum(f[6]), fnum(f[8]), fnum(f[9]), f[10] == "1"});
        }
      }
      // optimistic changes until HA confirms (15 s)
      const bool pend_tg = !id(pend_area).empty() && millis() - id(pend_ms) < 15000;
      const bool pend_pn = !id(pend_pin_area).empty() && millis() - id(pend_pin_ms) < 15000;
      const std::string lead_id = pend_tg ? id(pend_area) : id(hp_lead).state;
      for (auto &r : rooms) {
        if (pend_tg && r.id == id(pend_area)) r.tgt = id(pend_t);
        if (pend_pn && r.id == id(pend_pin_area)) r.pin = id(pend_pin_on);
      }
      std::vector<int> pinned, others;
      for (int i = 0; i < (int) rooms.size(); i++) (rooms[i].pin ? pinned : others).push_back(i);
      if (pinned.size() > 6) pinned.resize(6);
      for (int i = 1; i < (int) others.size(); i++) {            // unpinned: A–Z
        int v = others[i], j = i - 1;
        while (j >= 0 && strcasecmp(rooms[others[j]].name.c_str(), rooms[v].name.c_str()) > 0) {
          others[j + 1] = others[j];
          j--;
        }
        others[j + 1] = v;
      }
      const bool fallback = pinned.empty();                        // nothing pinned yet: first 6 rooms
      std::vector<int> main_list, more_list;
      if (fallback) {
        for (int i = 0; i < (int) others.size(); i++) (i < 6 ? main_list : more_list).push_back(others[i]);
      } else {
        main_list = pinned;
        more_list = others;
      }
      const int hpages = std::max(1, ((int) more_list.size() + 8) / 9);
      id(heat_pages) = hpages;
      id(pin_count) = (int) pinned.size();
      if (id(more_page) >= hpages) id(more_page) = hpages - 1;
      {
        int sp = -1;                                               // where the offline chip jumps to
        bool found = false;
        for (int i : main_list) if (!found && std::isnan(rooms[i].t)) { sp = -1; found = true; }
        for (int j = 0; j < (int) more_list.size(); j++)
          if (!found && std::isnan(rooms[more_list[j]].t)) { sp = j / 9; found = true; }
        id(bar_sens_page) = sp;
      }

      // ═════════════════════════ HEATING PAGE ═════════════════════════
      if (id(page) == 2) {
        int lead = -1, ed = -1;
        for (int i = 0; i < (int) rooms.size(); i++) {
          if (rooms[i].id == lead_id) lead = i;
          if (rooms[i].id == id(edit_area)) ed = i;
        }
        if (ed < 0) id(edit_area) = "";
        id(lead_area) = lead_id;
        const bool pend_m = id(pend_mode) >= 0 && millis() - id(pend_mode_ms) < 15000;
        const bool heat_on = pend_m ? id(pend_mode) == 1 : id(heat_mode).state == "heat";
        const std::string act = id(heat_action).state;
        // the real boiler state when HA has it, otherwise the thermostat's call for heat
        const bool heating = id(boiler_on).has_state() ? id(boiler_on).state : heat_on && act == "heating";

        const uint32_t HERO = 1u << 7, GRID = 1u << 23;
        const bool d_hero = all || (mask & HERO);
        const bool d_grid = all || (mask & GRID);
        const int mp = id(more_page);
        const bool more = mp >= 0;

        if (all) top_bar("Heating", "Tap a room for its thermostat and pin");

        // ── layout of the room cards on screen: slot → room + rectangle ──
        struct Slot { int room, x, y, w, h; bool compact; };
        std::vector<Slot> slots;
        const int GX = 48, GY = 600, GW = 1776, GH = 632, GAP = 24;
        if (!more) {
          // pinned rooms grow to fill the space: 1–3 → one tall row, 4–6 → two rows
          const int n = (int) main_list.size();
          const int rows = n <= 3 ? 1 : 2;
          const int row0 = n <= 3 ? n : (n + 1) / 2;
          for (int j = 0; j < n; j++) {
            const int r = j < row0 ? 0 : 1;
            const int cnt = r == 0 ? row0 : n - row0;
            const int c = r == 0 ? j : j - row0;
            const int w = (GW - (cnt - 1) * GAP) / cnt;
            const int h = rows == 1 ? GH : (GH - GAP) / 2;
            slots.push_back({main_list[j], GX + c * (w + GAP), GY + r * (h + GAP), w, h, false});
          }
        } else {
          for (int j = 0; j < 9; j++) {
            const int k = mp * 9 + j;
            if (k >= (int) more_list.size()) break;
            const int c = j % 3, r = j / 3;
            slots.push_back({more_list[k], GX + c * 603, GY + r * 218, 570, 196, true});
          }
        }
        auto &sids = id(slot_ids);
        for (auto &sl : sids) sl.clear();
        for (int j = 0; j < (int) slots.size() && j < 9; j++) sids[j] = rooms[slots[j].room].id;

        // ── hero: leading room · boiler · heating time ──
        if (d_hero) {
          it.filled_rectangle(44, 196, 1784, 376, PAPER);
          card(48, 200, 1776, 368, 4, false);
          // leading room
          it.print(84, 236, id(f_label), DARK, TextAlign::CENTER_LEFT, "LEADING ROOM");
          const char *ln = lead >= 0 ? rooms[lead].name.c_str() : "None set";
          it.print(84, 262, fit(ln, 560, id(f_value), id(f_cond)), INK, ln);
          const float lt = lead >= 0 ? rooms[lead].t : NAN, lg = lead >= 0 ? rooms[lead].tgt : NAN;
          char tb[16];
          if (std::isnan(lt)) snprintf(tb, sizeof(tb), "--");
          else snprintf(tb, sizeof(tb), "%.1f°", TC(lt));
          it.print(84, 356, id(f_temp), INK, tb);
          const int tx0 = 84 + text_w(id(f_temp), tb) + 28;
          it.print(tx0, 420, id(f_icon_sm), DARK, TextAlign::CENTER_LEFT, "\U000F0393");
          if (std::isnan(lg)) it.print(tx0 + 42, 420, id(f_cond), DARK, TextAlign::CENTER_LEFT, "--");
          else it.printf(tx0 + 42, 420, id(f_cond), INK, TextAlign::CENTER_LEFT, "%.1f°", TC(lg));
          it.print(tx0, 466, id(f_tiny), DARK, TextAlign::CENTER_LEFT, "target");

          // boiler status + on/off
          it.filled_rectangle(660, 228, 2, 312, LIGHT);
          const char *st_icon = !heat_on ? "\U000F0AD8" : heating ? "\U000F0238" : "\U000F0438";
          it.filled_circle(744, 300, 54, heating ? INK : LIGHT);
          it.print(744, 300, id(f_plant), heating ? PAPER : INK, TextAlign::CENTER, st_icon);
          it.print(816, 300, id(f_cond), INK, TextAlign::CENTER_LEFT, !heat_on ? "OFF" : heating ? "HEATING" : "IDLE");
          if (!heat_on)
            it.print(690, 376, id(f_small), DARK, TextAlign::CENTER_LEFT, "Thermostat off");
          else if (heating && !std::isnan(lt) && !std::isnan(lg))
            it.printf(690, 376, id(f_small), DARK, TextAlign::CENTER_LEFT, "Boiler on · %.1f° to go", TD(std::max(0.0f, lg - lt)));
          else
            it.print(690, 376, id(f_small), DARK, TextAlign::CENTER_LEFT, heating ? "Boiler on" : "Boiler off · at target");
          if (!std::isnan(id(myTemperature).state))
            it.printf(690, 420, id(f_small), DARK, TextAlign::CENTER_LEFT, "Outside %.0f°", TC(id(myTemperature).state));
          card(690, 456, 420, 92, 4, heat_on);
          it.print(744, 502, id(f_icon_sm), heat_on ? PAPER : INK, TextAlign::CENTER, "\U000F0393");
          it.print(780, 502, id(f_cond), heat_on ? PAPER : INK, TextAlign::CENTER_LEFT, heat_on ? "Heating ON" : "Heating OFF");

          // heating time: today, this week, last 7 days
          it.filled_rectangle(1140, 228, 2, 312, LIGHT);
          auto hm_str = [](float h, char *out, size_t n) {
            if (std::isnan(h)) { snprintf(out, n, "--"); return; }
            int m = (int) roundf(h * 60.0f);
            if (m < 60) snprintf(out, n, "%dm", m);
            else        snprintf(out, n, "%dh %02dm", m / 60, m % 60);
          };
          char b1[24], b2[24];
          hm_str(id(ht_0).state, b1, sizeof(b1));
          hm_str(id(ht_week).state, b2, sizeof(b2));
          const float chr = id(heat_cost_h);
          it.print(1170, 236, id(f_label), DARK, TextAlign::CENTER_LEFT, "HEATING TIME");
          if (chr > 0 && !std::isnan(id(ht_0).state))
            it.printf(1170, 262, id(f_cond), INK, "Today %s · £%.2f", b1, id(ht_0).state * chr);
          else
            it.printf(1170, 262, id(f_cond), INK, "Today %s", b1);
          if (chr > 0 && !std::isnan(id(ht_week).state))
            it.printf(1170, 316, id(f_small), DARK, "This week %s · £%.2f", b2, id(ht_week).state * chr);
          else
            it.printf(1170, 316, id(f_small), DARK, "This week %s", b2);
          sensor::Sensor *hd[7] = {id(ht_6), id(ht_5), id(ht_4), id(ht_3), id(ht_2), id(ht_1), id(ht_0)};
          // daily limit in hours (a budget is turned into hours at the cost per hour)
          float lim = id(lim_budget) ? (chr > 0 ? id(lim_day_gbp) / chr : 0.0f) : id(lim_day_h);
          float hmax = std::max(1.0f, lim * 1.1f);
          for (auto *x : hd) if (!std::isnan(x->state)) hmax = std::max(hmax, x->state);
          const int base = 512, bmax = 116, bw = 62, step = 90, bx0 = 1176;
          for (int k = 0; k < 7; k++) {
            const float v = hd[k]->state;
            const int bx = bx0 + k * step;
            const int bh = std::isnan(v) ? 0 : std::max(3, (int) (v / hmax * bmax));
            const bool over = lim > 0 && !std::isnan(v) && v > lim;
            if (bh > 0) rbox(bx, base - bh, bw, bh, std::min(6, bh / 2), k == 6 || over ? INK : MID);
            if (!std::isnan(v)) it.printf(bx + bw / 2, base - bh - 6, id(f_bar), INK, TextAlign::BOTTOM_CENTER, "%.1f", v);
            if (now.is_valid()) {
              static const char *dl = "MTWTFSS";
              const int dow = (((now.day_of_week + 5) % 7) - (6 - k) + 14) % 7;   // 0 = Monday
              char d[2] = {dl[dow], 0};
              it.print(bx + bw / 2, base + 20, id(f_label), k == 6 ? INK : DARK, TextAlign::CENTER, d);
            }
          }
          it.filled_rectangle(bx0 - 6, base, 6 * step + bw + 12, 2, INK);
          if (lim > 0) {                                   // dashed daily-limit line
            const int ly = base - (int) (lim / hmax * bmax);
            for (int xx = bx0 - 6; xx < bx0 + 6 * step + bw + 6; xx += 14) it.filled_rectangle(xx, ly - 1, 8, 3, INK);
          }
          it.print(1800, 236, id(f_tiny), DARK, TextAlign::CENTER_RIGHT, lim > 0 ? "hours / day · - - limit" : "hours / day");
        }
        zone(690, 456, 420, 92, 5, 0);

        // ── room cards ──
        auto extras = [&](const Room &r, int maxw, char *out, size_t n) {
          char parts[4][32];
          int np = 0;
          if (!std::isnan(r.co2)) snprintf(parts[np++], 32, "CO2 %.0f ppm", r.co2);
          if (!std::isnan(r.pm))  snprintf(parts[np++], 32, "PM2.5 %.0f", r.pm);
          if (!std::isnan(r.voc)) {
            if (r.voc_u == "ppm") snprintf(parts[np++], 32, "VOC %.1f ppm", r.voc);
            else                  snprintf(parts[np++], 32, "VOC %.0f %s", r.voc, r.voc_u.c_str());
          }
          if (!std::isnan(r.lux)) snprintf(parts[np++], 32, "%.0f lx", r.lux);
          out[0] = 0;
          for (int k = np; k > 0; k--) {
            out[0] = 0;
            for (int j = 0; j < k; j++) {
              if (j) strncat(out, "  ·  ", n - strlen(out) - 1);
              strncat(out, parts[j], n - strlen(out) - 1);
            }
            if (text_w(id(f_bar), out) <= maxw) return;
          }
          out[0] = 0;
        };

        // buttons inside a card in edit mode: 3 presets, pin, close (rects + zones)
        struct Btn { int x, y, w, h; };
        auto edit_layout = [&](const Slot &s, Btn *pre, Btn &pin, Btn &cls) {
          const int pad = s.compact ? 24 : 32;
          cls = {s.x + s.w - pad - 64, s.y + (s.compact ? 14 : 20), 64, 56};
          if (s.compact) {
            const int y = s.y + 84, h = 96, bw = (s.w - 2 * pad - 3 * 12) / 4;
            for (int k = 0; k < 3; k++) pre[k] = {s.x + pad + k * (bw + 12), y, bw, h};
            pin = {s.x + pad + 3 * (bw + 12), y, bw, h};
          } else {
            const bool tall = s.h >= 500;
            const int bw = std::min(260, (s.w - 2 * pad - 2 * 16) / 3), bh = tall ? 150 : 96;
            const int total = 3 * bw + 32, x0 = s.x + (s.w - total) / 2;      // centred in wide cards
            const int y = tall ? s.y + s.h / 2 - bh / 2 - 20 : s.y + 110;
            for (int k = 0; k < 3; k++) pre[k] = {x0 + k * (bw + 16), y, bw, bh};
            pin = {x0, s.y + s.h - (tall ? 120 : 80), total, tall ? 88 : 62};
          }
        };

        auto room_card = [&](const Slot &s) {
          const Room &r = rooms[s.room];
          const int x = s.x, y = s.y, w = s.w, h = s.h;
          const bool is_lead = s.room == lead, editing = s.room == ed;
          const bool tall = h >= 500;
          it.filled_rectangle(x - 4, y - 4, w + 8, h + 8, PAPER);
          const int pad = s.compact ? 28 : 32;

          if (editing) {
            // ── thermostat controls inside the card ──
            card(x, y, w, h, 6, false);
            Btn pre[3], pin, cls;
            edit_layout(s, pre, pin, cls);
            it.print(x + pad, y + (s.compact ? 42 : 40), fit(r.name.c_str(), cls.x - x - pad - 16,
                     s.compact ? id(f_label) : id(f_cond), id(f_bar)), INK, TextAlign::CENTER_LEFT, r.name.c_str());
            if (!s.compact) {
              char nb[48];
              if (std::isnan(r.t)) snprintf(nb, sizeof(nb), "Now --");
              else if (std::isnan(r.tgt)) snprintf(nb, sizeof(nb), "Now %.1f°", TC(r.t));
              else snprintf(nb, sizeof(nb), "Now %.1f° · target %.1f°", TC(r.t), TC(r.tgt));
              it.print(x + pad, y + 84, id(f_small), DARK, TextAlign::CENTER_LEFT, nb);
            }
            rbox(cls.x, cls.y, cls.w, cls.h, 14, INK);
            it.print(cls.x + cls.w / 2, cls.y + cls.h / 2, id(f_icon_sm), PAPER, TextAlign::CENTER, "\U000F0156");
            for (int k = 0; k < 3; k++) {
              const float t = id(preset_t)[k];
              const bool on = !std::isnan(r.tgt) && fabsf(r.tgt - t) < 0.05f;
              const Btn &b = pre[k];
              rbox(b.x, b.y, b.w, b.h, 18, INK);
              if (!on) rbox(b.x + 4, b.y + 4, b.w - 8, b.h - 8, 14, PAPER);
              char pb[12];
              snprintf(pb, sizeof(pb), fmodf(TC(t), 1.0f) == 0 ? "%.0f°" : "%.1f°", TC(t));
              it.print(b.x + b.w / 2, b.y + b.h / 2, s.compact ? id(f_cond) : id(f_value), on ? PAPER : INK,
                       TextAlign::CENTER, pb);
            }
            id(edit_pinned) = r.pin;
            const bool full = !r.pin && pinned.size() >= 6;
            rbox(pin.x, pin.y, pin.w, pin.h, 18, r.pin ? INK : (full ? LIGHT : INK));
            if (!r.pin) rbox(pin.x + 4, pin.y + 4, pin.w - 8, pin.h - 8, 14, PAPER);
            const Color pc = r.pin ? PAPER : full ? LIGHT : INK;
            const char *pl = r.pin ? "Pinned" : full ? "6/6" : "Pin";
            if (s.compact) {
              it.print(pin.x + pin.w / 2, pin.y + 32, id(f_icon_sm), pc, TextAlign::CENTER, r.pin ? "\U000F0403" : "\U000F0931");
              it.print(pin.x + pin.w / 2, pin.y + 70, id(f_bar), pc, TextAlign::CENTER, pl);
            } else {
              const char *pl2 = r.pin ? "Pinned to the main page" : full ? "6/6 pinned" : "Pin to the main page";
              const int lw = 34 + 14 + text_w(id(f_cond), pl2);
              const int px = pin.x + (pin.w - lw) / 2;
              it.print(px + 17, pin.y + pin.h / 2, id(f_icon_sm), pc, TextAlign::CENTER, r.pin ? "\U000F0403" : "\U000F0931");
              it.print(px + 48, pin.y + pin.h / 2, id(f_cond), pc, TextAlign::CENTER_LEFT, pl2);
            }
            return;
          }

          // ── normal card ──
          const Color fg = is_lead ? PAPER : INK, sub = is_lead ? LIGHT : DARK;
          card(x, y, w, h, 4, is_lead);
          const bool flame = is_lead && heating;
          const int cw = flame ? 178 : 150;
          const int name_max = w - 2 * pad - (is_lead ? cw + 12 : 0);
          esphome::font::Font *nf = s.compact ? fit(r.name.c_str(), name_max, id(f_label), id(f_bar))
                                              : fit(r.name.c_str(), name_max, id(f_cond), id(f_label));
          it.print(x + pad, y + (s.compact ? 22 : 28), nf, fg, r.name.c_str());
          if (is_lead) {
            int cx2 = x + w - pad - cw, cy2 = y + (s.compact ? 18 : 26);
            rbox(cx2, cy2, cw, 42, 21, PAPER);
            if (flame) {
              it.print(cx2 + 26, cy2 + 21, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0238");
              it.print(cx2 + 46, cy2 + 21, id(f_bar), INK, TextAlign::CENTER_LEFT, "LEADING");
            } else {
              it.print(cx2 + cw / 2, cy2 + 21, id(f_bar), INK, TextAlign::CENTER, "LEADING");
            }
          }
          char tb[16], hb[16], gb[24], xb[96];
          if (std::isnan(r.t)) snprintf(tb, sizeof(tb), "--");
          else snprintf(tb, sizeof(tb), "%.1f°", TC(r.t));
          if (std::isnan(r.h)) snprintf(hb, sizeof(hb), "--");
          else snprintf(hb, sizeof(hb), "%.0f%%", r.h);
          if (std::isnan(r.tgt)) snprintf(gb, sizeof(gb), "--");
          else snprintf(gb, sizeof(gb), "%.1f°", TC(r.tgt));

          if (s.compact) {
            it.print(x + pad, y + 64, id(f_value), std::isnan(r.t) ? sub : fg, tb);
            int rx = x + w - pad;
            it.print(rx - 100, y + 98, id(f_icon_sm), sub, TextAlign::CENTER, "\U000F058E");
            it.print(rx, y + 98, id(f_small), fg, TextAlign::CENTER_RIGHT, hb);
            it.print(rx - 100, y + 148, id(f_icon_sm), sub, TextAlign::CENTER, "\U000F0393");
            it.print(rx, y + 148, id(f_small), fg, TextAlign::CENTER_RIGHT, gb);
            extras(r, w - 2 * pad - 150, xb, sizeof(xb));
            if (xb[0]) it.print(x + pad, y + 170, id(f_bar), sub, TextAlign::CENTER_LEFT, xb);
            return;
          }
          // big cards: larger temperature when tall, air / light readings listed when there's room
          it.print(x + pad, y + 90, tall ? id(f_temp) : id(f_value), std::isnan(r.t) ? sub : fg, tb);
          if (tall) {
            int ly = y + 250;
            auto row = [&](const char *k, const char *v) {
              if (ly > y + h - 130) return;
              it.print(x + pad, ly, id(f_small), sub, TextAlign::CENTER_LEFT, k);
              it.print(x + pad + 200, ly, id(f_cond), fg, TextAlign::CENTER_LEFT, v);
              ly += 56;
            };
            char v[32];
            if (!std::isnan(r.co2)) { snprintf(v, sizeof(v), "%.0f ppm", r.co2); row("CO2", v); }
            if (!std::isnan(r.pm))  { snprintf(v, sizeof(v), "%.0f", r.pm); row("PM2.5", v); }
            if (!std::isnan(r.voc)) {
              if (r.voc_u == "ppm") snprintf(v, sizeof(v), "%.1f ppm", r.voc);
              else snprintf(v, sizeof(v), "%.0f %s", r.voc, r.voc_u.c_str());
              row("VOC", v);
            }
            if (!std::isnan(r.lux)) { snprintf(v, sizeof(v), "%.0f lx", r.lux); row("Light", v); }
          } else {
            extras(r, w - 2 * pad, xb, sizeof(xb));
            if (xb[0]) it.print(x + pad, y + 200, id(f_bar), sub, TextAlign::CENTER_LEFT, xb);
          }
          const int ly = y + h - 52;
          it.print(x + pad + 16, ly, id(f_icon_sm), sub, TextAlign::CENTER, "\U000F058E");
          it.print(x + pad + 44, ly, id(f_small), fg, TextAlign::CENTER_LEFT, hb);
          it.print(x + pad + 196, ly, id(f_icon_sm), sub, TextAlign::CENTER, "\U000F0393");
          it.print(x + pad + 224, ly, id(f_small), fg, TextAlign::CENTER_LEFT, gb);
          if (!std::isnan(r.t) && !std::isnan(r.tgt)) {
            const float dlt = TD(r.t - r.tgt);
            it.printf(x + w - pad, ly, id(f_small), sub, TextAlign::CENTER_RIGHT, "%s%.1f°", dlt >= 0 ? "+" : "-", fabsf(dlt));
          }
        };

        // tap zones: every card, plus the controls of the card being edited (on top)
        for (int j = 0; j < (int) slots.size(); j++) zone(slots[j].x, slots[j].y, slots[j].w, slots[j].h, 1, j);
        for (const auto &sl : slots) {
          if (sl.room != ed) continue;
          Btn pre[3], pin, cls;
          edit_layout(sl, pre, pin, cls);
          for (int k = 0; k < 3; k++) zone(pre[k].x, pre[k].y, pre[k].w, pre[k].h, 2, k);
          zone(pin.x, pin.y, pin.w, pin.h, 3, 0);
          zone(cls.x - 12, cls.y - 12, cls.w + 24, cls.h + 24, 4, 0);
        }
        zone(48, 1256, 512, 100, 6, 0);
        if (more) {
          zone(1284, 1256, 260, 100, 7, 0);
          zone(1564, 1256, 260, 100, 8, 0);
        }

        if (d_grid) {
          it.filled_rectangle(40, 592, 1792, 776, PAPER);
          for (const auto &sl : slots) room_card(sl);
          if (rooms.empty()) {
            it.print(936, 880, id(f_cond), DARK, TextAlign::CENTER, offline_msg() ? offline_msg() : "No rooms yet");
            it.print(936, 940, id(f_small), DARK, TextAlign::CENTER,
                     "Add the Panel Rooms sensor to configuration.yaml and give areas a temperature sensor");
          }
          // ── bottom bar ──
          card(48, 1256, 512, 100, 4, false);
          if (more) {
            it.print(100, 1306, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0141");
            it.print(134, 1306, id(f_cond), INK, TextAlign::CENTER_LEFT, fallback ? "Main rooms" : "Pinned rooms");
            it.printf(922, 1306, id(f_cond), INK, TextAlign::CENTER, "Page %d of %d", mp + 1, hpages);
            card(1284, 1256, 260, 100, 4, false);
            it.print(1336, 1306, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0141");
            it.print(1366, 1306, id(f_cond), INK, TextAlign::CENTER_LEFT, "Prev");
            card(1564, 1256, 260, 100, 4, false);
            it.print(1720, 1306, id(f_cond), INK, TextAlign::CENTER_RIGHT, "Next");
            it.print(1764, 1306, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0142");
          } else {
            char mb[32];
            snprintf(mb, sizeof(mb), "More rooms (%d)", (int) more_list.size());
            it.print(84, 1306, id(f_cond), INK, TextAlign::CENTER_LEFT, mb);
            it.print(510, 1306, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0142");
            it.print(1824, 1306, id(f_small), DARK, TextAlign::CENTER_RIGHT,
                     fallback ? "No rooms pinned yet: tap a room, then Pin"
                              : "The leading room's sensor and target switch the boiler");
          }
        } else {
          // partial redraw: only the cards whose bit is set
          for (int j = 0; j < (int) slots.size(); j++)
            if (mask & (1u << (8 + j))) room_card(slots[j]);
        }
      }

      // ═════════════════════════ PLANT ROOM PICKER (long-press a plant) ═════════════════════════
      if (id(page) == 6) {
        const int pp = id(pick_plant);
        // every HA area, A–Z: "area_id|name|floor;…" (sensor.panel_plants)
        auto &ids = id(pick_ids);
        auto &nms = id(pick_names);
        auto &fls = id(pick_floors);
        ids.clear(); nms.clear(); fls.clear();
        {
          const std::string &src = id(plant_areas).state;
          size_t pos = 0;
          while (pos < src.size()) {
            size_t end = src.find(';', pos);
            if (end == std::string::npos) end = src.size();
            std::string f[3];
            if (end > pos && split(src.substr(pos, end - pos), f, 3) >= 2 && !f[0].empty()) {
              ids.push_back(f[0]); nms.push_back(f[1]); fls.push_back(f[2]);
            }
            pos = end + 1;
          }
        }
        const int per = 18, n = (int) ids.size(), pages = std::max(1, (n + per - 1) / per);
        if (id(pick_pg) >= pages) id(pick_pg) = pages - 1;
        const int pg6 = id(pick_pg);
        const std::string cur = pp >= 0 && pp < 15 ? id(plant_room)[pp] : std::string();
        if (all) {
          char title[48], sub[96];
          snprintf(title, sizeof(title), "Move %s", pp >= 0 && pp < 15 ? pname[pp] : "plant");
          if (cur.empty()) snprintf(sub, sizeof(sub), "Tap the room it's in");
          else             snprintf(sub, sizeof(sub), "Tap the room it's in · now: %s", cur.c_str());
          top_bar(title, ellipsize(id(f_small), sub, 820).c_str());
        }
        for (int j = 0; j < per; j++) {
          const int k = pg6 * per + j;
          if (k >= n) break;
          const int c = j % 3, r = j / 3;
          const int x = 48 + c * 600, y = 212 + r * 170, w = 576, h = 146;
          zone(x, y, w, h, 50, k);
          if (!all) continue;
          const bool here = nms[k] == cur;
          card(x, y, w, h, 4, here);
          const Color fg = here ? PAPER : INK, sc = here ? LIGHT : DARK;
          it.print(x + 32, fls[k].empty() ? y + h / 2 : y + h / 2 - 16, id(f_cond), fg, TextAlign::CENTER_LEFT,
                   ellipsize(id(f_cond), nms[k], w - 64 - (here ? 120 : 0)).c_str());
          if (!fls[k].empty())
            it.print(x + 32, y + h / 2 + 30, id(f_tiny), sc, TextAlign::CENTER_LEFT, ellipsize(id(f_tiny), fls[k], w - 64).c_str());
          if (here) it.print(x + w - 32, y + h / 2, id(f_bar), LIGHT, TextAlign::CENTER_RIGHT, "NOW");
        }
        zone(48, 1256, 320, 100, 51, 0);
        if (pages > 1) {
          zone(1284, 1256, 260, 100, 52, 0);
          zone(1564, 1256, 260, 100, 53, 0);
        }
        if (all) {
          if (n == 0)
            it.print(936, 700, id(f_cond), DARK, TextAlign::CENTER, "No rooms from Home Assistant yet (sensor.panel_plants)");
          card(48, 1256, 320, 100, 4, false);
          it.print(208, 1306, id(f_cond), INK, TextAlign::CENTER, "Cancel");
          if (pages > 1) {
            it.printf(826, 1306, id(f_cond), INK, TextAlign::CENTER, "Page %d of %d", pg6 + 1, pages);
            card(1284, 1256, 260, 100, 4, false);
            it.print(1336, 1306, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0141");
            it.print(1366, 1306, id(f_cond), INK, TextAlign::CENTER_LEFT, "Prev");
            card(1564, 1256, 260, 100, 4, false);
            it.print(1720, 1306, id(f_cond), INK, TextAlign::CENTER_RIGHT, "Next");
            it.print(1764, 1306, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0142");
          } else {
            it.print(1824, 1306, id(f_small), DARK, TextAlign::CENTER_RIGHT, "Also in HA: select.plant_N_room");
          }
        }
      }

      // ═════════════════════════ AGENDA PAGE ═════════════════════════
      // Calendar events for the next 7 days (left) and open tasks (right).
      // Tap a task to tick it off: it's marked done here straight away and
      // completed in its to-do list (Google Tasks etc.) through Home Assistant.
      if (id(page) == 5) {
        // how many calendars / to-do lists the records come from
        std::vector<std::string> cals, lists;
        for (const auto &e : evs) if (!e.cal.empty() && std::find(cals.begin(), cals.end(), e.cal) == cals.end()) cals.push_back(e.cal);
        for (const auto &t : tks) {
          const std::string &l = t.list.empty() ? t.ent : t.list;
          if (!l.empty() && std::find(lists.begin(), lists.end(), l) == lists.end()) lists.push_back(l);
        }
        const bool many_lists = lists.size() > 1;
        if (all) {
          char sub[96];
          if (cals.size() > 1 || many_lists)
            snprintf(sub, sizeof(sub), "Next 7 days · %d calendar%s · %d list%s", (int) cals.size(), cals.size() == 1 ? "" : "s",
                     (int) lists.size(), lists.size() == 1 ? "" : "s");
          else
            snprintf(sub, sizeof(sub), "Next 7 days · tap a task to tick it off");
          top_bar("Agenda", sub);

          // ── calendar: as many events as fit, then the next page (tap the footer) ──
          const int x = 48, y = 200, w = 1104, h = 1156, pad = 36;
          card(x, y, w, h, 4, false);
          it.print(x + pad + 17, y + 44, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F00ED");
          it.print(x + pad + 48, y + 44, id(f_label), INK, TextAlign::CENTER_LEFT, "CALENDAR");
          const int tcol = x + pad, ncol = x + pad + (id(clock_12h) ? 230 : 160);
          // split the events into pages first (a day heading repeats on a new page)
          std::vector<int> ev_page(evs.size(), 0);
          {
            int pg = 0, py = y + 92;
            std::string pday;
            for (size_t i = 0; i < evs.size(); i++) {
              bool nd = evs[i].date != pday;
              if (py + (nd ? 56 : 0) + 80 > y + h - 70) { pg++; py = y + 92; nd = true; }
              if (nd) { py += 48 + (py > y + 92 ? 8 : 0); pday = evs[i].date; }
              py += 84;
              ev_page[i] = pg;
            }
            id(ag_ev_pages) = evs.empty() ? 1 : pg + 1;
            if (id(ag_ev_pg) >= id(ag_ev_pages)) id(ag_ev_pg) = 0;
          }
          int yy = y + 92, shown = 0;
          std::string last_day;
          for (size_t i = 0; i < evs.size(); i++) {
            const auto &e = evs[i];
            if (ev_page[i] != id(ag_ev_pg)) continue;
            const bool new_day = e.date != last_day;
            if (new_day) {
              char dn[24];
              day_name(e.date, dn, sizeof(dn));
              const int diff = day_diff(e.date);
              if (diff <= 1 && e.date.size() >= 10) {           // "Today · 1 Nov"
                static const char *mo[12] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
                const int m = atoi(e.date.substr(5, 2).c_str());
                char tmp[32];
                snprintf(tmp, sizeof(tmp), "%s · %d %s", dn, atoi(e.date.substr(8, 2).c_str()), (m >= 1 && m <= 12) ? mo[m - 1] : "?");
                snprintf(dn, sizeof(dn), "%s", tmp);
              }
              if (shown) yy += 8;
              it.print(tcol, yy + 18, id(f_label), diff == 0 ? INK : DARK, TextAlign::CENTER_LEFT, dn);
              it.filled_rectangle(tcol + text_w(id(f_label), dn) + 20, yy + 18, x + w - pad - (tcol + text_w(id(f_label), dn) + 20), 2, LIGHT);
              yy += 48;
              last_day = e.date;
            }
            const bool past = !upcoming(e);
            const Color fg = past ? MID : INK, sub = past ? LIGHT : DARK;
            char tb[16], te[16];
            if (e.s.empty()) {
              rbox(tcol, yy + 6, ncol - tcol - 24, 40, 20, past ? LIGHT : INK);
              it.print(tcol + (ncol - tcol - 24) / 2, yy + 26, id(f_bar), PAPER, TextAlign::CENTER, "All day");
            } else {
              hhmm(e.s, tb, sizeof(tb));
              hhmm(e.e, te, sizeof(te));
              it.print(tcol, yy + 24, id(f_cond), fg, TextAlign::CENTER_LEFT, tb);
              if (!e.e.empty()) it.print(tcol, yy + 62, id(f_tiny), sub, TextAlign::CENTER_LEFT, te);
            }
            it.print(ncol, yy + 24, id(f_cond), fg, TextAlign::CENTER_LEFT,
                     ellipsize(id(f_cond), e.title, x + w - pad - ncol).c_str());
            if (!e.cal.empty()) it.print(ncol, yy + 62, id(f_tiny), sub, TextAlign::CENTER_LEFT, e.cal.c_str());
            yy += 84;
            shown++;
          }
          if (evs.empty()) {
            it.print(x + w / 2, y + 520, id(f_cond), DARK, TextAlign::CENTER,
                     id(ag_events).state.empty() || id(ag_events).state == "unknown" ? (offline_msg() ? offline_msg() : "No calendar data yet") : "Nothing planned this week");
            it.print(x + w / 2, y + 580, id(f_tiny), DARK, TextAlign::CENTER,
                     "Calendars are picked in packages/panel_agenda.yaml");
          }
        }
        // calendar pages: footer, tap → next page
        if (id(ag_ev_pages) > 1) {
          const int x = 48, y = 200, w = 1104, h = 1156;
          zone(x, y + h - 76, w, 76, 42, 1);
          if (all) {
            it.printf(x + 36, y + h - 40, id(f_small), DARK, TextAlign::CENTER_LEFT, "Page %d of %d", id(ag_ev_pg) + 1, id(ag_ev_pages));
            it.print(x + w - 36, y + h - 40, id(f_small), INK, TextAlign::CENTER_RIGHT, "Tap for more");
          }
        }

        // ── tasks ──
        {
          const int x = 1176, y = 200, w = 648, h = 1156, pad = 32, rh = 88, top = y + 84;
          const int per = 11;                                  // rows per page, footer below
          id(ag_tk_pages) = std::max(1, ((int) tks.size() + per - 1) / per);
          if (id(ag_tk_pg) >= id(ag_tk_pages)) id(ag_tk_pg) = 0;
          const int first = id(ag_tk_pg) * per;
          const int nmax = std::max(0, std::min(per, (int) tks.size() - first));
          auto &ti = id(task_ids);
          ti.clear();
          for (int k = 0; k < nmax; k++) ti.push_back(tks[first + k].uid + "|" + tks[first + k].ent);
          if (all) {
            card(x, y, w, h, 4, false);
            it.print(x + pad + 17, y + 44, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0756");
            it.print(x + pad + 48, y + 44, id(f_label), INK, TextAlign::CENTER_LEFT, "TASKS");
            int open = 0;
            for (const auto &t : tks) if (!is_done(t.uid)) open++;
            it.printf(x + w - pad, y + 44, id(f_bar), DARK, TextAlign::CENTER_RIGHT, "%d open", open);
            if (tks.empty()) {
              it.print(x + w / 2, y + 520, id(f_cond), DARK, TextAlign::CENTER, "All done");
              it.print(x + w / 2, y + 580, id(f_tiny), DARK, TextAlign::CENTER, "No open tasks in your lists");
            }
          }
          if (id(ag_tk_pages) > 1) {                           // tasks pages: footer, tap → next page
            zone(x, y + h - 76, w, 76, 41, 1);
            if (all) {
              it.printf(x + pad, y + h - 40, id(f_small), DARK, TextAlign::CENTER_LEFT, "Page %d of %d", id(ag_tk_pg) + 1, id(ag_tk_pages));
              it.print(x + w - pad, y + h - 40, id(f_small), INK, TextAlign::CENTER_RIGHT, "Tap for more");
            }
          }
          for (int k = 0; k < nmax; k++) {
            const int ry = top + k * rh;
            zone(x, ry, w, rh, 40, k);
            if (!all && !(mask & (1u << (8 + k)))) continue;
            const Tk &t = tks[first + k];
            const bool done = is_done(t.uid);
            it.filled_rectangle(x + 8, ry + 2, w - 16, rh - 4, PAPER);
            if (k) for (int xx = x + pad; xx < x + w - pad; xx += 6) it.draw_pixel_at(xx, ry, LIGHT);
            it.print(x + pad + 20, ry + rh / 2, id(f_icon_sm), done ? DARK : INK, TextAlign::CENTER,
                     done ? "\U000F0133" : "\U000F0130");
            char dt[64];
            due_text(t.due, dt, sizeof(dt));
            if (many_lists && !t.list.empty()) {                 // which list it's in: "Work · Due Fri"
              char tmp[64];
              snprintf(tmp, sizeof(tmp), dt[0] ? "%s · %s" : "%s%s", t.list.c_str(), dt);
              snprintf(dt, sizeof(dt), "%s", tmp);
            }
            const int tx = x + pad + 58, maxw = x + w - pad - tx;
            const int ty = dt[0] ? ry + 30 : ry + rh / 2;
            const std::string title = ellipsize(id(f_small), t.title, maxw);
            it.print(tx, ty, id(f_small), done ? MID : INK, TextAlign::CENTER_LEFT, title.c_str());
            if (done) it.filled_rectangle(tx, ty, text_w(id(f_small), title.c_str()), 3, MID);   // struck through
            if (dt[0]) {
              const bool late = t.due.size() >= 10 && day_diff(t.due) < 0;
              it.print(tx, ry + 64, id(f_tiny), done ? LIGHT : late ? INK : DARK, TextAlign::CENTER_LEFT,
                       ellipsize(id(f_tiny), dt, maxw).c_str());
            }
          }
        }
      }

      // ═════════════════════════ WI-FI (Settings → Device card) ═════════════════════════
      if (id(page) == 7) {
        const bool conn = wifi::global_wifi_component->is_connected();
        if (all) {
          top_bar("Wi-Fi", "Taking the panel somewhere else: add the Wi-Fi there");
          // ── Wi-Fi ──
          {
            const int x = 48, y = 200, w = 1776, h = 1032, pad = 40;
            card(x, y, w, h, 4, false);
            it.print(x + pad, y + 48, id(f_label), DARK, TextAlign::CENTER_LEFT, "WI-FI");
            const std::string ss = conn && !id(dev_ssid).state.empty() ? id(dev_ssid).state : std::string("Not connected");
            it.print(x + pad, y + 120, fit(ss.c_str(), w - 2 * pad, id(f_value), id(f_cond)), INK, TextAlign::CENTER_LEFT, ss.c_str());
            auto kv = [&](int k, const char *key, const char *val) {
              const int yy = y + 210 + k * 56;
              it.print(x + pad, yy, id(f_small), DARK, TextAlign::CENTER_LEFT, key);
              it.print(x + w - pad, yy, id(f_small), INK, TextAlign::CENTER_RIGHT, val);
            };
            char b[48];
            if (std::isnan(id(wifi_rssi).state) || !conn) snprintf(b, sizeof(b), "--");
            else snprintf(b, sizeof(b), "%.0f dBm", id(wifi_rssi).state);
            kv(0, "Signal", b);
            kv(1, "Panel IP address", conn && !id(dev_ip).state.empty() ? id(dev_ip).state.c_str() : "--");
            kv(2, "Home Assistant", id(ha_ok) ? "connected" : "not connected");
            kv(3, "Setup hotspot", "${ap_ssid}");
            static const char *help[] = {
              "Add Wi-Fi opens the panel's own hotspot and a QR code.",
              "Scan it with your phone, pick the network, type its",
              "password and save. The panel keeps the network you",
              "add last (back home, add your home Wi-Fi the same way).",
              "With no known Wi-Fi around, the setup opens by itself."};
            for (int k = 0; k < 5; k++)
              it.print(x + pad, y + 470 + k * 50, id(f_small), DARK, TextAlign::CENTER_LEFT, help[k]);
          }
        }
        // buttons (tap targets every time)
        {
          const int bx = 48 + 40, by = 200 + 1032 - 140, bw = 600, bh = 100;
          zone(bx, by, bw, bh, 60, 0);
          if (all) {
            card(bx, by, bw, bh, 4, true);
            it.print(bx + bw / 2, by + bh / 2, id(f_cond), PAPER, TextAlign::CENTER, "Add Wi-Fi");
          }
        }
        zone(1564, 1256, 260, 100, 62, 0);
        if (all) {
          card(1564, 1256, 260, 100, 4, true);
          it.print(1694, 1306, id(f_cond), PAPER, TextAlign::CENTER, "Back");
        }
      }

      // ═════════════════════════ WI-FI SETUP (hotspot + QR code) ═════════════════════════
      if (id(page) == 8) {
        if (all) {
          const int st = id(net_state);
          top_bar("Add Wi-Fi", st == 2 ? "Connected" : "Join the panel's hotspot from your phone");
          // QR code
          {
            const int x = 48, y = 200, w = 700, h = 1032;
            card(x, y, w, h, 4, false);
            const int scale = 14;
            const int qs = id(wifi_qr).get_size() * scale;
            const int qx = x + (w - qs) / 2, qy = y + 80;
            it.qr_code(qx, qy, id(wifi_qr), INK, scale);
            it.print(x + w / 2, qy + qs + 60, id(f_label), DARK, TextAlign::CENTER, "SCAN TO JOIN THE HOTSPOT");
            it.print(x + w / 2, qy + qs + 120, id(f_small), INK, TextAlign::CENTER, "${ap_ssid}");
            it.print(x + w / 2, qy + qs + 166, id(f_small), DARK, TextAlign::CENTER, "password: ${ap_password}");
          }
          // steps + status
          {
            const int x = 772, y = 200, w = 1052, h = 1032, pad = 44;
            card(x, y, w, h, 4, false);
            static const char *steps[4][2] = {
              {"Scan the code with your phone", "or join the Wi-Fi shown under it"},
              {"A setup page opens", "if it doesn't, open http://192.168.4.1"},
              {"Pick your Wi-Fi, type its password", "and press Save"},
              {"The panel connects", "and goes back to its pages by itself"}};
            for (int k = 0; k < 4; k++) {
              const int yy = y + 90 + k * 150;
              it.filled_circle(x + pad + 30, yy + 10, 30, INK);
              it.printf(x + pad + 30, yy + 10, id(f_cond), PAPER, TextAlign::CENTER, "%d", k + 1);
              it.print(x + pad + 84, yy - 6, id(f_cond), INK, TextAlign::CENTER_LEFT, steps[k][0]);
              it.print(x + pad + 84, yy + 40, id(f_small), DARK, TextAlign::CENTER_LEFT, steps[k][1]);
            }
            const int sy = y + h - 260;
            rbox(x + pad, sy, w - 2 * pad, 120, 28, st == 1 ? INK : LIGHT);
            const char *msg = st == 2 ? "Connected - going back"
                            : st == 1 ? "Hotspot on - waiting for you"
                                      : "Starting the hotspot (up to 30 s)...";
            it.print(x + w / 2, sy + 60, id(f_cond), st == 1 ? PAPER : INK, TextAlign::CENTER, msg);
          }
        }
        zone(1424, 1256, 400, 100, 63, 0);
        if (all) {
          card(1424, 1256, 400, 100, 4, false);
          it.print(1624, 1306, id(f_cond), INK, TextAlign::CENTER, "Cancel · restart");
          it.print(48, 1306, id(f_small), DARK, TextAlign::CENTER_LEFT,
                   "Cancel restarts the panel with the Wi-Fi it already knows");
        }
      }

      // ═════════════════════════ LIGHTS PAGE ═════════════════════════
      // "All lights" + page arrows 200–272 · room cards 296–1356, 3 × 2 a page, pinned
      // rooms first. Each card: name + pin, temperature / humidity / lux / motion,
      // main + mood light, up to 3 devices. Rooms, lights and devices come from Home
      // Assistant (labels panel_main_light / panel_mood_light / panel_device, see
      // packages/panel_lights.yaml); switches follow HA both ways.
      if (id(page) == 9) {
        struct Dev { std::string e, name, dom; int on; int bri = -1; };   // bri: % (−1: can't dim)
        struct LRoom { std::string area, name, temp, hum, lux, mot, row; bool pinned; Dev main, mood; std::vector<Dev> dev; };
        std::vector<LRoom> lr;
        {
          const std::string &src = id(lt_rows).state;
          size_t a = 0;
          while (a < src.size()) {
            size_t b = src.find(';', a);
            if (b == std::string::npos) b = src.size();
            const std::string r = src.substr(a, b - a);
            a = b + 1;
            std::vector<std::string> f;
            size_t p0 = 0;
            while (true) {
              size_t q = r.find('|', p0);
              f.push_back(r.substr(p0, q == std::string::npos ? std::string::npos : q - p0));
              if (q == std::string::npos) break;
              p0 = q + 1;
            }
            if (f.size() < 13) continue;
            auto st = [](const std::string &v) { return v == "1" ? 1 : v == "0" ? 0 : -1; };
            auto br = [](const std::string &v) { return v.empty() ? -1 : atoi(v.c_str()); };
            LRoom R{f[0], f[1], f[2], f[3], f[4], f[5], r, f[6] == "1",
                    {f[7], "Main", "light", st(f[8]), br(f[11])}, {f[9], "Mood", "light", st(f[10]), br(f[12])}, {}};
            for (size_t k = 13; k + 3 < f.size() && R.dev.size() < 3; k += 4)
              R.dev.push_back({f[k], f[k + 1], f[k + 2], st(f[k + 3])});
            lr.push_back(R);
          }
        }
        const int npg = std::max(1, ((int) lr.size() + 5) / 6);
        if (id(lt_pg) >= npg) id(lt_pg) = npg - 1;
        const int pg0 = id(lt_pg) * 6;
        // what a switch shows: a tap waiting for HA wins for 15 s
        auto shown = [&](const Dev &d) -> int {
          auto f = id(lt_pend).find(d.e);
          if (f != id(lt_pend).end() && millis() - id(lt_pend_ms)[d.e] < 15000) return f->second;
          return d.on;
        };

        if (all) top_bar("Lights", "Tap to switch · pin a room to keep it first");

        // ── All lights · pages ──
        {
          const bool draw = all || (mask & (1u << 1));
          const int y = 208, h = 72;
          int on = id(lt_all_pend) >= 0 && millis() - id(lt_all_ms) < 15000 ? id(lt_all_pend)
                 : id(lt_all).state == "1" ? 1 : id(lt_all).state == "0" ? 0 : -1;
          zone(48, y, 420, h, 72, on == 1 ? 0 : 1);
          if (draw) {
            if (!all) it.filled_rectangle(42, y - 6, 1788, h + 12, PAPER);
            rbox(48, y, 420, h, h / 2, INK);
            if (on != 1) rbox(51, y + 3, 414, h - 6, (h - 6) / 2, PAPER);
            const Color fg = on == 1 ? PAPER : INK;
            it.print(96, y + h / 2, id(f_icon), fg, TextAlign::CENTER, "\U000F1253");
            it.print(136, y + h / 2, id(f_cond), fg, TextAlign::CENTER_LEFT, "All lights");
            it.print(440, y + h / 2, id(f_small), fg, TextAlign::CENTER_RIGHT, on == 1 ? "On" : on == 0 ? "Off" : "--");
            if (lr.size() > 6) {
              char pb[40];
              snprintf(pb, sizeof(pb), "Rooms %d–%d of %d", pg0 + 1, std::min((int) lr.size(), pg0 + 6), (int) lr.size());
              it.print(1824 - 2 * 88 - 24, y + h / 2, id(f_small), DARK, TextAlign::CENTER_RIGHT, pb);
            }
          }
          if (lr.size() > 6) {
            const char *G[2] = {"\U000F0141", "\U000F0142"};
            for (int k = 0; k < 2; k++) {
              const int bx = 1824 - (2 - k) * 88 + 8;
              zone(bx - 8, y - 8, 88, h + 16, 73, k);
              if (!draw) continue;
              it.filled_circle(bx + 36, y + h / 2, 36, INK);
              it.print(bx + 36, y + h / 2, id(f_icon_sm), PAPER, TextAlign::CENTER, G[k]);
            }
          }
        }

        // ── room cards ──
        static const int CW = 576, CH = 518;
        auto dev_icon = [](const std::string &dom, const std::string &name) -> const char * {
          std::string n = name;
          for (auto &ch : n) ch = tolower(ch);
          if (dom == "fan" || n.find("fan") != std::string::npos) return "\U000F0210";
          if (dom == "media_player" || n.find("tv") != std::string::npos) return "\U000F0502";
          if (dom == "cover" || n.find("blind") != std::string::npos) return "\U000F00AC";
          if (dom == "light") return "\U000F0335";
          if (n.find("speaker") != std::string::npos) return "\U000F04C3";
          if (dom == "switch") return "\U000F07E8";
          return "\U000F0521";
        };
        for (int j = 0; j < 6; j++) {
          const int k = pg0 + j;
          id(lt_area)[j] = k < (int) lr.size() ? lr[k].area : "";
          for (int q = 0; q < 5; q++) { id(lt_ents)[j * 5 + q] = ""; id(lt_on)[j * 5 + q] = -1; }
          if (k >= (int) lr.size()) { id(lt_seen)[j] = ""; continue; }
          const LRoom &R = lr[k];
          const int x = 48 + (j % 3) * (CW + 24), y = 296 + (j / 3) * (CH + 24);
          const bool draw = all || (mask & (1u << (8 + j)));
          // switches: remember what's where (the touch handler uses it)
          const Dev *sw[5] = {&R.main, &R.mood, nullptr, nullptr, nullptr};
          for (int q = 0; q < (int) R.dev.size(); q++) sw[2 + q] = &R.dev[q];
          for (int q = 0; q < 5; q++) if (sw[q] && !sw[q]->e.empty()) {
            id(lt_ents)[j * 5 + q] = sw[q]->e;
            id(lt_on)[j * 5 + q] = shown(*sw[q]);
          }
          // tap targets (always registered, the card may not be redrawn)
          zone(x + CW - 96, y, 96, 84, 71, j);                                  // pin
          // main / mood: the top of the button switches, 30 / 50 / 100 % below (dimmable lights)
          const int bw = (CW - 56 - 16) / 2, BY = y + 118, BH = 138, TH = 72;
          const int chw = (bw - 24 - 16) / 3, chy = BY + 80, chh = 46;
          static const int LVL[3] = {30, 50, 100};
          for (int q = 0; q < 2; q++) {
            const Dev &d = q == 0 ? R.main : R.mood;
            const int bx = x + 28 + q * (bw + 16);
            if (d.e.empty() || d.on < 0) continue;
            const bool dim = d.bri >= 0;
            zone(bx, BY, bw, dim ? TH : BH, 70, j * 5 + q);
            if (dim)
              for (int c = 0; c < 3; c++) zone(bx + 12 + c * (chw + 8), chy, chw, chh, 74, (j * 5 + q) * 3 + c);
          }
          for (int q = 0; q < (int) R.dev.size(); q++) zone(x + 28, y + 268 + q * 80, CW - 56, 68, 70, j * 5 + 2 + q);
          if (!draw) continue;
          id(lt_seen)[j] = R.row;

          if (!all) it.filled_rectangle(x - 6, y - 6, CW + 12, CH + 12, PAPER);
          card(x, y, CW, CH, 4, false);
          // name + pin
          it.print(x + 28, y + 44, id(f_cond), INK, TextAlign::CENTER_LEFT, ellipsize(id(f_cond), R.name, CW - 140).c_str());
          if (R.pinned) it.filled_circle(x + CW - 50, y + 44, 26, INK);
          else          { it.filled_circle(x + CW - 50, y + 44, 26, INK); it.filled_circle(x + CW - 50, y + 44, 23, PAPER); }
          it.print(x + CW - 50, y + 44, id(f_icon_sm), R.pinned ? PAPER : INK, TextAlign::CENTER, R.pinned ? "\U000F0403" : "\U000F0931");
          // sensors
          {
            std::string sl;
            auto add = [&](const std::string &v) { if (!sl.empty()) sl += "  ·  "; sl += v; };
            if (!R.temp.empty()) add(R.temp + "°");
            if (!R.hum.empty()) add(R.hum + "%");
            if (!R.lux.empty()) add(R.lux + " lx");
            if (R.mot == "1") add("motion");
            else if (R.mot == "0") add("no motion");
            if (sl.empty()) sl = "No sensors in this room";
            it.print(x + 28, y + 90, id(f_small), DARK, TextAlign::CENTER_LEFT, ellipsize(id(f_small), sl, CW - 56).c_str());
          }
          // main + mood: name, state + brightness, then 30 / 50 / 100 % (when the light dims)
          for (int q = 0; q < 2; q++) {
            const Dev &d = q == 0 ? R.main : R.mood;
            const int bx = x + 28 + q * (bw + 16), by = BY, bh = BH;
            if (d.e.empty()) {
              for (int xx = bx; xx < bx + bw; xx += 8) { it.filled_rectangle(xx, by, 4, 2, MID); it.filled_rectangle(xx, by + bh - 2, 4, 2, MID); }
              for (int yy = by; yy < by + bh; yy += 8) { it.filled_rectangle(bx, yy, 2, 4, MID); it.filled_rectangle(bx + bw - 2, yy, 2, 4, MID); }
              it.print(bx + bw / 2, by + bh / 2, id(f_bar), MID, TextAlign::CENTER, q == 0 ? "No main light" : "No mood light");
              continue;
            }
            const int on = shown(d);
            const bool dim = d.bri >= 0 && on >= 0;
            // brightness: a tap waiting for HA, else what HA reports
            int bsel = -1, bpct = d.bri;
            {
              auto f = id(lt_bpend).find(d.e);
              if (f != id(lt_bpend).end() && millis() - id(lt_bpend_ms)[d.e] < 15000) bpct = f->second;
            }
            if (dim && on == 1)
              for (int c = 0; c < 3; c++) if (abs(bpct - LVL[c]) <= 4) bsel = c;
            rbox(bx, by, bw, bh, 26, on == -1 ? MID : INK);
            if (on != 1) rbox(bx + 3, by + 3, bw - 6, bh - 6, 23, PAPER);
            const Color fg = on == 1 ? PAPER : on == 0 ? INK : MID;
            const char *ic = q == 0 ? (on == 1 ? "\U000F06E8" : "\U000F0336") : (on == 1 ? "\U000F1A4C" : "\U000F1A4D");
            const int ty = dim ? by + TH / 2 + 2 : by + bh / 2;
            it.print(bx + 40, ty, id(f_icon_sm), fg, TextAlign::CENTER, ic);
            it.print(bx + 72, ty - 15, id(f_label), fg, TextAlign::CENTER_LEFT, d.name.c_str());
            char sb[24];
            if (on == 1 && dim && bpct > 0) snprintf(sb, sizeof(sb), "On · %d%%", bpct);
            else snprintf(sb, sizeof(sb), "%s", on == 1 ? "On" : on == 0 ? "Off" : "Unavailable");
            it.print(bx + 72, ty + 16, id(f_bar), fg, TextAlign::CENTER_LEFT, sb);
            if (!dim) continue;
            for (int c = 0; c < 3; c++) {
              const int cx = bx + 12 + c * (chw + 8);
              char lb[8];
              snprintf(lb, sizeof(lb), "%d", LVL[c]);         // % is in the state line above
              if (on == 1) {                                   // on a black button: white chips
                rbox(cx, chy, chw, chh, chh / 2, PAPER);
                if (c != bsel) rbox(cx + 3, chy + 3, chw - 6, chh - 6, (chh - 6) / 2, INK);
                it.print(cx + chw / 2, chy + chh / 2, id(f_bar), c == bsel ? INK : PAPER, TextAlign::CENTER, lb);
              } else {
                rbox(cx, chy, chw, chh, chh / 2, INK);
                rbox(cx + 3, chy + 3, chw - 6, chh - 6, (chh - 6) / 2, PAPER);
                it.print(cx + chw / 2, chy + chh / 2, id(f_bar), INK, TextAlign::CENTER, lb);
              }
            }
          }
          // devices
          for (int q = 0; q < 3; q++) {
            const int ry = y + 268 + q * 80;
            if (q >= (int) R.dev.size()) {
              if (q == (int) R.dev.size() && q == 0)
                it.print(x + 28, ry + 34, id(f_bar), MID, TextAlign::CENTER_LEFT, "More devices: label them panel_device in HA");
              continue;
            }
            const Dev &d = R.dev[q];
            const int on = shown(d);
            rbox(x + 28, ry, CW - 56, 68, 20, on == -1 ? MID : INK);
            rbox(x + 31, ry + 3, CW - 62, 62, 17, PAPER);
            it.print(x + 66, ry + 34, id(f_icon_sm), on == -1 ? MID : INK, TextAlign::CENTER, dev_icon(d.dom, d.name));
            it.print(x + 100, ry + 34, id(f_small), on == -1 ? MID : INK, TextAlign::CENTER_LEFT,
                     ellipsize(id(f_small), d.name, CW - 56 - 72 - 130).c_str());
            // switch: knob right = on
            const int sx = x + CW - 28 - 18 - 96, sy = ry + 12;
            if (on == -1) {
              it.print(x + CW - 46, ry + 34, id(f_bar), MID, TextAlign::CENTER_RIGHT, "unavailable");
            } else {
              rbox(sx, sy, 96, 44, 22, INK);
              if (on != 1) rbox(sx + 3, sy + 3, 90, 38, 19, PAPER);
              it.filled_circle(on == 1 ? sx + 74 : sx + 22, sy + 22, 16, on == 1 ? PAPER : INK);
            }
          }
        }
        if (all && lr.empty()) {
          card(336, 560, 1200, 400, 4, false);
          it.print(936, 680, id(f_value), INK, TextAlign::CENTER, "No rooms with lights yet");
          it.print(936, 790, id(f_small), DARK, TextAlign::CENTER, "Label lights panel_main_light / panel_mood_light, devices panel_device");
          it.print(936, 840, id(f_small), DARK, TextAlign::CENTER, "(packages/panel_lights.yaml explains it)");
        }
      }

      // ═════════════════════════ SETTINGS PAGE ═════════════════════════
      if (id(page) == 4) {
        if (all) top_bar("Settings", "Saved on this device · hold green for Home");
        const int RW = 864, RH = 80;
        // two tabs in the header: General · Alerts
        const int stab = id(set_tab) == 1 ? 1 : 0;
        {
          static const char *TABS[2] = {"General", "Alerts"};
          const int tw = 250, th = 66, tx0 = 936 - tw - 8, ty = 84;
          if (all) it.filled_rectangle(tx0 - 40, 70, 2 * tw + 96, 100, PAPER);   // over the page dots
          for (int k = 0; k < 2; k++) {
            const int x = tx0 + k * (tw + 16);
            zone(x, ty, tw, th, 43, k);
            if (!all) continue;
            rbox(x, ty, tw, th, th / 2, INK);
            if (k != stab) rbox(x + 3, ty + 3, tw - 6, th - 6, (th - 6) / 2, PAPER);
            it.print(x + tw / 2, ty + th / 2, id(f_cond), k == stab ? PAPER : INK, TextAlign::CENTER, TABS[k]);
          }
        }
        // one row: label on the left, option chips or a − value + stepper on the right
        auto row_box = [&](int x, int y, const char *label, bool draw) {
          if (!draw) return;
          it.filled_rectangle(x - 4, y - 4, RW + 8, RH + 8, PAPER);
          card(x, y, RW, RH, 4, false);
          it.print(x + 32, y + RH / 2, id(f_cond), INK, TextAlign::CENTER_LEFT, label);
        };
        auto chips = [&](int r, int x, int y, const char *label, const char *const *opts, int n, int sel, int action) {
          const bool draw = all || (mask & (1u << r));
          row_box(x, y, label, draw);
          int cx = x + RW - 16;
          for (int k = n - 1; k >= 0; k--) {
            const int cw = std::max(120, text_w(id(f_cond), opts[k]) + 44);
            cx -= cw;
            zone(cx, y + 6, cw, RH - 12, action, k);
            if (draw) {
              rbox(cx, y + 11, cw, RH - 22, (RH - 22) / 2, INK);
              if (k != sel) rbox(cx + 3, y + 14, cw - 6, RH - 28, (RH - 28) / 2, PAPER);
              it.print(cx + cw / 2, y + RH / 2, id(f_cond), k == sel ? PAPER : INK, TextAlign::CENTER, opts[k]);
            }
            cx -= 12;
          }
        };
        auto stepper = [&](int r, int x, int y, const char *label, const char *value, int action, int arg_base) {
          const bool draw = all || (mask & (1u << r));
          row_box(x, y, label, draw);
          const int bx_plus = x + RW - 16 - 80, bx_minus = bx_plus - 12 - 240 - 12 - 80;
          zone(bx_minus, y, 80, RH, action, arg_base);
          zone(bx_plus, y, 80, RH, action, arg_base + 1);
          if (!draw) return;
          for (int k = 0; k < 2; k++) {
            const int bx = k ? bx_plus : bx_minus;
            rbox(bx, y + 11, 80, RH - 22, (RH - 22) / 2, INK);
            it.print(bx + 40, y + RH / 2 - 2, id(f_value), PAPER, TextAlign::CENTER, k ? "+" : "-");
          }
          it.print(bx_minus + 80 + 12 + 120, y + RH / 2, fit(value, 236, id(f_cond), id(f_small)), INK, TextAlign::CENTER, value);
        };
        auto heading = [&](int x, int y, const char *t) {
          if (all) it.print(x + 4, y, id(f_label), DARK, TextAlign::CENTER_LEFT, t);
        };
        auto ry = [](int top, int k) { return top + 24 + k * 92; };   // row k under a heading at y = top

        const int L = 48, R = 960;
        static const char *o_theme[2] = {"Light", "Dark"};
        static const char *o_clock[2] = {"24 h", "12 h"};
        static const char *o_temp[2]  = {"°C", "°F"};
        static const char *o_press[3] = {"hPa", "mmHg", "inHg"};
        static const char *o_limit[2] = {"Time", "Budget"};
        char v[40];

        if (stab == 0) {
          // ── left: display ──
          const int D = 226;
          heading(L, D, "DISPLAY");
          chips(0, L, ry(D, 0), "Theme", o_theme, 2, id(theme_dark) ? 1 : 0, 20);
          chips(1, L, ry(D, 1), "Clock", o_clock, 2, id(clock_12h) ? 1 : 0, 21);
          chips(2, L, ry(D, 2), "Temperature", o_temp, 2, id(temp_f) ? 1 : 0, 22);
          chips(3, L, ry(D, 3), "Pressure", o_press, 3, id(press_unit), 23);
          {                                                   // touch feedback: two on / off chips
            const int y = ry(D, 4);
            const bool draw = all || (mask & (1u << 4));
            row_box(L, y, "Touch feedback", draw);
            static const char *o_fb[2] = {"Tick", "Border"};
            const bool on[2] = {id(fb_sound), id(fb_ui)};
            int cx = L + RW - 16;
            for (int k = 1; k >= 0; k--) {
              const int cw = std::max(140, text_w(id(f_cond), o_fb[k]) + 44);
              cx -= cw;
              zone(cx, y + 6, cw, RH - 12, 24, k);
              if (draw) {
                rbox(cx, y + 11, cw, RH - 22, (RH - 22) / 2, INK);
                if (!on[k]) rbox(cx + 3, y + 14, cw - 6, RH - 28, (RH - 28) / 2, PAPER);
                it.print(cx + cw / 2, y + RH / 2, id(f_cond), on[k] ? PAPER : INK, TextAlign::CENTER, o_fb[k]);
              }
              cx -= 12;
            }
          }

          {                                                   // screen refresh: every minute, or sleep between
            const int y = ry(D, 5);
            const bool draw = all || (mask & (1u << 17));
            row_box(L, y, "Refresh", draw);
            static const char *o_rf[6] = {"1m", "10m", "15m", "30m", "1h", "2h"};
            const int cw = 100, gap = 8;
            int cx = L + RW - 16 - 6 * cw - 5 * gap;
            for (int k = 0; k < 6; k++, cx += cw + gap) {
              zone(cx, y + 6, cw, RH - 12, 37, k);
              if (!draw) continue;
              rbox(cx, y + 11, cw, RH - 22, (RH - 22) / 2, INK);
              if (k != r_idx) rbox(cx + 3, y + 14, cw - 6, RH - 28, (RH - 28) / 2, PAPER);
              it.print(cx + cw / 2, y + RH / 2, id(f_small), k == r_idx ? PAPER : INK, TextAlign::CENTER, o_rf[k]);
            }
          }

          // ── left: night sleep ──
          {
            const int NS = ry(D, 6) + 18;
            heading(L, NS, "NIGHT SLEEP");
            if (all) it.print(L + RW - 4, NS, id(f_label), DARK, TextAlign::CENTER_RIGHT, "GREEN BUTTON WAKES IT FOR 5 MIN");
            static const char *o_ns[2] = {"Off", "On"};
            chips(27, L, ry(NS, 0), "Night sleep", o_ns, 2, id(night_on) ? 1 : 0, 47);
            auto hm = [&](int mins, char *o, size_t n) {
              const int h = mins / 60, m = mins % 60;
              if (id(clock_12h)) snprintf(o, n, "%d:%02d%s", h % 12 == 0 ? 12 : h % 12, m, h < 12 ? "am" : "pm");
              else               snprintf(o, n, "%02d:%02d", h, m);
            };
            hm(id(night_from), v, sizeof(v));
            stepper(28, L, ry(NS, 1), "Asleep from", v, 48, 0);
            hm(id(night_to), v, sizeof(v));
            stepper(29, L, ry(NS, 2), "Wake up at", v, 49, 0);
          }

          // ── right: thermostat choices ──
          const int T = 226;
          heading(R, T, "THERMOSTAT CHOICES ON ROOM CARDS");
          for (int k = 0; k < 3; k++) {
            char lb[16];
            snprintf(lb, sizeof(lb), "Choice %d", k + 1);
            snprintf(v, sizeof(v), "%.1f%s", TC(id(preset_t)[k]), TU);
            stepper(5 + k, R, ry(T, k), lb, v, 25, k * 2);
          }

          // ── right: plants ──
          const int P = 548;
          heading(R, P, "PLANTS");
          snprintf(v, sizeof(v), "%d glass%s", id(max_glasses), id(max_glasses) == 1 ? "" : "es");
          stepper(8, R, ry(P, 0), "Reservoir", v, 26, 0);
          snprintf(v, sizeof(v), "< %.1f day%s", id(dry_days), id(dry_days) == 1.0f ? "" : "s");
          stepper(9, R, ry(P, 1), "Water warning", v, 27, 0);
          {
            float m = (!std::isnan(id(pend_mult)) && millis() - id(pend_mult_ms) < 15000) ? id(pend_mult) : id(plant_mult).state;
            if (std::isnan(m)) snprintf(v, sizeof(v), "--"); else snprintf(v, sizeof(v), "×%.2f", m);
            stepper(10, R, ry(P, 2), "Drink multiplier", v, 28, 0);
          }
          {
            const int y = ry(P, 3);
            const bool draw = all || (mask & (1u << 11));
            row_box(R, y, "Sample plant settings", draw);
            const bool sent = id(samples_ms) && millis() - id(samples_ms) < 60000;
            zone(R + RW - 16 - 240, y, 240, RH, 29, 0);
            if (draw) {
              rbox(R + RW - 16 - 240, y + 11, 240, RH - 22, (RH - 22) / 2, INK);
              it.print(R + RW - 16 - 120, y + RH / 2, id(f_cond), PAPER, TextAlign::CENTER, sent ? "Loaded" : "Load");
            }
          }

          // ── right: device info (read-only) ──
          if (all) {
            const int I = 964;
            heading(R, I, "DEVICE");
            it.print(R + RW - 44, I, id(f_label), INK, TextAlign::CENTER_RIGHT, "WI-FI");
            it.print(R + RW - 14, I, id(f_icon_sm), INK, TextAlign::CENTER, "\U000F0142");
            card(R, I + 24, RW, 252, 4, false);
            char line[64];
            auto info = [&](int k, const char *key, const char *val) {
              it.print(R + 32, I + 64 + k * 44, id(f_small), DARK, TextAlign::CENTER_LEFT, key);
              it.print(R + RW - 32, I + 64 + k * 44, id(f_small), INK, TextAlign::CENTER_RIGHT, val);
            };
            info(0, "IP address", id(dev_ip).state.empty() ? "--" : id(dev_ip).state.c_str());
            if (std::isnan(id(wifi_rssi).state)) snprintf(line, sizeof(line), "--");
            else snprintf(line, sizeof(line), "%.0f dBm", id(wifi_rssi).state);
            info(1, "Wi-Fi signal", line);
            if (std::isnan(id(battery_level).state)) snprintf(line, sizeof(line), "--");
            else snprintf(line, sizeof(line), "%.0f%% · %.2f V", id(battery_level).state, id(battery_voltage).state);
            info(2, "Battery", line);
            const float up = id(dev_uptime).state;
            if (std::isnan(up)) snprintf(line, sizeof(line), "--");
            else snprintf(line, sizeof(line), "%dd %dh %dm", (int) up / 86400, ((int) up % 86400) / 3600, ((int) up % 3600) / 60);
            info(3, "Uptime", line);
            snprintf(line, sizeof(line), "%s · ESPHome %s", "${fw_version}", ESPHOME_VERSION);
          info(4, "Firmware", line);
          }

          // ── bottom: features – what the panels show (tap to switch on / off) ──
          {
            const int x = 48, y = 1256, w = 1492, h = 100;
            const bool draw = all || (mask & (1u << 16));
            static const char *f_name[6] = {"Energy", "Solar", "Water", "Heating", "Agenda", "Plants"};
            static const int f_bit[6] = {0, 5, 1, 2, 3, 4};             // chip → feature bit
            const int pm = id(feat_pend);
            const bool cur_b[6] = {id(show_energy), id(show_water), id(show_heating), id(show_agenda), id(show_plants), id(show_solar)};
            bool f_on[6], changed = false;
            for (int k = 0; k < 6; k++) {
              const bool c = cur_b[f_bit[k]];
              f_on[k] = pm >= 0 ? ((pm >> f_bit[k]) & 1) : c;
              changed |= f_on[k] != c;
            }
            if (draw) {
              it.filled_rectangle(x - 4, y - 4, w + 8, h + 8, PAPER);
              card(x, y, w, h, 4, false);
              if (changed) {                                   // picked, not applied yet
                it.print(x + 32, y + 38, id(f_cond), INK, TextAlign::CENTER_LEFT, "Features");
                it.print(x + 32, y + 74, id(f_bar), DARK, TextAlign::CENTER_LEFT, "applied on Done");
              } else {
                it.print(x + 32, y + h / 2, id(f_cond), INK, TextAlign::CENTER_LEFT, "Features");
              }
            }
            // filled = on, outlined = off (like the other option chips)
            const int cw = 188, gap = 10, cx0 = x + w - 16 - 6 * cw - 5 * gap;
            for (int k = 0; k < 6; k++) {
              const int cx = cx0 + k * (cw + gap);
              zone(cx, y + 6, cw, h - 12, 35, f_bit[k]);
              if (!draw) continue;
              rbox(cx, y + 14, cw, h - 28, (h - 28) / 2, INK);
              if (!f_on[k]) rbox(cx + 3, y + 17, cw - 6, h - 34, (h - 34) / 2, PAPER);
              it.print(cx + cw / 2, y + h / 2, id(f_cond), f_on[k] ? PAPER : INK, TextAlign::CENTER, f_name[k]);
            }
          }

          zone(R, 964 - 20, RW, 24 + 252 + 20, 64, 0);   // Device card → Wi-Fi
        }

        // ═══ tab 2: ALERTS ═══
        if (stab == 1) {
          // ── left: heating cost + limits (alert in the top bar when exceeded) ──
          const int H = 226;
          heading(L, H, "HEATING · ALERT WHEN OVER (0 = OFF)");
          snprintf(v, sizeof(v), "£%.2f / h", id(heat_cost_h));
          stepper(12, L, ry(H, 0), "Boiler cost", v, 31, 0);
          chips(13, L, ry(H, 1), "Limit by", o_limit, 2, id(lim_budget) ? 1 : 0, 32);
          auto hm = [](float h, char *o, size_t n) {
            const int m = (int) roundf(h * 60.0f);
            if (m == 0)           snprintf(o, n, "Off");
            else if (m % 60 == 0) snprintf(o, n, "%d h", m / 60);
            else                  snprintf(o, n, "%dh %02dm", m / 60, m % 60);
          };
          if (id(lim_budget)) {
            if (id(lim_day_gbp) <= 0) snprintf(v, sizeof(v), "Off"); else snprintf(v, sizeof(v), "£%.2f", id(lim_day_gbp));
          } else hm(id(lim_day_h), v, sizeof(v));
          stepper(14, L, ry(H, 2), "Per day", v, 33, 0);
          if (id(lim_budget)) {
            if (id(lim_week_gbp) <= 0) snprintf(v, sizeof(v), "Off"); else snprintf(v, sizeof(v), "£%.0f", id(lim_week_gbp));
          } else hm(id(lim_week_h), v, sizeof(v));
          stepper(15, L, ry(H, 3), "Per week", v, 34, 0);

          if (id(lim_budget)) {
            if (id(lim_month_gbp) <= 0) snprintf(v, sizeof(v), "Off"); else snprintf(v, sizeof(v), "£%.0f", id(lim_month_gbp));
          } else hm(id(lim_month_h), v, sizeof(v));
          stepper(18, L, ry(H, 4), "Per month", v, 44, 0);

          // electricity (grid import) and water: amounts per day / week / month
          auto amount = [&](float x, const char *fmt, char *o, size_t n) {
            if (x <= 0) snprintf(o, n, "Off"); else snprintf(o, n, fmt, x);
          };
          const int E = 226;
          heading(R, E, "ELECTRICITY · GRID IMPORT (0 = OFF)");
          amount(id(pw_lim)[0], "%.1f kWh", v, sizeof(v));  stepper(19, R, ry(E, 0), "Per day", v, 45, 0);
          amount(id(pw_lim)[1], "%.0f kWh", v, sizeof(v));  stepper(20, R, ry(E, 1), "Per week", v, 45, 2);
          amount(id(pw_lim)[2], "%.0f kWh", v, sizeof(v));  stepper(21, R, ry(E, 2), "Per month", v, 45, 4);
          const int Wt = 548;
          heading(R, Wt, "WATER (0 = OFF)");
          amount(id(wt_lim)[0], "%.0f L", v, sizeof(v));    stepper(22, R, ry(Wt, 0), "Per day", v, 46, 0);
          amount(id(wt_lim)[1], "%.0f L", v, sizeof(v));    stepper(23, R, ry(Wt, 1), "Per week", v, 46, 2);
          if (id(wt_lim)[2] <= 0) snprintf(v, sizeof(v), "Off");
          else if (id(wt_lim)[2] >= 1000) snprintf(v, sizeof(v), "%.2f m³", id(wt_lim)[2] / 1000.0f);
          else snprintf(v, sizeof(v), "%.0f L", id(wt_lim)[2]);
          stepper(25, R, ry(Wt, 2), "Per month", v, 46, 4);
          if (all) {
            card(R, 870, RW, 200, 4, false);
            it.print(R + 32, 912, id(f_label), INK, TextAlign::CENTER_LEFT, "HOW ALERTS SHOW");
            it.print(R + 32, 962, id(f_small), DARK, TextAlign::CENTER_LEFT, "A black chip in the top bar on every page,");
            it.print(R + 32, 1002, id(f_small), DARK, TextAlign::CENTER_LEFT, "and the Heating / Usage alert sensors in");
            it.print(R + 32, 1042, id(f_small), DARK, TextAlign::CENTER_LEFT, "Home Assistant (for your own notifications).");
          }
        }

        // Done
        zone(1564, 1256, 260, 100, 30, 0);
        if (all) {
          card(1564, 1256, 260, 100, 4, true);
          it.print(1694, 1306, id(f_cond), PAPER, TextAlign::CENTER, "Done");
        }
      }

      // ═════════════════════════ TOP BAR (every page) ═════════════════════════
      if (d_bar) {
        it.filled_rectangle(0, 0, it.get_width(), 62, PAPER);
        it.filled_rectangle(0, 60, it.get_width(), 2, LIGHT);
        auto &hit = id(bar_hit);
        hit = {-1, -1, -1, -1, -1, -1};
        char buf[48];

        // right: device stats, drawn right to left
        int rx = 1848;
        auto stat = [&](const char *glyph, const char *txt) {
          int w = text_w(id(f_bar), txt);
          it.print(rx, 31, id(f_bar), DARK, TextAlign::CENTER_RIGHT, txt);
          rx -= w + 8;
          it.print(rx, 31, id(f_icon_sm), DARK, TextAlign::CENTER_RIGHT, glyph);
          rx -= 34 + 26;
        };
        float rssi = id(wifi_rssi).state;
        if (std::isnan(rssi)) stat("\U000F092E", "--");
        else {
          snprintf(buf, sizeof(buf), "%.0f dBm", rssi);
          stat(rssi > -55 ? "\U000F0928" : rssi > -65 ? "\U000F0925" : rssi > -75 ? "\U000F0922" : "\U000F091F", buf);
        }
        float rt0 = id(room_temp).state, rh0 = id(room_hum).state;
        if (std::isnan(rt0)) stat("\U000F050F", "--");
        else { snprintf(buf, sizeof(buf), "%.1f° · %.0f%%", TC(rt0), rh0); stat("\U000F050F", buf); }
        float bl = id(battery_level).state, bv = id(battery_voltage).state;
        static const char *bicons[10] = {"\U000F007A", "\U000F007B", "\U000F007C", "\U000F007D", "\U000F007E",
                                         "\U000F007F", "\U000F0080", "\U000F0081", "\U000F0082", "\U000F0079"};
        if (std::isnan(bl)) stat("\U000F0091", "--");
        else {
          int k = std::min(10, std::max(0, (int) roundf(bl / 10.0f)));
          snprintf(buf, sizeof(buf), "%.0f%% · %.2f V", bl, bv);
          stat(k == 0 ? "\U000F0083" : bicons[k - 1], buf);
        }
        const int right_limit = rx;

        // left: warnings as black chips
        int lx = 20;
        auto chip = [&](const char *glyph, const char *txt) -> bool {
          int w = 16 + 34 + 10 + text_w(id(f_bar), txt) + 20;
          if (lx + w > right_limit - 16) return false;
          rbox(lx, 9, w, 44, 22, INK);
          it.print(lx + 16 + 17, 31, id(f_icon_sm), PAPER, TextAlign::CENTER, glyph);
          it.print(lx + 16 + 34 + 10, 31, id(f_bar), PAPER, TextAlign::CENTER_LEFT, txt);
          lx += w + 12;
          return true;
        };
        bool any = false;
        if (id(va_phase) > 0 && !id(va_text).empty()) {           // voice: listening / heard / reply
          const int maxw = right_limit - 16 - lx - (16 + 34 + 10 + 20);
          any |= chip("\U000F036C", ellipsize(id(f_bar), id(va_text), maxw).c_str());
        }
        if (!id(ha_ok)) any |= chip("\U000F07D0", "Home Assistant offline");
        if (n_thirsty > 0 && id(show_plants)) {
          if (n_thirsty == 1) snprintf(buf, sizeof(buf), "%s needs water", pname[first_thirsty]);
          else                snprintf(buf, sizeof(buf), "%d plants need water", n_thirsty);
          int x0 = lx;
          if (chip("\U000F1502", buf)) { hit[0] = x0; hit[1] = lx; any = true; }
        }
        if (id(ha_ok) && (id(show_heating) || id(show_plants))) {
          float off = id(hp_off_n).state;
          if (!std::isnan(off) && off > 0) {
            if (off == 1) snprintf(buf, sizeof(buf), "%s sensor offline", id(hp_offline).state.c_str());
            else          snprintf(buf, sizeof(buf), "%.0f room sensors offline", off);
            int x0 = lx;
            if (chip("\U000F1531", buf)) { hit[2] = x0; hit[3] = lx; any = true; }
          }
        }
        if (id(show_heating) && !id(heat_alert_pub).state.empty()) {
          int x0 = lx;
          if (chip("\U000F0238", id(heat_alert_pub).state.c_str())) { hit[4] = x0; hit[5] = lx; any = true; }
        }
        if (!id(usage_alert_pub).state.empty()) {               // power / water over a limit
          const std::string &ua = id(usage_alert_pub).state;
          any |= chip(ua.rfind("Water", 0) == 0 ? "\U000F058C" : "\U000F0241", ua.c_str());
        }
        if (!std::isnan(bl) && bl < 20) {
          snprintf(buf, sizeof(buf), "Battery low %.0f%%", bl);
          any |= chip("\U000F0083", buf);
        }
        if (!any) {
          it.print(24, 31, id(f_icon_sm), DARK, TextAlign::CENTER_LEFT, "\U000F05E1");
          it.print(66, 31, id(f_bar), DARK, TextAlign::CENTER_LEFT, "All good");
        }
      }
