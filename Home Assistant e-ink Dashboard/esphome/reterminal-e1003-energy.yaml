  # ── Lights page: rooms, their lights / devices and sensors (packages/panel_lights.yaml) ──
  - platform: homeassistant
    entity_id: sensor.panel_lights
    attribute: rows
    id: lt_rows
    internal: true
    on_value:
      - lambda: |-
          // HA caught up with a tap → drop the pending state
          auto &pd = id(lt_pend);
          for (auto it2 = pd.begin(); it2 != pd.end();) {
            const std::string key = "|" + it2->first + "|" + (it2->second ? "1" : "0");
            const bool done = x.find(key) != std::string::npos || millis() - id(lt_pend_ms)[it2->first] > 15000;
            if (done) { id(lt_pend_ms).erase(it2->first); it2 = pd.erase(it2); } else ++it2;
          }
          // brightness taps: HA's next update (after 2 s) carries the new level
          auto &bp = id(lt_bpend);
          for (auto it3 = bp.begin(); it3 != bp.end();) {
            if (millis() - id(lt_bpend_ms)[it3->first] > 2000) { id(lt_bpend_ms).erase(it3->first); it3 = bp.erase(it3); }
            else ++it3;
          }
          if (id(page) != 9) return;
          // redraw only the cards whose room changed; a different order → the whole page
          std::map<std::string, std::string> row;
          size_t a = 0;
          std::vector<std::string> order;
          while (a < x.size()) {
            size_t b = x.find(';', a);
            if (b == std::string::npos) b = x.size();
            const std::string r = x.substr(a, b - a);
            const size_t c = r.find('|');
            if (c != std::string::npos) { row[r.substr(0, c)] = r; order.push_back(r.substr(0, c)); }
            a = b + 1;
          }
          uint32_t m = 0;
          for (int j = 0; j < 6; j++) {
            const int k = id(lt_pg) * 6 + j;
            const std::string want = k < (int) order.size() ? order[k] : "";
            if (want != id(lt_area)[j]) { m = 0; id(force_full) = true; break; }
            if (!want.empty() && row[want] != id(lt_seen)[j]) m |= 1u << (8 + j);
          }
          if (id(force_full) || m) {
            id(dirty_mask) |= m;
            id(refresh_now).execute();
          }
