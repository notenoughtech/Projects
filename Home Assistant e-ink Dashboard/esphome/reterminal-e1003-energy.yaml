# ─────────────────────────────────────────────────────────────
# Plants
#
# Each plant has a water reservoir (ml), shown in HA as a number you can
# also set by hand. Every 5 minutes it loses:
#
#   ml per day = glass_ml / days × 2^((T − 20) / 10) × multiplier
#
# T is the indoor temperature (clamped 5–35 °C, 20 °C if unavailable).
# The 2^(ΔT/10) term doubles drinking/evaporation for every 10 °C above
# 20 °C and halves it for every 10 °C below. The multiplier tunes the lot.
# ─────────────────────────────────────────────────────────────
