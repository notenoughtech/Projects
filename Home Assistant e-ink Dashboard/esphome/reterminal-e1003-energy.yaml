    mode: restart
    then:
      - component.update: plant_summary_pub

  # A plant was tapped (not held): add one glass, redraw just that card
  - id: tap_plant
    mode: queued
    parameters:
      p: int
      bit: int
    then:
      - lambda: |-
          const char *names[15];
          for (int q_ = 0; q_ < 15; q_++) names[q_] = id(plant_nm)[q_].c_str();
          if (p < 0 || p >= 15 || names[p][0] == 0 || millis() - id(last_plant_tap) <= 350) return;
          ESP_LOGI("plants", "Tap → plant %d (%s): +1 glass", p + 1, names[p]);
          id(last_plant_tap) = millis();
          id(dirty_mask) |= (uint32_t) bit;
          id(add_glass).execute(p);

  # A plant held for 0.65 s: open the room picker for it
