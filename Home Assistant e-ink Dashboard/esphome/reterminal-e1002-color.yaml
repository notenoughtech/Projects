# ─────────────────────────────────────────────────────────────
# "Today" counters
# The energy sensors are lifetime totals, so each is snapshotted at
# midnight and "today" = current - snapshot. Snapshots survive
# reboots; after the very first flash they count from boot until
# the first midnight.
# ─────────────────────────────────────────────────────────────
globals:
  - id: ha_ok                      # Home Assistant connected over the API
    type: bool
    restore_value: false
    initial_value: "false"
  - id: wake_mode                  # 1 = woken by the timer: draw once, sleep again; 0 = awake
    type: int
    restore_value: false
    initial_value: "0"
  - id: draw_ok                    # false while a timer wake waits for Home Assistant's data
    type: bool
    restore_value: false
    initial_value: "true"
  - id: going_sleep                # the frame being drawn is the last one before sleeping
    type: bool
    restore_value: false
    initial_value: "false"
  - id: last_draw_ms               # when the screen was last redrawn (millis)
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: alert_sig                  # the alerts on screen – a change redraws early
    type: std::string
    restore_value: false
  - id: wake_hold_ms               # awake until (millis) after a button press – 5 min
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: night_now                  # inside the night sleep hours (Home Assistant helpers)
    type: bool
    restore_value: false
    initial_value: "false"
  - id: night_left_s               # seconds until the night sleep ends
    type: int
    restore_value: false
    initial_value: "0"
  - id: card_off                   # rotating card moved on / back with the buttons
    type: int
    restore_value: false
    initial_value: "0"
  - id: grid_avg                   # 1-minute rolling averages (W) for the solar + grid card
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: solar_avg
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: next_wake                  # next scheduled refresh, seconds after midnight
    type: int
    restore_value: false
    initial_value: "-1"
  - id: base_doy                   # day of the year the "today" baselines belong to
    type: int
    restore_value: true
    initial_value: "-1"
  - id: base_import
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: base_export
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: base_solar
    type: float
    restore_value: true
    initial_value: "NAN"
  # Water per weekday (index 0 = Monday), kept on the device
  - id: water_week
    type: std::array<float, 7>
    restore_value: true
    initial_value: "std::array<float, 7>{}"

# ─────────────────────────────────────────────────────────────
# Data from Home Assistant
# ─────────────────────────────────────────────────────────────
text_sensor:
