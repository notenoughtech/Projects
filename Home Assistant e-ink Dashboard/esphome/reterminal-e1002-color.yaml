# ═════════════════════════════════════════════════════════════
# reTerminal E1002 – colour version of the DIY panel (800×480, Spectra 6)
# Same layout and Home Assistant setup as xiao-esp32-eink.yaml, with one colour per
# utility, the same everywhere on the screen:
#   power = black · water = blue · heating = red · solar = green
#   plants = green accent with light blue (blue + white dots) water
# Buttons: green = redraw now (and wake from sleep) · left / right = previous / next card.
# ═════════════════════════════════════════════════════════════
esphome:
  name: reterminal-e1002
  friendly_name: reTerminal E1002
  includes:
    - <esp_sleep.h>
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable   # battery voltage divider must be on before GPIO1 is read
        - delay: 200ms
        - component.update: battery_voltage
        - component.update: battery_level
    - priority: -100
      then:
        - lambda: |-
            // woken by the sleep timer: draw once, sleep again (unless HA now says otherwise)
            id(wake_mode) = esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER ? 1 : 0;
            {
              const auto cause = esp_sleep_get_wakeup_cause();
              if (cause != ESP_SLEEP_WAKEUP_TIMER && cause != ESP_SLEEP_WAKEUP_UNDEFINED)
                id(wake_hold_ms) = millis() + 300000;   // woken by a button: awake for 5 min
            }
            id(draw_ok) = id(wake_mode) == 0;
            ESP_LOGI("sleep", "Boot: %s", id(wake_mode) ? "timer refresh" : "power on");
        - if:
            condition:
              lambda: 'return id(wake_mode) == 1;'
            then:
              - script.execute: timer_refresh
            else:
              - wait_until:
                  condition:
                    lambda: 'return id(ha_ok);'
                  timeout: 20s
              - delay: 3s
              - component.update: epaper_display

# ─────────────────────────────────────────────────────────────
# Home Assistant entity IDs – check these in
# Settings → Entities if anything shows 0 on the screen.
# ─────────────────────────────────────────────────────────────
substitutions:
  # Top row:
  #   "wide"  – clock and weather now in one dark card (2/3), 3 h forecast on the right
  #   "split" – clock card on the left half, a bordered weather card (now + 3 h) on the right
  top_layout: "split"
  # ── What this panel shows: true / false ───────────────────────────────────
  # Match these to the packages you installed in Home Assistant
  # (packages/panel_<feature>.yaml). Change one → install again.
  show_energy: "true"     # grid card, 12 h chart, 30-day energy view
  show_solar: "true"      # solar card, solar + forecast lines on the chart, solar in the 30-day view
  show_water: "true"      # water today / this week, 30-day water view
  show_heating: "true"    # heating view, heating alert
  show_agenda: "true"     # calendar + tasks view
  show_plants: "true"     # plants view, "needs water" alert

  grid_power: sensor.grid_power                     # W, + import / - export (flipped on device)
  grid_import_energy: sensor.grid_import_energy     # kWh lifetime total
  grid_export_energy: sensor.grid_export_energy     # kWh lifetime total
  solar_power: sensor.solar_power                   # W
  solar_energy: sensor.solar_energy                 # kWh lifetime total
  solar_forecast: sensor.power_production_now       # W, Forecast.Solar
  water_today: sensor.panel_water_today            # L today (packages/panel_water.yaml)
  # Today's kWh, reset at midnight by Home Assistant (packages/panel_energy.yaml and
  # panel_solar.yaml) – the same numbers on every panel. Missing: the panel counts
  # from its own midnight snapshot instead.
  import_today: sensor.grid_import_today
  export_today: sensor.grid_export_today
  solar_today: sensor.solar_energy_today
  # Worked out by Home Assistant (packages/panel_plants.yaml) – no E1003 needed
  plants_dry: sensor.panel_plants_needing_water
  rooms_summary: sensor.panel_rooms               # rooms built from HA areas
  thermostat: climate.house_thermostat   # your Generic Thermostat helper (sensor: Heating Leading Temperature)
  heat_alert: sensor.panel_heating_alert          # limits: prices card (packages/panel_core.yaml)
  usage_alert: sensor.panel_usage_alert           # electricity / water over a limit, "" = fine
  heat_cost: input_number.heating_cost_per_hour                # £ per hour of boiler run time (HA helper)
  water_price: input_number.water_price              # £ per m³
  water_standing: input_number.water_standing_charge            # £ per year
  waste_water_standing: input_number.waste_water_standing_charge # £ per year
  # ── Refresh, sleep and card rotation – set in Home Assistant ─────────────
  # (packages/panel_core.yaml makes these helpers; cards/panels-card.yaml shows them)
  #   refresh: every minute (always on) or every 5 / 10 / 15 / 30 min / 1 h / 2 h
  #            with deep sleep in between (the screen keeps the picture)
  #   stay awake: on = never sleep (for updates over Wi-Fi); takes effect at the next wake
  diy_refresh: input_select.e1002_panel_refresh
  diy_cards: input_select.e1002_panel_card_change
  diy_awake: input_boolean.e1002_panel_stay_awake
  # Colour e-ink has no partial refresh: every redraw flashes the whole screen for
  # ~20 s. While awake the panel redraws this often (and sooner when an alert changes).
  e1002_redraw: input_select.e1002_panel_redraw
  #   night sleep: on = asleep between "from" and "to" (no refreshes); a button wakes
  #                it for 5 min, then it sleeps again until the night is over
  diy_night: input_boolean.e1002_panel_night_sleep
  diy_night_from: input_datetime.e1002_panel_night_from
  diy_night_to: input_datetime.e1002_panel_night_to
  wake_hint: " · press green to wake"                    # footnote while asleep, e.g. " · press green to wake"

# Save restored values (today baselines, weekly water) at most every 10 min
# to spare the flash.
preferences:
  flash_write_interval: 10min

esp32:
  board: seeed_xiao_esp32s3        # the reTerminal E1002 runs an ESP32-S3
  framework:
    type: esp-idf

psram:
  mode: octal                      # room for the colour frame buffer

logger:
  hardware_uart: UART0             # the E10xx USB port (CH340) is on UART0

api:
  on_client_connected:
    - lambda: 'if (client_info.find("Home Assistant") != std::string::npos) id(ha_ok) = true;'
  on_client_disconnected:
    - lambda: 'if (client_info.find("Home Assistant") != std::string::npos) id(ha_ok) = false;'
  encryption:
    key: !secret reterminal_e1002__encryption_key

ota:
  - platform: esphome
    password: !secret reterminal_e1002__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "reTerminal E1002 Hotspot"
    password: !secret fallback_password

captive_portal:

